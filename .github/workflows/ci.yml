name: ci

# deep-dive-audit-and-testing-framework epic, playwright-e2e-scaffold-and-ci
# story. Before this workflow, the ONLY GitHub Actions workflow in this
# repo was tauri-release.yml, triggered on a version-tag push only -- zero
# CI gated a pull request on anything, despite CLAUDE.md's own "before
# considering any change done: npm test / npm run typecheck" bar. Runs
# both, plus the new Playwright E2E suite, on every PR and push.

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    # macOS, not ubuntu: src/lib/auth/real-chrome.ts's spawn-then-attach
    # mechanism is macOS-only by design (see that file's own
    # resolveRealChromePath()), and real-chrome.test.ts genuinely exercises
    # it for real -- confirmed live on this workflow's first real PR run,
    # which failed hard on ubuntu-latest with exactly that platform guard.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
