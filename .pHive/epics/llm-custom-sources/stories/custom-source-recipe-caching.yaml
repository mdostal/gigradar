design_decisions:
  - decision: "Recipe cache is a plain JSON file per source in the data dir, never config.json."
    rationale: "Recipes are derived/regenerable structural data, not user-authored settings -- binding recipe writes to config.json's schema-validate + encrypt-on-save path would mean every background recipe refresh re-validates and re-encrypts the whole config document for a pure performance cache. See design-discussion.md §5."
  - decision: "extractWithRecipe() returns null (not []) on zero-or-malformed results, and null specifically triggers the LLM fallback."
    rationale: "A recipe that legitimately finds zero listings this cycle (a real empty board) must be distinguishable from a recipe that's stale/broken -- conflating them would either silently under-report real zero-result scans as errors, or silently keep using a broken recipe forever without ever re-deriving it."

risks:
  - severity: medium
    description: "A site that occasionally, legitimately shows zero listings (a real slow day on a niche board) could trigger an unnecessary LLM re-derivation, since this mechanism can't distinguish 'genuinely empty' from 'selector broke' when the listItemSelector itself returns zero matches."
    mitigation: "Accepted for v1 -- an occasional extra LLM call on a genuinely-empty cycle is a low-cost false positive, far cheaper than the alternative failure mode (silently trusting a broken recipe indefinitely)."

