design_decisions:
  - decision: "getSource(sc.id) ?? (sc.kind===\"custom-llm\" ? customLlmSource : undefined) in runner.ts, not dynamic per-id registerSource() calls."
    rationale: "registerSource() throws on duplicate ids by design (a real safety net for hand-written adapters); re-registering per scan cycle (config can change while the scheduler is already running) means fighting that invariant. One static fallback object is simpler and never touches the registry's own invariants."
  - decision: "Headless chromium.launch() for this slice, not real-chrome.ts."
    rationale: "No auth, no bot-detection concern proven yet for a plain public custom source. Headless is materially cheaper for an unattended scheduler loop; browser-session.ts's headed-only rule is specific to sites already SHOWN to need it, not a blanket default."

risks:
  - severity: medium
    description: "A malicious or broken custom URL could point at something that isn't a job board at all (e.g. a search-results page for something else entirely), producing plausible-looking but meaningless Gig data."
    mitigation: "No mitigation beyond the existing no-fabricated-data rule and the owner's own judgment in choosing what URL to configure -- same trust boundary as every other config value in this repo (CLAUDE.md: config is user-authored, not sanitized against user intent)."

