id: dynamic-onboarding-ux-fixes
epic: dynamic-groups-band-audit
title: One-click Add custom source + domain-neutral setup wizard placeholders
status: complete
complexity: low
methodology: classic
depends_on: []

progress_note: |
  SHIPPED PR #162 (2026-09-06), via delegated subagent execution (not
  direct main-session implementation -- per this session's own process
  correction). Both changes built exactly as scoped: a new "+ Add custom
  source" button (isCustom: true + a starter "url" settings pair, with
  the URL field auto-focused via a new SettingsEditor focusValueKey/
  onFocused prop pair) sitting alongside the untouched original "+ Add
  source (blank)" button; setup wizard's three textarea placeholders
  replaced with domain-neutral hints. `npm test` (1608 passed at the
  time) and `npm run typecheck` both clean.

description: |
  Two real, small UX gaps found by this epic's own audit (see
  design-discussion.md §2) — both on the surface a brand-new,
  unrelated-domain user (e.g. someone starting a drone-services or
  AI-labeling group) touches FIRST, so they matter more than their size
  suggests for the "works for anyone, any domain" bar.

  1. `config-client.tsx`'s only way to add a custom (LLM-driven,
     any-site) source today is "+ Add source (blank)" (an empty row)
     followed by manually checking "Custom (LLM)". Add a real, explicit
     "+ Add custom source" button next to the existing "+ Add source
     (blank)" one that appends a row with `isCustom: true` already set
     (mirroring `handleAddSourceFromPreset()`'s own shape, just for the
     custom-source case instead of a known preset) — same underlying
     `SettingsEditor`/"Test extraction now" mechanism, just reachable in
     one click instead of two. Do NOT redesign the mechanism itself or
     add a dedicated multi-field wizard — that's explicitly out of scope
     (design-discussion.md §4).
  2. `setup-wizard-client.tsx`'s core-titles/keywords/red-keywords
     textarea placeholders (lines ~319/321/323) use fractional-exec
     examples ("fractional cto"/"staff engineer"/"recruiter"). Replace
     with genuinely domain-neutral placeholder text that doesn't
     presuppose any particular industry (e.g. a bracketed instruction
     like "e.g. a title you'd take immediately" rather than a real
     example title) — the point is the textarea being empty free text
     should not visually suggest "this tool is for fractional execs" to
     a first-time user in an unrelated field.

acceptance_criteria:
  - "A new '+ Add custom source' button on the Config page's Sources section appends a source row with isCustom already true (no manual checkbox toggle needed) and focuses/highlights the URL settings field so the next action is obvious."
  - "The existing '+ Add source (blank)' button and its behavior are unchanged -- this is an ADDITIONAL entry point, not a replacement."
  - "Setup wizard's core-titles/keywords/red-keywords placeholders no longer contain any fractional-exec-specific example text (fractional cto/staff engineer/recruiter or similar)."
  - "npm test and npm run typecheck both pass."

