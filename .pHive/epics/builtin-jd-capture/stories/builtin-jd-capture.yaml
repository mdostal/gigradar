design_decisions:
  - decision: Detail-fetch failures degrade to the snippet rather than throwing, unlike the list-fetch's throw-on-shape-failure rule
    rationale: Grill H1 -- a different-in-kind signal; one listing's enrichment failing is not the same as the whole source being broken.
  - decision: Fixed-size batches of 4 as the concurrency-bounding mechanism
    rationale: Grill H2 -- a naive Promise.all() over all listings wouldn't respect any stated cap; batching is concrete and directly testable.
  - decision: No cross-scan caching of already-detail-fetched listings
    rationale: Would require a Source.fetch() interface change affecting every adapter -- disproportionate to this one adapter's scope; a reasonable later optimization if real-world volume ever proves it necessary.

