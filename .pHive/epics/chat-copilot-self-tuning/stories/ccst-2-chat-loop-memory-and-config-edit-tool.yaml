design_decisions:
  - decision: "propose_config_edit takes a raw edits:object from the model, not a family of field-specific tools (addRedKeyword, setRateFloor, etc.)"
    rationale: "A narrow-tool family duplicates ConfigSchema's own job of defining what's valid, and needs a new tool every time a Config field is added. One generic tool + saveConfig()'s existing zod validation as the real backstop -- same 'do not build a second source of truth for Config validity' discipline this session already applied elsewhere. See structured-outline.md Part 4's elicitation."
  - decision: "note_preference is completely ungated"
    rationale: "Owner's own explicit ruling, 2026-09-02: approval gates config.json/behavior changes, not memory writes. A note is inert until a human approves a propose_config_edit that acts on it."
  - decision: "chatAutoApproveConfigEdits applies ONLY to propose_config_edit, no other write tool"
    rationale: "Owner's own words scoped it to 'config and impactful changes' as the thing needing approval by default -- the auto-fire toggle request was specifically about config edits ('change your preferences... add the indeed channel'), not about relaxing update_gig_status/generate_draft/run_scan's existing, separately-designed guardrails."

risks:
  - severity: high
    description: "A vague propose_config_edit.summary or a partial edits.groups/edits.sources array reaching saveConfig() -- see structured-outline.md Risks R1/R2"
    mitigation: "Tool description explicitly instructs exact field/value naming and complete-replacement-array semantics; saveConfig()'s zod validation is the real backstop; a dedicated test proves a partial groups edit doesn't silently drop sibling groups"
  - severity: medium
    description: "chatAutoApproveConfigEdits silently expanding scope to tools beyond propose_config_edit in a future edit to this file"
    mitigation: "The branch is written as an explicit tool===PROPOSE_CONFIG_EDIT_TOOL check, never a generic 'if autoApprove, skip pendingApproval for any tool' -- a reviewer should flag any change that widens this"

