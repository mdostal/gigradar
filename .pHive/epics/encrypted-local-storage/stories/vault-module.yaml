      purpose: "getDefaultDataDir()'s existing XDG-resolution pattern — key-path.ts mirrors this exact structure, rooted at XDG_CONFIG_HOME instead."

design_decisions:
  - decision: Key lives under XDG_CONFIG_HOME, data lives under XDG_DATA_HOME — deliberately separate directories
    rationale: Grill H1/research-brief's highest-named risk — a key stored next to the data it protects provides no real security margin over today's 0600-plaintext approach.
  - decision: getOrCreateKey() takes an injected hasAnyEncryptedFileFn() rather than knowing consumer file locations itself
    rationale: vault.ts is a generic primitives module; only the calling code (config/auth modules) knows where config.json, .env, and session files live. Keeps vault.ts free of cross-module knowledge while still allowing the accurate first-run-vs-lost-key check the collaborative review demanded.
  - decision: Tamper-detection test decodes base64 to raw bytes before flipping, rather than flipping the JSON text directly
    rationale: Collaborative review (test-coverage lens) — flipping JSON/base64 TEXT risks breaking base64 decoding itself (a different, less meaningful failure) instead of actually exercising GCM's auth-tag verification.

