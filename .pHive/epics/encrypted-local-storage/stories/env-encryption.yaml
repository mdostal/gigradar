design_decisions:
  - decision: Use dotenv.parse() on in-memory decrypted content instead of dotenv.config() reading the file itself
    rationale: dotenv.config() cannot accept already-decrypted content — it insists on reading its own file path. parse() is the documented, non-hand-rolled way to parse an in-memory KEY=VALUE string with the existing dependency.
  - decision: No internal-vs-external raw-read distinction needed for .env (unlike config.json's save.ts paths)
    rationale: .env is only ever read as part of loadConfig(), a single standalone externally-facing entry point — there's no equivalent to save.ts's internal-merge-read use case.

