risks:
  - severity: medium
    description: Getting the internal-vs-external raw-read distinction wrong could either silently break the validation-failure-leaves-file-untouched invariant, or leave the config UI's pre-populate path (readRawConfig()) failing to migrate legacy files.
    mitigation: Dedicated acceptance criteria and a specific regression test for the validation-failure case against a legacy plaintext fixture.

