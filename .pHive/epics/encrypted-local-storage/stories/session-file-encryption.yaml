    description: A bug in the migrate-on-read write could corrupt the user's OWN real, already-captured GoFractional session, requiring a re-login through the capture UI to recover.
    mitigation: Round-trip tests against a realistic fixture before touching any real session file; manual smoke test explicitly calls this out.

