design_decisions:
  - decision: Add visible error feedback to every call site regardless of the specific root cause found.
    rationale: "A link that can fail silently is a real, recurring risk even after this specific root cause is fixed -- matches the owner's own broader 'give me feedback when something happens' demand this session, and prevents this exact class of invisible failure from recurring for a different reason later."

risks:
  - severity: high
    description: "This is the single most concrete, owner-verified-broken feature in this whole session's work -- getting the fix wrong (or claiming it's fixed without the same live simman re-verification) would repeat exactly the failure mode that triggered this entire epic."
    mitigation: "Acceptance criteria explicitly requires a REAL post-fix simman re-run against the REAL rebuilt app with visionVerify passing, not a native-act-only pass and not just an automated test."

