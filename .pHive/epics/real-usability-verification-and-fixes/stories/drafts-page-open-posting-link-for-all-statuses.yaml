id: drafts-page-open-posting-link-for-all-statuses
epic: real-usability-verification-and-fixes
title: "Drafts page 'Open the real job listing' link should show for a draft in any status, not just approved/submitted"
status: complete
complexity: low
methodology: classic

progress_note: |
  SHIPPED, PR #188 (https://github.com/mdostal/gigradar/pull/188), not yet
  merged -- branch feat/drafts-page-open-posting-link-for-all-statuses
  pushed to origin, PR opened into dev, left unmerged per process.

  Investigation (git blame/history on drafts-client.tsx, as this story
  required before changing anything): the `showApprovedView` status gate
  traces back to e8f8cc3, the ORIGINAL draft-review-ui implementation
  (assisted-apply-drafting epic) -- its commit message describes "once
  approved: the real gig URL, a copy-ready draft, and a 'Mark submitted'
  action" as one bundled block. No commit, anywhere in the file's history,
  ever mentions a stale-listing concern or any other deliberate reason to
  withhold the URL specifically pre-approval. This is the exact same
  oversight shape fa9404c ("fix: surface rate/tier/source on every draft
  card, not hidden behind approval", #124) already found and fixed once
  for rate/tier/source data -- confirmed: no real reason held, this was an
  artifact of the original two-phase (edit-while-draft / act-once-approved)
  structure, not a safeguard. Removed the restriction.

  Fix: split the link out of the `showApprovedView` block into its own,
  unconditional render (right after the "Generated/Approved/Submitted"
  timestamp line, before the draft-vs-read-only branch) so it shows for
  status draft/approved/rejected/submitted alike. Copy-ready draft and
  "Mark submitted" remain gated to approved/submitted only -- untouched,
  per the story's explicit scope. Still wired through the real
  useOpenExternalLink()/ExternalLinkFeedbackToast mechanism from PR #187
  (external-link-click-silent-failure) -- no fire-and-forget click
  reintroduced.

  Tests: added src/app/drafts/__tests__/drafts-client.test.ts (5 new
  tests) using this repo's established no-RTL convention
  (renderToStaticMarkup()+createElement() on the exported DraftsClient,
  matching today-client.test.ts's own precedent) -- covers the link
  appearing for all 4 statuses (draft/approved/rejected/submitted) and a
  regression guard that copy-ready-draft/Mark submitted stay gated to
  approved/submitted only. npm test: 130 files, 1776 passed, 3 skipped
  (pre-existing, unrelated). npm run typecheck: clean.

  REAL post-fix verification against the actual running app (not just
  tests): built the real production bundle (`next build`), started it
  (`next start`) against an ISOLATED XDG_DATA_HOME data directory
  (/tmp, never touched the real ~/.local/share/gigradar), seeded via the
  real recordScan()+saveDraft() store functions with one real gig + one
  draft in status='draft' -- matching the owner's actual real data shape
  (17 real drafts, all status='draft'). Curled the real served
  http://127.0.0.1:4791/drafts page (HTTP 200) and confirmed the rendered
  HTML contains the "draft" status badge immediately followed by
  `<a href="https://example-real-employer.test/careers/fractional-cto-001"
  class="text-sm font-medium text-blue-700 hover:underline">Open the real
  job listing ↗</a>` -- the link genuinely renders for a draft-status
  entry in the real running app, not just in a unit test. Server process
  killed and the isolated verify data dir removed afterward.

  Work done in an isolated git worktree outside the main repo tree
  (/tmp/gigradar-worktrees/drafts-open-posting-link) branched off
  origin/dev, per this epic's standing process. No conflicts with dev at
  push time (branch was a clean fast-forward, one commit ahead). PR left
  open/unmerged for owner review, as instructed.
depends_on: []

description: |
  Triage entry t-004. Flagged by the developer who fixed
  `external-link-click-silent-failure`, confirmed via `simman` + a direct
  read of the owner's real data: `src/app/drafts/drafts-client.tsx`'s
  "Open the real job listing" link only renders for drafts with
  `status: 'approved'` or `'submitted'`. The owner's real, current data has
  17 drafts, ALL still in `status: 'draft'` (the normal state right after
  auto-draft or manual "Generate draft" creation, before the owner has
  reviewed/approved anything) -- meaning this link exists NOWHERE on the
  real Drafts page today, for any of the owner's real drafts. A user
  reviewing a fresh, not-yet-approved draft -- the single most common real
  use of this page -- has no way to open the original posting from it at
  all, which is exactly the kind of thing the owner has been furious about
  this session ("I can't open the actual jobs to go check it out").

  **The fix**: show the "Open the real job listing" link (wired through
  `openExternalUrl()`/`useOpenExternalLink()`, matching the just-shipped
  `external-link-click-silent-failure` story's real error-feedback
  mechanism -- reuse it, don't reintroduce a fire-and-forget click) for a
  draft in ANY status, not just approved/submitted. Read the real current
  code first to understand why the status check was there in the first
  place (check git blame/history on that condition) -- if there was a real
  reason to restrict it (e.g. a submitted draft's original listing might
  have gone stale/archived and the link is only meaningful before that),
  confirm whether that reasoning still holds; if not, or if it was simply
  an oversight, remove the restriction.

  Do NOT touch: the draft approval/submission workflow itself, any other
  Drafts page functionality.

acceptance_criteria:
  - "The 'Open the real job listing' link is visible on the Drafts page for a draft in status 'draft' (not just approved/submitted) -- verified against the owner's own real data shape (17 real drafts, all status='draft')."
  - "The link uses the same real error-feedback mechanism (useOpenExternalLink()/ExternalLinkFeedbackToast) the external-link-click-silent-failure story just shipped -- not a reintroduced fire-and-forget click."
  - "Real post-fix verification against the ACTUAL running app: rebuild, relaunch (backup first), and confirm via curl/DOM evidence or a real simman re-run that the link now appears for a real draft-status entry."
  - "npm test and npm run typecheck both pass."

