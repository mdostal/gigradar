    description: Wellfound's __NEXT_DATA__ shape is an undocumented internal API surface that could change without notice.
    mitigation: Accepted, same risk class this project already carries for Braintrust's JSON API and BuiltIn's HTML shape -- throw loud on an unrecognized shape.

