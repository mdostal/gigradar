    ref: "live npm run radar run; confirm real listings from at least one new source in the store"
  verify_at: "story integrate step"
  owner: developer

risks:
  - severity: medium
    description: HTML-scraping fragility — a markup change on any of these three sites breaks that adapter.
    mitigation: Accepted, same posture as builtin.ts already ships with; throw loud on an unrecognized shape rather than silently degrading.
  - severity: medium
    description: A naive config-activation write could silently wipe the owner's existing 4 sources.
    mitigation: Dedicated acceptance criterion and test for the read-merge-write requirement.

