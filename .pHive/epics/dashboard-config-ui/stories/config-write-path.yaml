risks:
  - severity: high
    description: A save.ts that accidentally imports or derives from loadConfig()'s resolved output would silently write real secrets to disk in plaintext — the single worst possible outcome for this epic, and one that would "work" (no crash, no visible error) while quietly leaking credentials.
    mitigation: The review step explicitly greps for any loadConfig()/resolveSourceEnvReferences() import in save.ts, and the secret-preservation test independently re-reads raw file bytes (not through any resolving function) to prove the guarantee holds, not just that the code "ran."

references:
