design_decisions:
  - decision: Localhost-only binding by default
    rationale: Team review (security-reviewer) — Next's default 0.0.0.0 binding plus zero auth layer would expose pipeline/config data to anyone on the same LAN. A user who wants LAN access can override the host flag themselves; that's their explicit choice, not this epic's default.
  - decision: This story is a checkpoint, not a vertical slice
    rationale: Team review (tpm) — has zero user-visible value on its own; must be tracked/estimated honestly, not as if it were a shippable increment.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md's roadmap to mark app-router/UI foundation as in-progress, and note the localhost-only binding default in a new 'Running the dashboard' section."

