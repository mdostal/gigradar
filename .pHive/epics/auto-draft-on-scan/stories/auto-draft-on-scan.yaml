risks:
  - severity: medium
    description: A large backlog of unseen green-tier matches on first enabling this could still spend real API cost across several cycles even with the per-cycle cap.
    mitigation: Accepted -- the cap bounds PER-CYCLE spend; total backlog drain is bounded by the schedule's own cadence, which the owner controls.

