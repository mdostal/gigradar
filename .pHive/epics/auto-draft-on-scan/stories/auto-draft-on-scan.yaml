design_decisions:
  - decision: Both API-key and apply-profile prerequisites checked once per cycle, not discovered per-gig via stageApplication()'s own errors
    rationale: Grill H1 -- a realistic misconfiguration (key set, profile not) would otherwise repeat the same error once per eligible gig, every cycle, forever.
  - decision: ANY existing draft (any status) excludes a gig from future auto-drafting
    rationale: Grill H2 -- never silently overwrite a decision the user already made about a gig, regardless of what that decision was; the user can still manually re-request a draft if they want to reconsider.
  - decision: Fixed cap of 5 auto-drafts per cycle, not configurable
    rationale: Bounds LLM cost on a large first scan without adding a new config field speculatively; can become configurable later if 5 proves wrong in practice.

