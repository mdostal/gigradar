  - id: test
    description: Verify/extend test coverage; run full suite
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for exact parity with handleAddCustomSource()'s own pattern
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, branch off dev, PR into dev
    agent: developer
    depends_on: [review]
