    description: Verify the new action correctly launches with this gig's real url/source context; run full suite
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm this reuses existing automation rather than duplicating it, and that any real limitation found is honestly documented rather than papered over
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, branch off dev, PR into dev
    agent: developer
    depends_on: [review]
