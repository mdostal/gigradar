id: tauri-shell-open-external-links
epic: crawler-fidelity-and-app-usability
title: "Grant the missing shell-open capability so 'Open original listing' reliably opens the real OS default browser"
status: complete
complexity: low
methodology: classic
depends_on: []

progress_note: |
  Implemented and live-verified 2026-09-07 (PR: see epic/story tracking).

  Identifier confirmed against the INSTALLED crate, not guessed: Cargo.lock
  pins tauri-plugin-shell 2.3.5; its shipped
  permissions/autogenerated/commands/open.toml (under
  ~/.cargo/registry/src/.../tauri-plugin-shell-2.3.5/) defines exactly
  `allow-open` / `deny-open`, so the capability identifier is
  `shell:allow-open` (same "shell" plugin prefix already used by the
  pre-existing `shell:allow-execute` entry). Added as a plain string entry
  to src-tauri/capabilities/default.json's permissions array.

  Scoping to http(s)-only: read the crate's own source
  (src/lib.rs's `open_scope()` + src/config.rs's `ShellAllowlistOpen`) --
  confirmed the `open` command's URL-scope validation is NOT a
  capability-level "allow" scope object (unlike fs-style scoping); it's
  driven entirely by the plugin's OWN config under tauri.conf.json's
  `plugins.shell.open`, matched against a regex the crate wraps as
  `^{value}$`. Set `plugins.shell.open` to `"https?://.+"` in
  src-tauri/tauri.conf.json, replacing the plugin's unset default (which
  would otherwise also allow `mailto:`/`tel:`) with an http(s)-only
  regex -- never a blanket allow-all-schemes grant.

  Frontend call sites: grepped `target="_blank"` across all of src/app and
  converted every site that opens a real gig URL (gig.url / item.gigUrl) to
  a <button onClick={() => openExternalUrl(url)}> using a new shared
  helper, src/lib/tauri/open-external.ts -- NOT a raw
  @tauri-apps/plugin-shell import per call site, so there is exactly one
  place that knows how to open a URL and one isTauri() mode-guard (the same
  pattern update-notifier.tsx/embedded-webview.ts already use): inside the
  packaged Tauri app it calls @tauri-apps/plugin-shell's open(); in
  browser/Electron mode (isTauri() false) it falls back to window.open(),
  which already works there. Sites fixed: gig-detail-panel.tsx ("Open
  original listing"), dashboard-client.tsx (table title cell),
  today/today-client.tsx ("View listing"),
  drafts/drafts-client.tsx ("Open the real job listing"),
  gigs/[key]/interview/interview-workspace-client.tsx ("Open original
  listing"). config/config-client.tsx's target="_blank" link (GitHub
  Discussions icon-voting link) was deliberately left untouched -- it is
  not a gig URL and is out of this story's stated scope.

  Real, live verification that the granted permission actually resolves
  (not just that the source JSON was edited): ran `cargo check` in
  src-tauri (CARGO_TARGET_DIR pointed at the repo's existing target/ to
  reuse cached deps; the sidecar Node binary + resources/ dirs were
  symlinked in from an existing local build so `tauri_build`'s upfront
  resource-path validation could get past that check to the ACL step,
  since standing up a full sidecar/bundle from scratch is out of scope
  here). This actually invokes tauri-build's build.rs, which regenerates
  src-tauri/gen/schemas/capabilities.json and
  <target>/build/app-*/out/acl-manifests.json from the real capabilities
  file + the real installed plugins' permission schemas.
    - Positive check: gen/schemas/capabilities.json's resolved "default"
      capability now lists "shell:allow-open" verbatim alongside the
      pre-existing shell:allow-execute entry.
    - acl-manifests.json's "shell" plugin manifest lists allow-open as one
      of its real declared permissions (alongside allow-execute,
      allow-kill, allow-spawn, allow-stdin-write and their deny-
      counterparts) -- confirms shell:allow-open is a real permission of
      the installed plugin, not an accepted-but-meaningless string.
    - Negative control: temporarily renamed the capability entry to the
      deliberately-wrong `shell:allow-open-bogus-typo` and reran `cargo
      check` -- it hard-failed at build.rs with `Permission
      shell:allow-open-bogus-typo not found, expected one of ... shell:allow-open
      ...` (the full valid-identifier list, which explicitly includes
      shell:allow-open). This proves capability identifiers are actually
      validated at build time against the installed plugin's real schema,
      not silently accepted -- so the earlier positive result is a real
      resolution, not a JSON-editing no-op. Reverted back to the correct
      identifier and reran `cargo check` clean before finishing.

  npm test (full suite, 123 files / 1661 tests, 1 pre-existing skip) and
  npm run typecheck both pass clean.

  Not done (explicitly out of scope): a full `npx tauri build`/packaged
  .app run was not performed -- this session's standing rule is
  curl-only/log verification, never opening a real browser window, and a
  full bundle wasn't needed once cargo check's build.rs step was confirmed
  to be the actual mechanism that resolves and validates capabilities (the
  bundling step itself does not re-validate the ACL any differently).

  Regression + fix (2026-09-07, PR #175 CI failure): the initial
  implementation converted every one of the five external-link sites from
  a real `<a href target="_blank">` (accessible role="link") to a
  `<button onClick={...}>` (role="button"). That silently changed
  accessible semantics on every site and broke two committed Playwright
  e2e specs that assert on `getByRole("link", { name: ... })`
  (tests/e2e/dashboard.spec.ts and tests/e2e/chat-panel.spec.ts, both
  keying off the giglist's title-cell link). Fixed by reverting all five
  sites (dashboard-client.tsx, gig-detail-panel.tsx, drafts-client.tsx,
  today-client.tsx, interview-workspace-client.tsx) back to real `<a
  href={url}>` tags with an onClick handler that calls
  `event.preventDefault()` then `openExternalUrl(url)` -- href stays set
  (graceful degradation before JS runs, native middle-click/right-click
  "open in new tab" still works) and `target="_blank"` is dropped (no
  longer correct now that opening is handled programmatically). Updated
  open-external.ts's own doc comment to say call sites should render a
  real `<a>`, not a `<button>` -- the helper itself is element-agnostic.
  open-external.test.ts needed no changes: it tests `openExternalUrl()`
  directly, not any component markup. Re-ran the full suite after the
  fix: npm test (123 files / 1678 tests, 3 pre-existing skips) and npm
  run typecheck both pass clean, and `npm run test:e2e` was run locally
  (real build + server, isolated XDG_DATA_HOME/GIGRADAR_DB_PATH temp
  dirs per the existing e2e discipline) -- all 3 specs pass, including
  the two that had failed in CI.

description: |
  Real, confirmed-by-reading-the-file bug. `src-tauri/capabilities/default.json`'s
  `permissions` array grants `shell:allow-execute` (scoped only to the
  bundled Node sidecar binary) but has **no `shell:allow-open` grant at
  all** -- even though `tauri-plugin-shell` v2 IS a real dependency
  (`src-tauri/Cargo.toml`) and IS initialized (`.plugin(tauri_plugin_shell::init())`,
  `src-tauri/src/lib.rs:191`). `gig-detail-panel.tsx`'s only external link
  (`<a href={gig.url} target="_blank">`, ~line 156) has no working, granted
  path to hand a URL to the real OS default browser inside a packaged Tauri
  webview -- this is the owner's own real, live-reported symptom ("clicking
  the link and open and stuff isn't working at all").

  This is the same CLASS of bug as the already-fixed, pre-existing
  true-embedded-browser epic finding (missing AppManifest in build.rs made
  every custom command silently unreachable, PR #155) -- a real capability
  the app depends on that was never actually granted in the ACL. Same
  discipline this time: find the correct permission identifier for
  `tauri-plugin-shell` v2's open command (check the plugin's own shipped
  permission schema -- likely `shell:allow-open`, confirm the exact string
  against the installed crate version rather than guessing), add it scoped
  to `https://`/`http://` URLs only (never a blanket allow-all-URLs grant --
  this app should never be able to shell-open an arbitrary local file path
  or a non-http(s) scheme), and wire `gig-detail-panel.tsx`'s "Open original
  listing" link (and any other place in the app that opens an external gig
  URL -- grep for `target="_blank"` across `src/app` to find every instance,
  not just this one) to actually use `@tauri-apps/plugin-shell`'s `open()`
  function rather than a bare anchor tag, since a bare `<a target="_blank">`
  inside a Tauri webview does not reliably shell out to the OS browser even
  once the permission exists.

  Verify this LIVE against the real packaged app (curl-only/log verification
  per this session's established methodology -- never a real browser window,
  never Playwright): after rebuilding, confirm the granted permission
  actually appears in the built app's resolved ACL (`security` logs /
  `codesign`-equivalent inspection, or the app's own dev console output if
  reachable via existing safe means), not just that the capabilities JSON
  file was edited.

acceptance_criteria:
  - "src-tauri/capabilities/default.json grants the correct shell-open permission (exact identifier confirmed against the installed tauri-plugin-shell version's own schema, not guessed), scoped to http(s) URLs only."
  - "Every external gig-URL link in src/app (grep for target=\"_blank\" against a gig.url/external URL) is switched from a bare anchor tag to @tauri-apps/plugin-shell's open(), consistent everywhere -- not just gig-detail-panel.tsx if others exist."
  - "A real test/verification step confirms the new permission is present in a rebuilt app's resolved capabilities (not just that the source JSON was edited) -- describe exactly how this was checked in the story's own progress_note."
  - "npm test and npm run typecheck both pass."

context:
  codebase: /Users/mdostal/Documents/work/gigradar
  key_files:
    - path: src-tauri/capabilities/default.json
      purpose: "The ACL file missing the shell-open grant -- add it here, scoped narrowly."
    - path: src-tauri/src/lib.rs
      purpose: "Line ~191, tauri_plugin_shell::init() -- confirms the plugin is already wired at the Rust level; this story is purely a capabilities-grant + frontend-call-site fix."
    - path: src/app/gig-detail-panel.tsx
      purpose: "Line ~156, the confirmed-broken bare anchor tag this story fixes -- and the starting point for grepping every other similar instance."

design_decisions:
  - decision: Scope the grant to http(s) URLs only, never a blanket shell-open-anything permission.
    rationale: "This app should never be able to shell-open an arbitrary local path or a non-web URI scheme from webview-originated code -- narrow scope is a real security property, not paranoia, matching this project's existing ACL discipline (see the true-embedded-browser epic's own capabilities work)."

risks:
  - severity: low
    description: "A too-broad permission grant (e.g. allowing any URL/scheme) would reopen exactly the kind of ACL overreach this codebase has previously had to fix."
    mitigation: "Acceptance criteria explicitly requires http(s)-only scoping; review checks the exact granted scope in the diff."

