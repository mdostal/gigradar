    description: "A cosmetic-only fix (just restyling the tooltip without fixing the misleading copy) would look done but leave the actual, higher-value part of the owner's complaint unaddressed."
    mitigation: "Acceptance criteria requires both the reliability fix AND the two-case copy distinction -- review checks both were actually done, not just one."

