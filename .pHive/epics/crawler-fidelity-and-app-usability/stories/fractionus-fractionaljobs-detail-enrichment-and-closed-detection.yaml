progress_note: |
  Implemented 2026-09-07. Live research (curl-only, no browser) produced a
  real finding that overturned this story's own starting assumption:
  re-fetching the real `/jobs` list page (140 real fractionus cards) found
  it now ALSO carries the exact same `data-status-badge`/price-range/
  weekly-hours-range/"Fractional Contract" blocks the owner's screenshot
  showed on a per-listing DETAIL page -- byte-identical values, spot-
  checked against several listings' own detail pages too (e.g.
  fractional-cfo-at-baker-tilly-us has neither block on EITHER page,
  confirming both templates read the same underlying CMS fields, never one
  having more than the other). Of the 140 real cards sampled: 140/140
  (100%) had a real status badge -- 97 "Closed" + 3 "Filled" vs only 40
  "Active" (i.e. the large majority of what this board's list page
  currently returns is already closed, never detected before this fix);
  83/140 (59%) had a real price range; 98/140 (70%) had a real weekly-hours
  range. Given that, fractionus.ts now parses status/rate/hours/employment-
  type straight off each list card -- zero extra network calls, the SAME
  single `/jobs` fetch this adapter always made. A bounded, lazy per-
  listing DETAIL-page fetch (real bound: MAX_DETAIL_FETCHES_PER_SCAN=15,
  concurrency 3, gated on green/yellow tier + not-archived/ignored + the
  list card itself lacking a rate) is kept as a defensive fallback in case
  the two templates ever diverge for a listing this session's sample didn't
  cover -- it is not the primary mechanism.

  fractionaljobs.io's own list card (the homepage) similarly already
  carries real weekly-hours and (sometimes) rate text in its
  `job-item_more-info` fields -- this adapter's own PRIOR header comment had
  already spotted them ("hours and rate, when present, come first --
  deliberately not parsed") but chose not to read them; this story finally
  does, reusing shape-strict parsers that leave a literal "Unknown"
  (~half of a real 40-listing sample), a non-USD currency (a real
  "£81.25 - £112.5 / hr" listing), a mismatched-K range ("$5 - $8K / mo"),
  or a trailing qualifier ("+commission", "OTE") genuinely unparsed rather
  than guessed. UNLIKE fractionus, this board's compact list card has NO
  free closed-detection signal -- the real "This Role is Closed" banner
  only exists on the bigger per-listing DETAIL page template (a genuine
  Webflow native conditional-visibility toggle, confirmed live by diffing
  several real fetches: both branches of a CMS boolean render into the
  static HTML, and `w-condition-invisible` lands on whichever branch does
  NOT apply -- confirmed a real trap along the way: the literal words
  "closed"/"filled" appear on EVERY FractionalJobs detail page regardless
  of real status, via a "related jobs" widget AND the banner's own static
  copy, so a naive text search would have been a false positive). So this
  adapter keeps the bounded/lazy per-listing DETAIL-page fetch as its real
  closed-detection mechanism (same bound), now used for closed-detection
  primarily, rate/hours as a bonus when it fires.

  Both closed-detection paths reuse the EXISTING archival mechanism with NO
  new store function: a detected-closed listing is simply OMITTED from the
  adapter's returned `Gig[]`, and the EXISTING `recordScan()` delisting
  sweep (store/gigs.ts's `flagUnavailableForSource()`) does the actual
  `unavailable_since`/`status: 'archived'`/`outcomeReason` stamping exactly
  as it already does for a listing that vanishes from a source entirely --
  differentiated by the gig's own current status at closure time
  ('new' -> 'expired_unapplied', 'applied'/'interview' -> 'withdrawn'),
  both pre-existing `OutcomeReason` enum values, no new one added.

  Real limitations, flagged not fixed: (1) the bounded detail-page fallback
  for fractionus gates candidate eligibility on the FLAT (primary-group-
  anchored) `tier` column, same simplification `stageApplication()`'s own
  tier==red guard already makes elsewhere in this codebase -- a gig that's
  only green/yellow for a NON-primary group won't get the fallback fetch
  (its list-card data, which covers the overwhelming majority of cases,
  is unaffected). (2) No live-fetched genuinely-closed FractionalJobs
  example could be found during this research window -- all 40 real
  listings on its current live homepage were open; the closed-detection
  fixture for that source is real markup with exactly one CMS toggle class
  edited (documented in the fixture's own header comment) to represent the
  confirmed-real signal, not a live capture of an actual closed listing.
  (3) `fractional-cto-at-emanate-technology` and any other currently-
  Closed/Filled fractionus gig heals itself (archives correctly) the next
  time the real scheduler process runs this fixed code -- not verified
  against the owner's live `gigs.db` by this session (read-only SELECT
  only, per this story's own constraint); the owner's next real scan cycle
  will do it.
