id: fractionus-fractionaljobs-detail-enrichment-and-closed-detection
epic: crawler-fidelity-and-app-usability
title: "Fetch each listing's own detail page (bounded/lazy, cached) to populate real rate/hours/employment-type and detect Closed/filled listings for auto-archiving"
status: complete
complexity: high
methodology: classic
depends_on: []

description: |
  Real, live-confirmed bug (see epic design-discussion.md §2a/2b). Owner's
  own real data: `SELECT` against `gigs.db` shows **100% of the 346
  `fractionus` gigs and all 123 `fractionaljobs` gigs** have
  rate_min/rate_max/weekly_hours/stage = NULL — not a parsing bug on any one
  listing, a structural gap. Both adapters' own header comments correctly,
  honestly document that the `/jobs` LIST page card markup genuinely has no
  rate/hours anywhere (confirmed live when built) — but the owner's own
  screenshot of a real per-listing DETAIL page
  (https://fractionus.com/jobs/fractional-cto-at-emanate-technology) shows
  `$150-$300*` and `10-20 hrs/week*` displayed clearly. That data exists,
  just one fetch away from where these adapters currently stop.

  Separately, real data shows a specific gig
  (`fractionus:fractional-cto-at-emanate-technology`) sitting `status: 'new'`,
  `unavailable_since: NULL`, with `last_seen` bumped to TODAY, while the real
  site shows a "Closed" badge on that exact listing's detail page. gigradar's
  existing unavailability mechanism (`src/lib/store/gigs.ts` —
  `markGoneUnavailable`/the recordScan() sweep) only fires when a gig stops
  reappearing in a scan's result set at all; it has no way to notice "still
  listed by the source, but the source itself says closed."

  **What this story must actually build** (a lot of this needs live research
  first, not guessing from what's already in the codebase — do the research,
  then design against what's actually found):

  1. Live-fetch a handful of real `fractionus` and `fractionaljobs`
     per-listing DETAIL pages (both a still-open one and the Emanate
     Technology closed one) and determine the REAL markup shape for: rate
     range, weekly hours (fractionus) / hours-or-rate text (fractionaljobs —
     re-read that adapter's own file-level comment first, it documents what
     it already knows about this board's markup), employment type if present,
     and how "Closed"/filled/expired is actually signaled (a badge? changed
     page copy? a 404? something else?). Do NOT assume `fractionus.ts`'s own
     comment about the list-card's unparsed `category-link-copy-c` tags is
     the closed-signal without checking live — that comment only describes
     the LIST page's card, not the detail page, and may be an unrelated
     industry/category tag.
  2. Design a genuinely bounded fetch strategy — these are the actual
     numbers involved: 346 `fractionus` + 123 `fractionaljobs` = 469
     listings. Fetching all 469 detail pages on every single scan cycle is
     not viable (site load, this project's own stated "ethical scraping"
     convention re-affirmed in both adapters' header comments, scan latency).
     Reasonable shapes to weigh (pick and justify one, or a combination):
       - Enrich lazily: only fetch a listing's detail page once it's already
         cleared this group's role-area tiering (green/yellow) during the
         normal list-page scan pass — bounds cost to gigs the owner would
         plausibly ever see, mirrors this session's own
         `match-quality-feedback-loop` design's cost-consciousness precedent.
       - Cache permanently: once a gig's detail page has been fetched and its
         rate/hours/employment_type/closed-status populated, never re-fetch
         it again on a later scan UNLESS re-verifying open/closed state is
         itself a recurring, cheap enough check to justify (this is the one
         place re-fetching still has real value — a listing can go from open
         to closed after its first enrichment fetch).
       - Consider: does closed-detection need its OWN periodic re-check
         independent of rate/hours enrichment (which only needs to happen
         once)? A real design call, not pre-decided here.
  3. Populate `rate_min`/`rate_max`/`rate_unit`/`weekly_hours`/
     `employment_type` on the `Gig` from the detail-page fetch, feeding the
     SAME existing `Gig` shape/pipeline every other source already uses — no
     new fields, no schema changes beyond what's already in
     `src/lib/store/schema.ts` (matches this codebase's existing column set,
     see the earlier `gate-fit-check-too-strict` epic's own respect for not
     touching what doesn't need touching).
  4. When a listing's detail page shows Closed/filled/expired: archive it
     using the EXISTING mechanism (`unavailable_since` + `status: 'archived'`
     + `outcome_reason`, see `src/lib/store/types.ts` and
     `status-reconciliation-outcomes`'s real enum) rather than inventing a
     new one. Differentiate by the gig's CURRENT status at the moment closure
     is detected: if it was still `'new'` (never applied), use
     `outcome_reason: 'expired_unapplied'` (the existing enum value for
     exactly this case); if it was already `'applied'`/`'interview'`, use
     whatever existing outcome-reason value already fits "we applied and it
     closed without us hearing anything" (re-read
     `src/lib/store/types.ts`'s real enum before picking — do not invent a
     new enum value without confirming none of the existing ones fit).
  5. Never fetch a detail page for a gig BELOW its group's role-area tier
     threshold established in step 2's design — this is the cost bound, not
     optional.

  Do NOT touch: `gate()`/`tiering.ts` (untouched, already fixed this
  session), the list-page scraping logic itself (kept exactly as-is, this is
  additive enrichment layered on top), any other source's adapter.

acceptance_criteria:
  - "A real, live-fetched detail page for a still-open fractionus listing populates rate_min/rate_max/rate_unit/weekly_hours on that Gig where they were previously always NULL."
  - "A unit/integration test built from a real, live-fetched snapshot of the Emanate Technology CTO listing's actual closed detail-page HTML (saved as a fixture, same convention as fractionus-jobs.html) proves this fix would correctly archive it (status='archived', unavailable_since set, a real, already-existing outcome_reason value). NEVER write to the owner's real ~/.local/share/gigradar/gigs.db directly -- read-only SELECT against it for research/verification is fine (as already done during this epic's own triage), but all actual writes/mutations happen only against an isolated test DB. The real gig heals itself once this fix ships and the next real scan cycle runs, exactly like the gate() fix did."
  - "The detail-page fetch is demonstrably bounded — not every one of the 469 fractionus+fractionaljobs listings gets fetched on every cycle; the story's own design-decisions section states and justifies the actual bound chosen."
  - "A second, differently-shaped fractionaljobs listing (not just the fractionus case that triggered this) is also verified end-to-end, proving the fix generalizes across both sources, not just the one in the bug report."
  - "npm test and npm run typecheck both pass."

