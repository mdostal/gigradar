design_decisions:
  - decision: Lazy/bounded enrichment, not a blanket per-listing fetch on every scan.
    rationale: "469 real listings across these two sources; unconditional per-cycle detail fetches would be a real load/ethics/latency problem this codebase has explicitly guarded against elsewhere (both adapters' own 'ethical scraping' header comments)."
  - decision: Reuse the existing unavailable_since/outcome_reason archival mechanism for closed-detection, never a parallel new one.
    rationale: "This mechanism already exists, is tested, and already feeds the owner's real reconciliation/metrics workflows (status-reconciliation-outcomes epic) -- a second, parallel 'closed' concept would fragment that."

risks:
  - severity: medium
    description: "Wrong assumptions about the detail page's real markup (guessing instead of live-verifying) would ship a second silently-broken adapter, the exact failure class this whole epic is about."
    mitigation: "Acceptance criteria explicitly require live-fetched verification against a real open listing AND the real closed Emanate Technology listing, plus a second, differently-shaped fractionaljobs example."

