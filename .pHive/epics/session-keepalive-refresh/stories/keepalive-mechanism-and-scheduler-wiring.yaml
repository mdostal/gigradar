risks:
  - severity: medium
    description: "Adds real, recurring browser-session traffic to third-party sites on a fixed internal schedule."
    mitigation: "Every 10 minutes across at most 3 sources is a modest load; each visit reuses the exact same auth mechanism (and origin-scoping) already proven safe for the existing 30-min scan cycle, just more often."
  - severity: low
    description: "The dwell duration (20s default) is a best-effort guess, not derived from any site's documented refresh interval."
    mitigation: "Exported as a named constant, easy to tune once real evidence (via this epic's own diagnosability fixes) shows whether it's working."

