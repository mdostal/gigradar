code_examples:
  - title: "Existing check_for_updates() this story replaces (verified this session, current as of dev branch)"
    file: src-tauri/src/updater.rs
    snippet: |
      match updater.check().await? {
          Some(update) => {
              update.download_and_install(|_c,_l|{}, || log::info!("...")).await?;
              app.restart();  // <-- this story: NOT called here anymore
          }
          None => log::info!("gigradar: no update available on the {:?} channel", channel),
      }

design_decisions:
  - decision: "Auto-download starts immediately on finding an update; only install+restart waits for a command or grace-period timeout."
    rationale: "Owner-confirmed this session: preserves 'the ability to auto update' (nothing to click to fetch bytes) while still giving a real notification window before anything disruptive (a restart) happens."
  - decision: "30-minute grace period, extendable once via a 1-hour snooze."
    rationale: "Owner-confirmed via the same design-discussion gate; generous relative to any single in-app action, avoids indefinite silent staleness for a user who never looks at the tray."

risks:
  - severity: medium
    description: "A downloaded-but-not-yet-installed update is lost if the app quits before the grace period elapses (Update handle lives only in memory)."
    mitigation: "Acceptable per design_decisions above -- next launch's check_for_updates() just re-downloads. Noted for reviewer awareness, not a blocker."
  - severity: low
    description: "Mutex misuse could deadlock the async grace-period task against set_status()'s own lock acquisition."
    mitigation: "Keep lock scope minimal (acquire, read/write, drop immediately) in set_status() -- never hold the Mutex guard across an .await point."

