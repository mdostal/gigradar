id: credential-everywhere
epic: llm-credential-modes
title: "Migrate the remaining 8 lib call sites + ~11 action/scheduler/runner resolution call sites"
status: pending
complexity: high
methodology: classic
depends_on: [credential-core]

description: |
  Vertical Plan Slice 2. Same mechanical swap Slice 1 proved on
  custom-source-recipe.ts, applied to every remaining real LLM call site:
  profile-suggest.ts, profile-assist-loop.ts, draft.ts, prep.ts,
  agent-chat-loop.ts, capture-guidance.ts, gmail-digest-source.ts,
  extract.ts (each: apiKey: string param becomes credential: LlmCredential,
  new Anthropic({apiKey}) becomes createAnthropicClient(credential)) --
  plus every Server Action/scheduler/runner site that currently resolves
  ANTHROPIC_API_KEY directly (src/app/actions.ts, src/app/chat/actions.ts,
  src/app/config/actions.ts, src/app/issues/actions.ts,
  src/app/profile-assist/actions.ts, src/scheduler/index.ts,
  src/lib/apply/runner.ts) switching from readEnvVar("ANTHROPIC_API_KEY")/
  process.env.ANTHROPIC_API_KEY to resolveLlmCredential().

acceptance_criteria:
  - "Every one of the 8 remaining lib call sites constructs its Anthropic client via createAnthropicClient(), never new Anthropic({apiKey}) directly."
  - "Every Server Action/scheduler/runner call site that needs an LLM credential resolves it via resolveLlmCredential(), never a bare readEnvVar(\"ANTHROPIC_API_KEY\")/process.env.ANTHROPIC_API_KEY read."
  - "grep for 'new Anthropic(' across src/ returns exactly one hit: the factory function itself in llm-client.ts."
  - "Full existing test suite still passes -- this is a credential-resolution swap, not a behavior change to any prompt/tool/parsing logic, so no existing test's assertions about LLM call content/output should need to change, only how the client is constructed in each test's own mock setup."
  - "oauth-token mode works identically to api-key mode across every one of these call sites (same acceptance bar as credential-core's custom-source-recipe.ts proof, extended to all sites)."

steps:
  - id: research
    description: Re-confirm the exact 8+11 call site list is still current (files may have shifted since credential-core shipped).
    agent: researcher
  - id: implement
    description: Migrate each call site per the established pattern.
    agent: developer
    depends_on: [research]
  - id: test
    description: Update each call site's existing test mocks to the new createAnthropicClient()/resolveLlmCredential() shape; add oauth-token-mode coverage where api-key-mode coverage already exists.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the grep-for-new-Anthropic acceptance criterion holds; confirm no call site was missed.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

