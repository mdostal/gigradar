id: credential-core
epic: llm-credential-modes
title: "Config field + resolveLlmCredential() + createAnthropicClient() factory + /config UI, wired into custom-source-recipe.ts"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Vertical Plan Slice 1. New Config.llmCredentialKind: "api-key" |
  "oauth-token" (absent/default = "api-key", byte-identical to today).
  New resolveLlmCredential() in env-store.ts, reading that field plus the
  SAME ANTHROPIC_API_KEY env slot, returning {kind, value} | undefined.
  New src/lib/apply/llm-client.ts exporting createAnthropicClient(credential)
  -- passes value as apiKey or authToken to the Anthropic SDK constructor
  based on kind (the SDK already supports authToken natively -- see
  design-discussion.md section 2, no new dependency). /config gains a kind
  selector next to the existing Anthropic API key field. Wired into ONE
  real call site end to end (custom-source-recipe.ts, the most-used LLM
  path) as proof this actually works for a real scan, not just unit tests.

acceptance_criteria:
  - "ConfigSchema accepts llmCredentialKind: \"api-key\" | \"oauth-token\", optional, defaulting to \"api-key\" behavior when absent."
  - "resolveLlmCredential() returns {kind: \"api-key\", value} for a config with no llmCredentialKind set and a real ANTHROPIC_API_KEY env var -- byte-identical resolved value to today's readEnvVar(\"ANTHROPIC_API_KEY\") call."
  - "resolveLlmCredential() returns {kind: \"oauth-token\", value} when llmCredentialKind is \"oauth-token\", same env var slot."
  - "resolveLlmCredential() returns undefined when the env var is unset, regardless of kind (matches readEnvVar()'s existing undefined-on-unset behavior)."
  - "createAnthropicClient({kind: \"api-key\", value}) constructs an Anthropic client with apiKey set, authToken unset."
  - "createAnthropicClient({kind: \"oauth-token\", value}) constructs an Anthropic client with authToken set, apiKey unset."
  - "/config renders a kind selector (radio or select) next to the Anthropic API key field, defaulting to \"API key\", with a one-line hint about claude setup-token for the oauth-token option."
  - "custom-source-recipe.ts's real LLM call uses createAnthropicClient(resolveLlmCredential()) instead of new Anthropic({apiKey}); a live/manual test with a real oauth-token-kind credential successfully extracts listings (or the story explicitly flags this as owner-verified-later if no live token is available during implementation)."

steps:
  - id: research
    description: Confirm ConfigSchema's exact current shape (schema.ts) and env-store.ts's readEnvVar()/setEnvVar() signatures to match conventions exactly.
    agent: researcher
  - id: implement
    description: Add the schema field, resolveLlmCredential(), createAnthropicClient(), the /config UI selector, and wire custom-source-recipe.ts.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests per acceptance criteria (mock the Anthropic SDK constructor call to assert apiKey vs authToken is set correctly).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm zero behavior change for existing api-key-mode installs (default path byte-identical); confirm no raw credential value is ever logged.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

