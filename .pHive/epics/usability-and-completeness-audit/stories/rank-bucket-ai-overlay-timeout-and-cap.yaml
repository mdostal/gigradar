id: rank-bucket-ai-overlay-timeout-and-cap
epic: usability-and-completeness-audit
title: "Bound applyRankBucketAiOverlay()'s per-gig claude-CLI subprocess with a real timeout and a per-cycle cap (triage t-002, p1)"
status: complete
complexity: medium
methodology: classic
depends_on: []

progress_note: |
  SHIPPED: PR #182 (https://github.com/mdostal/gigradar/pull/182),
  branch feat/rank-bucket-ai-overlay-timeout-and-cap off origin/dev (no
  merge conflict -- dev hadn't moved since the branch point).

  **1. Per-call timeout (RANK_BUCKET_AI_OVERLAY_TIMEOUT_MS = 20_000,
  src/lib/matching/rank-bucket-ai-overlay.ts):** applyRankBucketAiOverlay()
  now races its internal suggestRankBucket() call against a 20s deadline
  via the same Promise.race()+setTimeout()+finally(clearTimeout) shape as
  runner.ts's own fetchWithTimeout() (t-001/PR #179). On timeout, the
  RankBucketAiOverlayTimeoutError lands in the SAME try/catch that already
  handles a real thrown API error -- no new fallback branch needed, since
  a timeout is philosophically identical to "AI overlay unavailable this
  cycle" (this feature's own documented design). Extracted
  ruleOnlyRankBucketAssignment() as the single source of truth for the
  `{ bucket, source: "rule", confirmed: true }` shape, reused by both this
  function's own early-return/fallback paths and runner.ts's cap logic
  (item 2) so the two never silently drift apart.

  Reasoning for 20s: this story's own live process inspection observed
  real subprocess lifetimes of roughly 10-15s (PID 25692 exited after
  ~10s). 20s gives ~2x headroom over that observed norm so an ordinary
  call is never false-positive-killed, while still bounding a genuinely
  stuck one to a small, fixed fraction of an unbounded wait. Deliberately
  much shorter than SOURCE_FETCH_TIMEOUT_MS's 60s (t-001) -- that budget
  has to tolerate a real page load/login flow/bot-detection wait a
  browser-automation SOURCE might need; this is a single structured-output
  LLM round trip, an order of magnitude below even this shorter deadline
  in the real observed norm.

  **2. Per-cycle cap (RANK_BUCKET_AI_OVERLAY_CAP = 10,
  src/lib/apply/runner.ts):** a local (not module-scope) counter inside
  one runRadar() invocation counts only calls that would ACTUALLY invoke
  the AI (group.rankBucketAiOverlay === true AND a credential resolved
  this cycle -- the same condition applyRankBucketAiOverlay() itself
  checks before calling out, so a call that would be a free no-op never
  burns cap budget). Once the cap is hit, a gig/group pair gets
  ruleOnlyRankBucketAssignment(ruleResult) directly -- runner.ts never
  even calls applyRankBucketAiOverlay(), so no subprocess is spawned at
  all for capped gigs. No data loss: capped gigs keep a valid rule-based
  rankBucket this cycle and are picked up by the AI overlay on a later
  scan once still green/yellow and re-scanned, mirroring this codebase's
  established "self-heals on next scan" pattern.

  Reasoning for 10 (not AUTO_DRAFT_CAP's 5, scheduler/index.ts -- that's
  the real precedent mirrored here, despite the story's context note
  pointing at runner.ts; AUTO_DRAFT_CAP actually lives in
  scheduler/index.ts, confirmed by grep before implementing): this cap
  only ever counts a call that genuinely fires the AI, and each such call
  is a single small structured-output classification, cheaper than
  stageApplication()'s full draft-generation LLM call that AUTO_DRAFT_CAP
  bounds -- tolerating a somewhat higher cap while keeping the aggregate
  bounded. Worst case (every one of the 10 calls actually hits the 20s
  timeout rather than completing normally): 10 * 20s = 200s (~3.3min)
  added to a cycle -- a small, BOUNDED addition instead of the unbounded
  tens-of-minutes this story exists to fix. Normal case, going by this
  story's own live-observed ~10-15s per real call: roughly 100-150s
  added.

  **3. Bounded concurrency -- considered, decided AGAINST for this
  story:** fractionus.ts's DETAIL_FETCH_CONCURRENCY = 3 precedent is a
  simple, isolated batch-fetch loop with no other state. This call site
  sits deep inside apply/runner.ts's single per-gig loop, which ALSO runs
  gate()/matchGroups()/applyAiVerification()/computeTier() synchronously,
  interleaved, per gig (applyAiVerification() itself is a SECOND
  sequential, uncapped, un-timed-out AI call site earlier in the same
  loop, flagged as a related risk below but explicitly out of scope for
  t-002, whose live evidence specifically named rank-bucket-ai-overlay's
  subprocess spawns). Decoupling just the rank-bucket-overlay call into a
  bounded-concurrency batch would require restructuring that loop into a
  two-pass shape (collect eligible pairs synchronously first, batch-
  process the AI overlay concurrently second, merge results back into
  each gig's already-built MatchResult/gigWithTier) -- a materially
  larger, riskier change than this triage's p1/major severity justifies,
  especially given how many OTHER concurrently-active stories this same
  session also touch this exact loop (ai-match-verification,
  multi-group-architecture, rate-band-match-quality,
  customizable-tier-scoring, group-aware-auto-fire-trust, etc.) -- real
  conflict/regression surface for a marginal further reduction in
  worst-case time, given timeout+cap alone already bounds the worst case
  to ~3.3min. Not revisited unless a future live cycle shows the
  timeout+cap fix alone is still insufficient.

  Related, NOT fixed here (flagged for a possible future triage entry):
  applyAiVerification() (src/lib/matching/ai-verify.ts) has the exact same
  shape -- sequential, no timeout, no cap, one real AI call per matched
  group per gig -- sitting even earlier in the same per-gig loop. It could
  reproduce this same class of bug independently; out of scope here since
  t-002's own live evidence named the rank-bucket-ai-overlay claude-CLI
  spawns specifically, not this one.

  Verification: npm test (1735 passed, 3 skipped, 0 failed, 124 files) and
  npm run typecheck both clean. New regression tests added in
  src/lib/matching/__tests__/rank-bucket-ai-overlay.test.ts (hung
  generateText() mock + fake timers proves the timeout-fallback; a
  fast-resolving call proves no false-positive kill) and
  src/lib/apply/__tests__/runner-rank-bucket.test.ts (more AI-overlay-
  eligible gigs than RANK_BUCKET_AI_OVERLAY_CAP in one runRadar() cycle
  proves only the capped count of real calls happen, capped gigs still
  get a valid non-broken rule-based rankBucket, and a no-credential cycle
  never burns cap budget on free no-ops).

description: |
  Triage entry t-002 (.pHive/triage/queue.yaml, priority p1/severity
  major). Found live on 2026-09-07 while verifying the t-001/PR #179 fix:
  even after that fix (a 60s timeout on each SOURCE's fetch()), a real
  scheduler cycle triggered at a real cron tick still hadn't produced a
  "cycle complete" log line after 12+ minutes. Live process inspection
  found the scheduler had moved PAST the source-fetching stage entirely
  and was sequentially spawning real
  `node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude` CLI
  subprocesses -- a fresh PID roughly every 10-15 seconds, one after
  another (confirmed: PID 25692 exited after ~10s, PID 26442 started
  immediately after, then PID 27790 after that) -- for the rank-bucket AI
  overlay feature.

  Root cause, confirmed by reading the code: `src/lib/apply/runner.ts`
  (~lines 289-295) has, inside its per-gig loop, a NESTED per-group loop
  that calls `await applyRankBucketAiOverlay(g, group, ruleResult,
  runOpts.credential)` (`src/lib/matching/rank-bucket-ai-overlay.ts`) for
  EVERY group that has `rankBuckets` configured, for EVERY gig being
  processed this cycle -- fully sequential, no concurrency, and (unlike
  the fetch() call t-001 fixed) no timeout of its own. Each call spawns a
  real `claude` CLI subprocess (via the claude-agent-sdk), which is
  genuinely expensive (process startup + auth + a real network round trip
  to Anthropic's API) -- confirmed each individual call DOES eventually
  complete (this is NOT an infinite hang like t-001), but with enough
  green/yellow-tier gigs across enough rankBuckets-configured groups, the
  cumulative wall-clock cost of running these fully sequentially,
  unbounded, can legitimately run a single scan cycle into the tens of
  minutes -- indistinguishable from "stuck" to the owner even though
  technically still making progress.

  **The fix**:
  1. Add a real timeout around `applyRankBucketAiOverlay()`'s own
     claude-CLI invocation (check `rank-bucket-ai-overlay.ts`'s real
     `generateText()`/harness call for the exact spot). On timeout, fall
     back to the already-computed rule-based `ruleResult` (from
     `assignRankBucket()`, computed BEFORE the AI overlay call) rather
     than blocking further -- this matches the feature's own stated
     design philosophy (runner.ts's own comment: "the opt-in AI overlay...
     never a replacement for the rule-based result"), so a timeout here is
     philosophically identical to the AI overlay simply not being
     available, which this code already has to handle gracefully.
  2. Add a real, justified per-cycle cap on how many
     `applyRankBucketAiOverlay()` calls run in one cycle (mirroring
     `AUTO_DRAFT_CAP`'s existing precedent in this same runner.ts file for
     auto-draft-on-scan) -- gigs beyond the cap simply keep their
     rule-based `ruleResult` for this cycle, picked up by the AI overlay
     on a LATER cycle once they're still green/yellow and re-scanned
     (mirrors this codebase's existing "self-heals on next scan" pattern
     used elsewhere this session).
  3. Consider (real design decision, not pre-decided here): does this
     loop benefit from bounded concurrency (like fractionus.ts's own
     `DETAIL_FETCH_CONCURRENCY = 3` precedent from earlier today) rather
     than one-at-a-time sequential execution? Weigh real cost/complexity
     against the timeout+cap fix alone before adding this -- a real,
     justified decision either way, documented in this story's own
     progress_note.

  Do NOT touch: `assignRankBucket()`'s own rule-based logic (already
  correct, untouched), the AI overlay's actual suggestion-quality logic
  (untouched, this story is purely about bounding total time/cost), the
  scan-pipeline-per-source-timeout fix from t-001/PR #179 (a different,
  already-fixed stage of the pipeline).

acceptance_criteria:
  - "A real timeout is added around applyRankBucketAiOverlay()'s claude-CLI invocation -- a deliberately-hung/slow test double for the underlying LLM call no longer blocks the per-gig loop past a bounded, justified deadline."
  - "On timeout, the gig/group's rankBucket assignment falls back to the already-computed rule-based ruleResult, never left undefined/broken."
  - "A real, justified per-cycle cap limits how many applyRankBucketAiOverlay() calls run in one cycle -- gigs beyond the cap keep their rule-based result for that cycle, picked up by the AI overlay on a later scan."
  - "A new regression test proves: (a) a timed-out/slow AI call falls back to the rule-based result rather than blocking, and (b) the per-cycle cap is actually enforced (more eligible gigs than the cap exist, only the capped number get real AI calls)."
  - "npm test and npm run typecheck both pass."

context:
  codebase: /Users/mdostal/Documents/work/gigradar
  key_files:
    - path: src/lib/apply/runner.ts
      purpose: "Lines ~289-295 -- the per-gig, per-group loop calling applyRankBucketAiOverlay() with no timeout/cap today. Also see AUTO_DRAFT_CAP elsewhere in this same file as the existing per-cycle-cap precedent to mirror."
    - path: src/lib/matching/rank-bucket-ai-overlay.ts
      purpose: "applyRankBucketAiOverlay()'s own real claude-CLI/generateText() invocation -- the exact call site needing a timeout."
    - path: src/lib/matching/rank-bucket.ts
      purpose: "assignRankBucket() -- the already-computed rule-based result to fall back to on an AI-overlay timeout."

design_decisions:
  - decision: Fall back to the rule-based result on timeout rather than failing the gig/cycle.
    rationale: "This feature is explicitly documented (runner.ts's own comment) as an opt-in OVERLAY on top of the rule-based result, never a replacement -- a timeout is philosophically identical to the AI overlay being unavailable, which this design already has to tolerate gracefully."
  - decision: A real per-cycle cap, mirroring AUTO_DRAFT_CAP's existing precedent in the same file, rather than an unbounded loop even with a per-call timeout.
    rationale: "Even a bounded-per-call timeout (e.g. 30s) times a large number of eligible gigs still adds up to a long cycle -- capping total calls per cycle bounds the AGGREGATE cost, and uncapped gigs self-heal on a later cycle, matching this codebase's own established 'no data loss, just deferred' pattern."

risks:
  - severity: medium
    description: "A too-aggressive cap or timeout could make the AI overlay feature effectively useless (never actually running) if set too low; too generous and the original problem persists."
    mitigation: "Acceptance criteria requires a real, justified value with reasoning documented in the story's own progress_note, and a regression test proving the cap is actually enforced -- reviewed with real scrutiny given this directly affects scan-cycle duration in production."

