id: config-add-group-discoverability-and-spike-cleanup
epic: usability-and-completeness-audit
title: "Investigate real 'add new group' discoverability in Config (simman finding) + delete the orphaned embedded-webview-spike page"
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Two small, unrelated housekeeping/investigation items bundled since both
  are quick, independent, low-risk.

  **Part 1 -- simman finding.** A real vision-AI (`simman synthesize`) pass
  against an isolated, realistically-seeded gigradar instance was asked to
  "add a new tracking group for a different kind of work through the
  Config page." Both synthesized steps tapped the SAME text ("Groups &
  Needs" -- once from a sidebar nav label, once from what it called a
  "card"), and the plan terminated at "the editing interface is displayed"
  without ever locating/clicking an actual "add new group" affordance in 2
  steps. This is inconclusive on its own (could be a genuine
  discoverability gap in the real UI, or just a shallow 2-step exploration
  budget) -- investigate for real: read `src/app/config/config-client.tsx`'s
  actual group-management section, confirm whether a real "+ Add group"
  (or equivalently-named) action exists and where it's positioned, and
  either (a) confirm it's genuinely present and reasonably discoverable
  (in which case this is a false alarm from a shallow vision-model
  exploration budget -- document that finding and close it out, no code
  change needed) or (b) find a real gap and fix it (e.g. the action exists
  but is visually buried, mislabeled, or requires scrolling/an extra click
  a first-time user wouldn't expect).

  **Part 2 -- code-quality housekeeping.** `src/app/embedded-webview-spike/
  page.tsx` (178 lines, added in PR #155 during the true-embedded-browser
  epic) is a dev-only spike page -- confirmed via this session's own broad
  code-quality audit: not linked from `nav-header.tsx`, not referenced
  anywhere else in the codebase. Delete it (and its route directory)
  entirely -- it served its purpose as a development spike and is now dead
  weight.

acceptance_criteria:
  - "A real, evidence-based verdict on the add-group flow: either confirmed genuinely fine (with the exact file:line of the real 'add group' affordance cited) or a concrete fix is made to improve its discoverability."
  - "src/app/embedded-webview-spike/ is deleted entirely; npm run build still succeeds with no dangling references."
  - "npm test and npm run typecheck both pass."

context:
  codebase: /Users/mdostal/Documents/work/gigradar
  key_files:
    - path: src/app/config/config-client.tsx
      purpose: "The real group-management UI to investigate for Part 1 -- find the actual 'add group' action and assess its real discoverability."
    - path: src/app/embedded-webview-spike/page.tsx
      purpose: "The orphaned spike page to delete entirely for Part 2."
    - path: src/app/nav-header.tsx
      purpose: "Confirms embedded-webview-spike is not linked from real navigation -- verify this before deleting, don't just trust the audit's prior claim."

design_decisions:
  - decision: Bundle these two small items into one low-complexity story rather than two separate stories.
    rationale: "Both are quick, independent, low-risk items discovered incidentally during this epic's broader research passes -- not worth the overhead of two separate full story lifecycles."

risks:
  - severity: low
    description: "Deleting embedded-webview-spike could break something if the audit's 'not referenced anywhere' claim was wrong."
    mitigation: "Acceptance criteria requires re-confirming zero references (grep + a successful build) before/after deletion, not just trusting the prior audit's claim."

steps:
  - id: implement
    description: Investigate the real add-group UI discoverability and fix if a genuine gap is found; delete the orphaned spike page
    agent: developer
  - id: test
    description: Verify build succeeds with the spike page removed; run full suite
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the add-group verdict is evidence-based (not a guess) and the spike-page deletion is safe
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, branch off dev, PR into dev
    agent: developer
    depends_on: [review]
