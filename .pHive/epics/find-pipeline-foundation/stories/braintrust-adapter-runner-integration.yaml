risks:
  - severity: high
    description: "The manual live-network verification step and the two-run status/delisting demonstration are both non-deterministic, network-dependent steps with no automated fallback — flagged by tpm during H/V review as the likeliest place an execution agent stalls (no live network access, or the live site's layout changed since research)."
    mitigation: The manual run is scoped to the implement step with an explicit, concrete confirmation artifact (gig count + one sample URL) required before review — not left as an implicit, unverified claim.
  - severity: medium
    description: Cross-process SQLite contention (this story's integration test plus any concurrently running dev server) could surface a WAL/busy_timeout misconfiguration that persistence-layer-sqlite's own concurrent-writer unit test didn't catch in isolation.
    mitigation: The runner-integration test in this story is a second, real-path exercise of the same concurrency behavior, not just a repeat of the prior story's unit test.

