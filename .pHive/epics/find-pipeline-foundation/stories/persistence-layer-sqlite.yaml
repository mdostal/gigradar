  key_files:
    - path: src/lib/apply/runner.ts
      purpose: Current in-memory-only dedup (the `seen` Set) that this story's store replaces as the durability layer; runner.ts itself is NOT modified in this story — that's the next story's job.
    - path: src/lib/types.ts
      purpose: Existing Gig/Config types this store's schema must round-trip without loss.

design_decisions:
  - decision: SQLite over another flat file, and over a server-based DB
    rationale: Fits the project's north-star framing (single-user, local, download-and-run, no server process) while getting atomic writes and real querying for free — directly kills the two worst fragilities of the legacy flat-JSON-file store (no atomic writes, no locking). Confirmed by the user during the design-discussion review gate.
  - decision: Split from a combined "persistence + first adapter" slice into a standalone persistence-only story
    rationale: H/V team review (tpm) flagged that bundling persistence with the first adapter and runner integration put most of the epic's real engineering risk behind one late, unverified checkpoint. This story is independently verifiable by unit tests alone, with no adapter or live network dependency.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md's data-layer description (currently states persistence is 'not yet implemented' with the legacy flat-file design 'the fragile part to replace') to describe the new src/lib/store/ module, its SQLite schema, and the module-boundary rule (all access through its exported functions)."

