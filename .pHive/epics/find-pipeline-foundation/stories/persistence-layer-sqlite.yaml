risks:
  - severity: high
    description: Getting the delisting-detection algorithm subtly wrong (e.g. flagging gigs unavailable when a source merely errored) reintroduces exactly the kind of silent-data-loss bug the legacy tool never caught.
    mitigation: The acceptance criteria explicitly require a test for the "source returns zero results, nothing gets flagged" case, not just the "source returns results, missing gig gets flagged" case — both must be tested, not just the happy path.
  - severity: medium
    description: WAL mode / busy_timeout misconfiguration won't surface until a real concurrent-writer scenario (dev server + cron both running) — easy to skip if the concurrent-writer test is treated as optional.
    mitigation: Concurrent-writer test is a named, non-optional acceptance criterion, not left to the developer's discretion.

