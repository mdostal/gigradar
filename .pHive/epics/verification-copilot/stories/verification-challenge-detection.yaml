design_decisions:
  - decision: "Detection lives in withBrowserSession() (one shared call site), not duplicated per-adapter."
    rationale: "Matches this session's own established shape for cross-cutting fixes (runner.ts's custom-source fallback, origins.ts's config-driven fallback) -- one core touch point, zero future per-adapter work."
  - decision: "Conservative, specific-phrase matching -- never a broad 'looks suspicious' heuristic."
    rationale: "A false positive here would misclassify a real, ordinary page as a verification block, degrading the signal this whole epic exists to make trustworthy."

