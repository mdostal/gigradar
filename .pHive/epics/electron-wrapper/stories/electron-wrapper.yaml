risks:
  - severity: medium
    description: The core architectural bet (server never runs inside Electron's own process) could fail in a way not anticipated during planning research (no GUI available to test live during planning).
    mitigation: Explicitly the first implementation step, before building the rest of the feature around an unverified assumption.
  - severity: low
    description: Environment inheritance for the spawned child (PATH, Playwright's browser resolution) could behave differently than expected even for a terminal-launched command, depending on the owner's specific shell/Node setup.
    mitigation: Dedicated acceptance criterion specifically testing Capture Login (which depends on Playwright) from within the Electron-opened app, not just confirming the dashboard itself loads.

