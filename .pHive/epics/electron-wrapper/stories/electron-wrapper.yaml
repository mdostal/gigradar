design_decisions:
  - decision: Server code never runs inside Electron's own main-process runtime — only in a spawned next start child process
    rationale: Sidesteps an unverifiable question (does Electron's bundled Node honor --experimental-sqlite the same way a plain node invocation does) by construction, not by testing around it.
  - decision: npm run electron composes the build into one command rather than requiring a separate manual build step first
    rationale: Grill U1 — this project's actual, demonstrated development pattern all session has been iterative npm run dev; a separate required-but-easy-to-forget rebuild step would produce silent stale-code confusion when switching modes.
  - decision: Explicitly scoped as a terminal-launched command, not a double-clickable packaged app
    rationale: Grill H1 — GUI-launched apps often get a far more minimal PATH than a terminal session; stating this constraint now avoids silently breaking later if this ever gets packaged.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md and/or CLAUDE.md with a short note on the two runtime modes (browser vs Electron) and how to launch each."

