    - path: src/lib/apply/runner.ts
      purpose: "Where matchedGroupTiers/matchedGroupBands/flatTier/flatMatchBand are computed -- read this to confirm exactly what data is already available on MatchResult.gig, no new plumbing needed."
    - path: src/scheduler/__tests__/auto-draft-tier-scoring.test.ts
      purpose: "Existing real-pipeline test pattern (construct a real Config, run runRadar, assert on runAutoDraft's behavior) to follow for this story's own new multi-group test case."

code_examples:
  - title: "runner.ts's own precedent for 'any group, not just primary' semantics"
    file: src/lib/apply/runner.ts
    snippet: |
      // "pass" reflects whether this gig cleared ANY in-scope group, not
      // just the primary one -- the auto-draft/notify-on-green-match
      // consumers of RunRadar()'s own `passed` list must react to a real
      // match in ANY of the owner's groups, not just whichever happens
      // to be first.
      pass: matchedGroupIds.length > 0,

design_decisions:
  - decision: A draft stays ONE artifact per gig, never one per matching group.
    rationale: "A drafted application/cover-letter is about the GIG, not about which of the owner's groups it happens to match -- there's no sensible notion of 'draft this gig once for Drone Services and again for AI Data Labeling.' Only the ELIGIBILITY check (should this gig get drafted at all) becomes group-aware, not the drafting mechanism itself."

