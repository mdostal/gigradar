risks:
  - severity: medium
    description: "Widening auto-draft eligibility means MORE gigs will be auto-drafted than before for any owner already running multiple groups -- a real behavior change, not just a bug fix, for that population."
    mitigation: "This is the CORRECT behavior per the feature's own original intent (auto-draft green+in-band matches) -- the current behavior is the bug. Called out explicitly in the PR description so the owner is aware of the behavior change, not just told 'bug fixed.'"
