id: group-aware-auto-draft-and-notify
epic: group-scoped-automation-fixes
title: Auto-draft and notify-on-green-match consider ANY in-scope group, not just the primary one
status: complete
complexity: medium
methodology: classic
depends_on: []

progress_note: |
  SHIPPED PR #166 (2026-09-06), via delegated subagent. Added
  isGreenInBandForAnyGroup()/isGreenForAnyGroup() helpers reading
  Gig.matchedGroupTiers/matchedGroupBands; runAutoDraft()/
  runNotifyOnGreenMatch() eligibility filters widened accordingly. No
  schema change needed -- the per-group data already existed. A real,
  intentional behavior change (more gigs become eligible for anyone
  running multiple groups), called out explicitly in the PR. 3 new
  real-pipeline tests. npm test (1629 passed at the time) and npm run
  typecheck both clean.

description: |
  Real, significant gap found by this epic's own research: `runAutoDraft()`
  and `runNotifyOnGreenMatch()` (`src/scheduler/index.ts`, ~lines 302 and
  360) both filter on `MatchResult.tier`, which `apply/runner.ts` computes
  as the PRIMARY group's tier only (`flatTier`). For an owner running
  multiple groups (e.g. an existing fractional-work group plus a new,
  non-primary "Drone Services" group), a gig that's a real GREEN,
  in-band match for the non-primary group NEVER gets auto-drafted and
  NEVER triggers a notification -- silently, because automation only
  ever looks at whichever group happens to be first in `Config.groups`.

  The fix needs NO new data plumbing -- `Gig.matchedGroupTiers` and
  `Gig.matchedGroupBands` (both `Record<groupId, ...>`) already carry
  every group's own real result, stamped on by `runner.ts` today. This
  is a filter-logic change, not a schema change:

  1. `runAutoDraft()`'s `eligible` filter (currently
     `r.tier === "green" && r.gig.matchBand === "in-band"`) should
     become: does there exist at least one `groupId` where
     `r.gig.matchedGroupTiers?.[groupId] === "green"` AND
     `r.gig.matchedGroupBands?.[groupId] === "in-band"` (the SAME
     group for both checks -- a gig green for group A but only
     in-band for group B does not count). Keep the existing
     `getDraftFn(...) === undefined` dedupe check unchanged (a draft is
     one artifact per gig, not per group -- see this story's own
     design_decisions).
  2. `runNotifyOnGreenMatch()`'s `newGreenMatches` filter (currently
     `r.tier === "green"`) should become the same "any in-scope group is
     green" check (band is NOT part of this one today -- keep it that
     way, don't add a check the original story never had).
  3. Match `runRadar()`'s own already-fixed `pass` field precedent
     (see runner.ts's own comment: "'pass' reflects whether this gig
     cleared ANY in-scope group, not just the primary one") -- this
     story is applying that SAME principle to the two scheduler
     consumers that hadn't caught up to it yet.

  Do NOT change `attemptAutoFire()`'s own call or `AutoFireRuleConfig` in
  this story -- that's the next story in this epic
  (`group-aware-auto-fire-trust`), sequenced to land after this one so
  it doesn't conflict with these same `scheduler/index.ts` edits.

acceptance_criteria:
  - "A gig that is GREEN + in-band for a NON-primary group (and not green/in-band for the primary group) is auto-drafted when autoDraftOnScan is enabled -- verified by a real test constructing a multi-group Config where the eligible gig's primary-group tier is NOT green."
  - "The same gig triggers a notify-on-green-match notification under the same non-primary-group-only condition."
  - "A gig that is green+in-band for NO group (primary or otherwise) is still correctly NOT auto-drafted -- no regression on the reject path."
  - "Existing single-group behavior is byte-identical (a single-group Config's primary group IS its only group, so 'any group' and 'the primary group' are the same set)."
  - "npm test and npm run typecheck both pass."

