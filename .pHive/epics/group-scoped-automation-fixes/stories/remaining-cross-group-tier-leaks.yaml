    description: Fix all 4 call sites (or document why one is legitimately out of scope)
    agent: developer
  - id: test
    description: Add/extend test coverage per call site; run full suite
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for consistency with the resolveDisplayTier/resolveDisplayBand pattern
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, branch off dev, PR into dev
    agent: developer
