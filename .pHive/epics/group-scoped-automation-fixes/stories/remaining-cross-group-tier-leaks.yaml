    description: "interview-workspace-client.tsx might not have a groupId concept naturally available at its route, making a 'correct' fix awkward."
    mitigation: "The story explicitly allows documenting this one as out-of-scope/group-agnostic if that's what's actually true, rather than forcing a bad fix."
