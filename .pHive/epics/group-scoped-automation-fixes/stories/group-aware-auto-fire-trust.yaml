design_decisions:
  - decision: "AutoFireRuleConfig.groupId is optional; undefined means 'any group' (backward compatible)."
    rationale: "Mirrors SourceConfig.groupIds's own established 'unscoped = every group' convention -- never invent a second convention for the same shape of problem. Also the safer default for a trust system: an ungraduated group's gigs never silently inherit another group's already-earned trust."

risks:
  - severity: high
    description: "This touches real-world, irreversible auto-submission trust logic. A precedence bug in 'which rule fires when a gig matches multiple groups' could either under-fire (a real regression the owner would notice as 'my graduated rule stopped firing') or, worse, over-fire (an ungraduated group's gig fires because of a different group's graduated rule)."
    mitigation: "Explicit acceptance criteria above requiring a real regression test for the no-groupId case AND a real test proving graduation counts stay correctly isolated per group. Escalate rather than guess if the multi-applicable-rule precedence isn't clearly derivable from existing code."

