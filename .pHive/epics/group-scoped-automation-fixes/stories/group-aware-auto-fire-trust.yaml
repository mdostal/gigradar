id: group-aware-auto-fire-trust
epic: group-scoped-automation-fixes
title: Auto-fire rules can be scoped to a specific group (optional, backward-compatible)
status: complete
complexity: medium
methodology: classic
depends_on: [group-aware-auto-draft-and-notify]

progress_note: |
  SHIPPED PR #167 (2026-09-06), via delegated subagent -- the highest-
  risk story in this epic (real-world submission automation), reviewed
  with extra care before merging. AutoFireRuleConfig.groupId is now
  optional (undefined = any group, backward compatible). Precedence
  decision for a gig matching multiple groups with applicable rules:
  walk config.groups in declared order, preferring an ENABLED rule over
  a disabled one on an earlier group (so disabling one group's rule can
  never silently block a different, already-graduated group's rule).
  approvedCount()/isGraduated() scope to rule.groupId specifically (not
  the candidate group), which is what keeps every pre-existing,
  unscoped rule's graduation count byte-identical -- verified both by
  direct code review and a dedicated regression test. Daily fire cap
  stays source-wide/unscoped, a deliberate, documented choice. 39/39
  autofire tests pass; npm test (1647 passed) and npm run typecheck
  both clean.

description: |
  Real gap found by this epic's own research: `AutoFireRuleConfig`
  (`src/lib/types.ts`, ~lines 480-486) is keyed only by `(sourceId,
  tier)` -- no group concept exists in the graduated-trust model at
  all. `evaluateAutoFire()` (`src/lib/apply/autofire.ts`, ~line 169)
  reads the flat, PRIMARY-group `gig.tier` to find a matching rule via
  `findAutoFireRule(gig.sourceId, tier, config)`. Net effect: for a
  multi-group owner, auto-fire can only ever act on primary-group
  matches, even once a rule is fully graduated and enabled.

  **The one real design decision this story implements** (already made,
  see design-discussion.md §2 -- do not re-litigate it, just build it):
  `AutoFireRuleConfig` gets a new OPTIONAL `groupId?: string` field.

  - `undefined` (the default; every rule configured before this story
    shipped) means "applies regardless of which group matched" --
    byte-identical behavior to today.
  - An explicit `groupId` scopes the rule to gigs that are green-tier
    for THAT specific group (via `gig.matchedGroupTiers?.[groupId]`,
    NOT the flat `gig.tier`).

  Concretely:
  1. Add `groupId?: string` to `AutoFireRuleConfig` (types.ts) and its
     zod schema (find `AutoFireRuleConfigSchema` or equivalent in
     `src/lib/config/schema.ts`).
  2. `findAutoFireRule(sourceId, tier, config, groupId?)` -- when
     `groupId` is passed, prefer a rule matching `(sourceId, tier,
     groupId)` exactly; a rule with `groupId: undefined` still matches
     ANY groupId (the backward-compat case) but a rule WITH an explicit
     groupId only matches that same one. Design the precedence
     carefully: if a gig matches multiple groups green, and rules exist
     for more than one of them, which rule fires? Reasonable default:
     evaluate against every group the gig is green for that has an
     enabled rule, same "first real match, not silently arbitrary"
     spirit this codebase uses elsewhere (e.g. rank-bucket.ts's
     first-match-wins) -- but this needs a real decision, not a guess;
     make it, document it in a code comment, and cover it with a test.
  3. `evaluateAutoFire()` (autofire.ts) needs to iterate the gig's
     OWN matched groups (via `matchedGroupTiers`) rather than reading
     the single flat `gig.tier`, finding whichever rule(s) actually
     apply.
  4. `approvedCount()`/`isGraduated()` stay scoped to whatever
     `(sourceId, tier)` (optionally `+groupId`) the resolved rule uses
     for its own decision-log queries -- a group-scoped rule's
     graduation count must only include approvals from THAT group's own
     gigs, never mixed with an unscoped or different-group rule's count.
  5. Config UI (`config-client.tsx`'s auto-fire rules section) gets a
     new, optional "Group" selector per rule (only shown/relevant when
     `draft.groups.length > 1`, mirroring the existing pattern
     `SourceConfig.groupIds`'s own per-group checkboxes use) -- leaving
     it unset keeps the rule's current "any group" behavior.

  This is a safety-relevant system (real-world submission automation) --
  be conservative. If a fully-correct precedence design for the
  "multiple applicable rules" case genuinely isn't clear from the
  existing code, escalate the specific ambiguity back rather than
  guessing on something that affects auto-submission.

acceptance_criteria:
  - "An existing (no groupId) auto-fire rule's behavior, including its graduation/trust counts, is completely unchanged after this story ships -- a real regression test proves it."
  - "A NEW rule with an explicit groupId only ever fires for gigs green-tier under THAT specific group -- never a different group's green match, even for the same sourceId+tier pair."
  - "A group-scoped rule's approvedCount()/graduation status is scoped to that group's own approved gigs -- never inflated by another group's or an unscoped rule's approvals."
  - "The Config UI's auto-fire rules section shows a Group selector only when multiple groups exist, and it's genuinely optional (leaving it blank preserves today's behavior)."
  - "npm test and npm run typecheck both pass."

