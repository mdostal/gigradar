  key_files:
    - path: src/lib/apply/autofire.ts
      purpose: "evaluateAutoFire()/findAutoFireRule()/approvedCount()/isGraduated() -- the real trust logic this story extends."
    - path: src/lib/types.ts
      purpose: "AutoFireRuleConfig's shape (~lines 480-486) -- the schema addition."
    - path: src/app/config/config-client.tsx
      purpose: "The auto-fire rules settings UI, and SourceConfig.groupIds's own existing per-group-checkbox UI pattern (search for 'Scoped to groups' in this file) to mirror for the new rule-level Group selector."
