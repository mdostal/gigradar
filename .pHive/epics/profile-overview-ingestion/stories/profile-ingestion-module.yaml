design_decisions:
  - decision: Login-wall detection uses known signatures (LinkedIn's redirect/authwall pattern), not a generic short-body length heuristic
    rationale: Grill H2 — a length heuristic risks false-positiving on legitimate short pages, which are exactly the kind of link this epic is meant to support (personal portfolios, minimal landing pages).
  - decision: API key resolved fresh per-call inside the ingestion module's caller, never held at module scope or read via process.env
    rationale: Collaborative review confirmed the Next.js app's request path never populates process.env from .env (only the CLI/cron path does) — a module-scope client would permanently capture undefined.

