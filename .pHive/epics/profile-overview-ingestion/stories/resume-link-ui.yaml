design_decisions:
  - decision: Merge (case-insensitive, trimmed dedup), never replace, when applying extracted skills/roles
    rationale: Collaborative review + grill C1 — a resume is additive enrichment of an existing profile, not a full-profile reset the way role-templates' template swap is; claiming identical UX to role-templates while silently changing this behavior would be misleading.
  - decision: Nothing persists until the user's existing Save action, including the API key field's own write (which persists immediately to .env, distinct from the profile draft's Save-gated persistence)
    rationale: The API key write is a discrete, single-purpose action (like any other credential setup) — no reason to gate it behind the unrelated profile-draft Save button; the profile extraction result IS gated behind Save, consistent with every other draft field in this form.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md to describe the resume/link ingestion feature, the in-memory-only resume handling decision, and the new Anthropic API key field's write-to-.env behavior."

