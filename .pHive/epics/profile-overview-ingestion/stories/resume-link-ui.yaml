risks:
  - severity: medium
    description: A bug in the merge-not-replace logic could silently duplicate or drop existing profile.skills/roles entries.
    mitigation: Dedicated acceptance criteria and tests for the dedup case; review step specifically checks this against role-templates' differing behavior.
  - severity: low
    description: A real end-to-end test against the live Anthropic API costs real money and requires the owner's own key — cannot be fully automated in CI.
    mitigation: Automated suite mocks the Anthropic client entirely (profile-ingestion-module story); this story's manual verification step is the one live-API check, done once, deliberately.

