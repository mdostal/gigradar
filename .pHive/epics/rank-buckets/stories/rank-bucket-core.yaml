design_decisions:
  - decision: A rule with zero criteria matches nothing, rather than being treated as a wildcard/catch-all.
    rationale: An owner who leaves a bucket's rule blank (still typing it in, or genuinely undecided) should never have every gig silently land in that bucket -- "no match" (null) is the honest, safe default, same posture as this codebase's "never guess" discipline elsewhere.

risks:
  - severity: low
    description: A keyword-matching implementation that subtly diverges from tiering.ts's own whole-word/case-insensitive semantics would produce two different, disagreeing keyword-match behaviors in the same codebase.
    mitigation: Reuse tiering.ts's exported whole-word-match helper directly (export it if not already exported) rather than reimplementing the regex.

