id: rank-bucket-core
epic: rank-buckets
title: GroupConfig.rankBuckets/StoredGig.rankBucket types + pure assignRankBucket() rule evaluator
status: complete
complexity: medium
methodology: classic
depends_on: []

description: |
  The deterministic, no-LLM-required base layer. Mirrors tiering.ts's
  own "first match wins, in declared order" precedence and doc-comment
  style exactly -- a gig is assigned to the FIRST bucket (in owner-defined
  order) whose simple rule it satisfies. Reuses the same two criteria
  primitives (a rate threshold, a keyword list) EngagementProfile/
  RoleAreaConfig already use elsewhere in this codebase -- not a new
  rule language.

acceptance_criteria:
  - "RankBucketRule type: { label: string; description?: string; minRate?: number; maxRate?: number; keywords?: string[] } -- every field optional except label; an empty rule (no minRate/maxRate/keywords) matches nothing (never a silent catch-all)"
  - "GroupConfig.rankBuckets?: RankBucketRule[] -- an ORDERED list, omitted means no rank-bucket UI/behavior at all for that group (same do-nothing-default convention every other optional Config field uses)"
  - "assignRankBucket(gig, rules) returns { bucket: string; reasons: string[] } for the first rule whose rate/keyword criteria the gig satisfies, in list order"
  - "returns { bucket: null, reasons: [...] } when no rule matches, or when rankBuckets is empty/unset -- never guesses a bucket, never assigns the first rule as a fallback"
  - "a rule with BOTH minRate/maxRate AND keywords requires ALL configured criteria on that rule to match (AND within one rule), matching this codebase's existing 'every configured check must pass' convention (see gate.ts's own multi-check AND semantics)"
  - "keyword matching is whole-word, case-insensitive, matched against title+description -- same convention tiering.ts's own keyword matching already uses (reused, not reimplemented divergently)"

steps:
  - id: implement
    description: Add RankBucketRule/GroupConfig.rankBuckets/StoredGig.rankBucket to types.ts, MatchQualityConfigSchema-sibling Zod schema, and a new src/lib/matching/rank-bucket.ts with assignRankBucket().
    agent: developer
  - id: test
    description: npm test && npm run typecheck must both pass. Exhaustive unit tests covering every acceptance criterion, first-match-wins ordering, AND-within-a-rule semantics, and the no-match/no-rules-configured cases.
    agent: tester
    depends_on: [implement]
  - id: integrate
    description: Commit, branch off dev, PR into dev, verify CI, merge.
    agent: developer
    depends_on: [test]

