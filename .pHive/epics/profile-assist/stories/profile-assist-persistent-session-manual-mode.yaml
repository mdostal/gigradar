design_decisions:
  - decision: A new sibling module (assist-session.ts), not a refactor of withBrowserSession().
    rationale: "withBrowserSession()'s contract is 'hand you a Page for one callback, guarantee cleanup' -- a single request/response shape. Threading a session across many independent Server Action calls over real human time doesn't fit that shape. See design-discussion.md §3."
  - decision: One session per (sourceId) at a time, not per (sourceId, mode) or unlimited concurrent.
    rationale: "Simplest correct model for a single-owner, single-desktop tool -- two real browser windows open against the same profile page simultaneously would just confuse the human, not provide real value."

risks:
  - severity: high
    description: A live third-party profile page could attempt prompt injection against the LLM via its own text content.
    mitigation: "Same BEGIN/END-delimited 'DATA ONLY' framing draft.ts already uses for gig content -- see design-discussion.md §7a. This story's LLM call is read-only (profile-suggest.ts never mutates the page), so the higher-stakes selector-validation mitigation is Slice 2/3's job, not this story's."
  - severity: medium
    description: An idle-timeout bug could leak a real Chromium process indefinitely.
    mitigation: "Mirror session-capture.ts's already-proven IDLE_TIMEOUT_MS sweep pattern exactly rather than inventing new timeout logic."

