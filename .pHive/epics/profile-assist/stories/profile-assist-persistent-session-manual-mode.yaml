    description: Confirm the exact current Playwright accessibility-tree snapshot API shape (page.accessibility.snapshot()) against the installed Playwright version, and re-read session-capture.ts's globalThis-pinning + idle-timeout implementation in full before writing assist-session.ts.
    agent: researcher
  - id: implement
    description: Write assist-session.ts, profile-suggest.ts, the per-source profile-edit URL config, and the /profile-assist page's Manual tab.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests for assist-session.ts's session-map lifecycle (start/end/idle-timeout/duplicate-source-rejection) with a mocked Playwright launch, and profile-suggest.ts's prompt-grounding (mirroring draft.test.ts's own fabrication-guardrail test). Real end-to-end verification against one real configured source, live, with the owner watching -- same bar every browser-session-auth mechanism in this codebase has cleared before shipping.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for origin-scoping reuse (never reimplemented), apiKey never held at module scope, and the idle-timeout leak class actually being closed.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the epic branch.
    agent: developer
    depends_on: [review]

