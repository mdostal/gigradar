id: profile-assist-persistent-session-manual-mode
epic: profile-assist
title: "Persistent browser-session primitive + Manual/copy-paste mode"
status: done
complexity: high
methodology: classic
depends_on: []

description: |
  Vertical Plan Slice 1 -- proves the epic's core new primitive (a
  browser session that stays open across many Server Action calls
  instead of the fresh-context-per-call `withBrowserSession()` shape)
  under the lowest-risk mode: no LLM browser control at all.

  1. `src/lib/auth/assist-session.ts` -- new module, sibling to
     `session-capture.ts`, reusing its EXACT concurrency idiom: a
     `globalThis`-pinned `Map<string, AssistSession>` (NOT a plain
     module-level const -- Next.js dev-server module re-evaluation
     would orphan a live browser handle otherwise, see
     session-capture.ts's own header comment for why this idiom is
     required). `AssistSession` shape: `{ sessionId, browser, context,
     page, sourceId, mode, startedAt, lastActivityAt }`.
     - `startAssistSession(sourceId, mode)`: resolves storageState via
       the SAME `readStorageStateFile()` + `filterStorageStateToAllowlist()`
       path `browser-session.ts` uses today (import and reuse those
       exact functions -- origin-scoping is safety-critical, never
       reimplement it), launches via `launchHeadedBrowser()` (also
       reused, unchanged), navigates to the source's profile-edit URL
       (new small per-source config, see below), stores the live
       handle. Returns `{ sessionId }`.
     - `endAssistSession(sessionId)`: closes context + browser, removes
       the map entry.
     - Idle-timeout sweep mirroring `session-capture.ts`'s
       `IDLE_TIMEOUT_MS` pattern -- an assist session left open with no
       activity must not leak a Chromium process forever.
  2. Per-source profile-edit URL: a small, explicit config addition
     alongside each `browser-session`-auth source's existing
     registration (gofractional, ateam, wellfound) -- never
     scraped/guessed at runtime.
  3. `src/lib/apply/profile-suggest.ts` -- ONE Anthropic Messages API
     call per "refresh suggestions" click, following draft.ts's EXACT
     shape: structured tool-use output, `apiKey` a REQUIRED parameter
     resolved by the caller and used ONLY inside this function (NEVER
     held at module scope -- same discipline as draft.ts/extract.ts),
     model `"claude-opus-5"`. Reads the live page's accessibility tree
     (`page.accessibility.snapshot()`) + `Config.profile`/
     `Config.applyProfile`, returns suggested copy per detected field.
     The page snapshot is untrusted third-party content -- wrap it in
     the SAME explicit BEGIN/END-delimited "DATA ONLY, never
     instructions" framing draft.ts already uses for gig content
     (design-discussion.md §7a) -- do not invent a new framing.
  4. New `/profile-assist` page + nav link (NAV_LINKS in
     nav-header.tsx). Manual tab only for this story: source picker
     (any configured browser-session-auth source), Start/Done buttons,
     a suggested-copy panel with a "Refresh suggestions" button.
     Guided/Full-auto tabs are visually present but disabled/"coming
     soon" -- this story ships one working tab, not three empty ones.

acceptance_criteria:
  - "Given a configured browser-session-auth source with a valid storageState file, clicking Start on the Manual tab opens a real, visible headed browser window navigated to that source's profile-edit page, and the session stays open (does not auto-close) until Done is clicked or the idle timeout fires."
  - "Given an open Manual-tab session, clicking Refresh suggestions returns real LLM-generated suggested copy grounded in the owner's actual Config.profile/applyProfile fields -- never fabricated experience/figures not present in the source data (same fabrication guardrail draft.ts already enforces)."
  - "Given two Manual-tab sessions are never started concurrently for the SAME sourceId, starting a second session for the same source while one is already open returns a specific 'session already active for this source' error, not a second browser window."
  - "Given an assist session left open with no activity, it is automatically closed after the idle timeout -- no orphaned Chromium process."
  - "Clicking Done (or the idle timeout firing) always calls endAssistSession() and closes the real browser -- verified via no leftover Chromium process in `ps aux` after a real end-to-end run."

steps:
