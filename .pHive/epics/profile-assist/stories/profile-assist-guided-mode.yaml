design_decisions:
  - decision: Guided mode is built BEFORE Full-auto, even though the epic's north star is full autonomy.
    rationale: "The tool-use loop is new to this codebase. Proving its mechanics (tool selection, selector validation, turn-by-turn execution) under human approval-gating is materially lower risk than trusting it unsupervised on the first real run. See vertical-plan.md's ordering rationale."
  - decision: Selector validation rejects as a tool error (LLM sees it and can retry/ask_human), not a silent no-op.
    rationale: "A silently-dropped action leaves the LLM's own model of page state wrong on the next turn -- it would 'think' the fill happened. An explicit tool error keeps the LLM's context accurate."

risks:
  - severity: high
    description: A bug in the approval gate could let a click/fill execute without an explicit human Approve.
    mitigation: "Reviewer step explicitly audits every code path that calls the underlying click()/fill() Playwright calls for a missing approval check -- this is the single most safety-critical review in this story."
  - severity: medium
    description: An unbounded tool-use loop could run up real API cost or hang the session indefinitely.
    mitigation: Hard per-session turn cap, enforced server-side, not advisory.

