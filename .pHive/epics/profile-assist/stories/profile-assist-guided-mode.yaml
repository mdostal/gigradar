id: profile-assist-guided-mode
epic: profile-assist
title: "Guided mode: the tool-use loop, human-approval-gated"
status: done
complexity: high
methodology: classic
depends_on: [profile-assist-persistent-session-manual-mode]

description: |
  Vertical Plan Slice 2 -- builds the tool-use loop that Full-auto
  (Slice 3) will reuse verbatim, but gates every mutating action behind
  human approval so the loop's mechanics are proven safe before Slice 3
  ever lets it act unsupervised.

  1. The tool-use loop (`src/lib/apply/profile-assist-loop.ts`):
     turn-by-turn -- send the LLM the CURRENT page's accessibility-tree
     snapshot (freshly re-read every turn, per design-discussion.md §7:
     never a stale cached snapshot from session start) wrapped in the
     SAME "DATA ONLY" delimited framing Slice 1's profile-suggest.ts
     already established, plus the owner's profile data, plus a fixed
     4-tool schema:
       - `read()` -- re-snapshot the live page, no side effect.
       - `click(selector)` -- click an element.
       - `fill(selector, value)` -- fill a field.
       - `ask_human(question)` -- pause, surface the question in the
         UI transcript, block until the human answers; the browser
         stays open and human-usable while paused (design-discussion.md
         §7's resolved answer -- ask_human blocks only that turn, not
         the whole session).
     The LLM picks ONE tool call per turn; the Server Action executes
     it (or, for ask_human, waits). A hard per-session turn cap (config
     constant, e.g. 40) prevents a runaway loop.
  2. Selector validation, the SECOND layer of prompt-injection defense
     (design-discussion.md §7a) -- new to this story, higher stakes
     than Slice 1's read-only case: before executing a proposed
     `click`/`fill`, the Server Action validates the selector against
     elements ACTUALLY PRESENT in the just-read snapshot. A selector
     for an element that wasn't in the snapshot is rejected outright
     (returned to the LLM as a tool error, not silently executed) --
     even a successfully-injected instruction can only ever act on
     real, currently-visible page elements.
  3. Approval gate: `click`/`fill` proposals are NOT executed
     immediately. They're surfaced in the UI as a pending-action card
     (selector + value + the LLM's own stated reason) with Approve /
     Reject / Edit-then-approve. `read`/`ask_human` need no approval
     (no side effect). Only on Approve does the Server Action actually
     run the tool call against the live page.
  4. Guided tab on `/profile-assist`: a running transcript (every
     turn: what the LLM did/proposed/asked), pending-approval cards,
     reuses Slice 1's Start/Done session lifecycle unchanged.

acceptance_criteria:
  - "Given an open Guided-tab session, an LLM-proposed click/fill action appears as a pending-approval card and does NOT execute until the human clicks Approve."
  - "Given a pending-approval card, Reject discards the action and the loop continues to the next turn without it having touched the page; Edit-then-approve executes the human-edited value instead of the LLM's original proposal."
  - "Given the LLM proposes a selector for an element not present in the current page snapshot, the Server Action rejects it as a tool error BEFORE it ever reaches the approval-card UI -- never silently executed, never silently dropped without the LLM seeing why."
  - "Given an ask_human tool call, the question appears in the transcript and the loop blocks on that turn only -- the human can still manually interact with the open browser window while waiting to answer."
  - "Given a session that reaches the hard turn cap, the loop stops cleanly with a clear 'turn limit reached' message in the transcript, not a silent hang or crash."
  - "Real end-to-end verification: the owner runs a full Guided-mode session against a real configured source and approves/rejects/edits a mix of real proposed actions, watching the live browser update accordingly."

steps:
  - id: research
    description: Confirm the current @anthropic-ai/sdk multi-turn tool-use conversation shape (tool_result blocks, conversation history threading) against the installed SDK version -- draft.ts is single-shot, this is the first multi-turn loop in this codebase.
    agent: researcher
  - id: implement
    description: Write profile-assist-loop.ts, selector validation, the approval-gate Server Actions, and the Guided tab UI.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests for selector validation (present vs absent element), turn-cap enforcement, and approve/reject/edit branching, with a mocked LLM + mocked page. Real end-to-end verification per the acceptance criteria's last item.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review the prompt-injection mitigation (delimiting + selector validation) and the approval gate for any path where a click/fill could execute without an explicit Approve.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the epic branch.
    agent: developer
    depends_on: [review]

