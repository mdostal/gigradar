  key_files:
    - path: src/lib/store/gigs.ts
      purpose: "recordScan()'s UPSERT — confirms tier is already overwritten on every re-seen scan; this story extends that same tier-write path to unseen gigs on a schedule instead."
    - path: src/scheduler/index.ts
