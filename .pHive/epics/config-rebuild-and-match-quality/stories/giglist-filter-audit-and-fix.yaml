      purpose: "The giglist's own filter implementation — column filters, tier/status/source/profile-match/seen-window controls. Full read required, not a skim."
    - path: src/app/dashboard-filter.ts
      purpose: "Pure filter-logic helpers (isWithinSeenWindow, etc.) already reused elsewhere this session — check whether the UI actually wires these correctly."

references:
