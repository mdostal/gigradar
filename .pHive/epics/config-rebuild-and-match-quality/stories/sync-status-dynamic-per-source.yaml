id: sync-status-dynamic-per-source
epic: config-rebuild-and-match-quality
title: "Generalize the hardcoded 2-source sync-status UI into a dynamic list that scales"
status: complete
complexity: low
methodology: classic
depends_on: []

progress_note: |
  Built src/app/sync-status-registry.ts (SYNC_STATUS_SOURCES: readonly
  {id,label,action}[]) mirroring origins.ts's own KNOWN_SOURCES id->label
  pattern, referencing the two real reconcile*Statuses() Server Actions
  (GoFractional, Wellfound — confirmed via code search these are still the
  only 2 of ~13 sources with a real adapter). Kept it a plain module (NOT
  "use server") since a "use server" file may only export async functions
  — a data registry referencing already-exported action functions has to
  live outside it.

  Built src/app/sync-status-dropdown.tsx (new "use client" component):
  a single "Sync statuses ▾" toggle button opening a dropdown that lists
  every SYNC_STATUS_SOURCES entry, each with independent idle/syncing/
  done/error state, reusing the exact same result-summary shape the old
  SyncStatusButton established. Wired into both src/app/gigs/page.tsx and
  src/app/[group]/gigs/page.tsx, replacing the two hardcoded
  <SyncStatusButton> instances with one <SyncStatusDropdown
  sources={SYNC_STATUS_SOURCES} />. Deleted the now-dead
  sync-status-button.tsx (confirmed zero remaining JSX usage).

  Adding a third real reconcile adapter now requires exactly one new
  registry entry — zero UI changes, satisfying the story's own
  acceptance criteria.

  Verified: npx tsc --noEmit clean; npm test -- --run — 107 files, 1425
  passed, 3 skipped, all green; live curl verification against an
  isolated dev server (XDG_DATA_HOME=/tmp/gigradar-verify-data, port
  3100) confirmed /gigs renders "Sync statuses", "GoFractional",
  "Wellfound" with no error markers. No real browser opened, no
  Playwright — curl-only per this session's standing constraint.

description: |
  Confirmed via code read: src/app/gigs/page.tsx and
  src/app/[group]/gigs/page.tsx each hardcode exactly two
  <SyncStatusButton> instances (GoFractional, Wellfound) — the only 2 of
  ~13 sources with a real reconcile*Statuses() adapter
  (src/lib/sources/gofractional-status.ts, wellfound-status.ts). Owner:
  "sync statuses should be across all of them and then allowed for each
  one in a drop down or something -- as you sign up and add accounts,
  more should appear."

  Build a small registry (mirroring KNOWN_SOURCES's own
  id->{label,...} pattern in src/lib/sources/origins.ts) mapping sourceId
  -> its reconcile Server Action, and render the sync UI (a dropdown or
  equivalent — owner's own suggestion, not mandated verbatim) by iterating
  that registry instead of two hardcoded JSX lines. Adding a third real
  reconcile*Statuses() adapter in the future (a separate, already-flagged
  follow-on epic) should require zero UI changes — just a new registry
  entry.

acceptance_criteria:
  - "The sync UI lists every source with a real reconciliation adapter, not a fixed 2 — verified by reading the registry, not counting hardcoded JSX."
  - "Adding a hypothetical third adapter to the registry (a quick manual test, not necessarily a real new adapter) makes it appear in the UI with zero other code changes."
  - "Existing GoFractional/Wellfound sync behavior is unchanged — this is a UI generalization, not a reconciliation-logic change."

