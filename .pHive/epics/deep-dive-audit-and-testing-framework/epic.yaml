description: |
  Owner-requested deep-dive audit (2026-09-02) across six problem areas
  (state-tracking, auto-update, memory/context quality, per-platform
  drafting, focus-stealing browser windows, testing-framework maturity).
  Six parallel research agents grounded every finding in real file:line
  citations and, where safe, real data. Full findings:
  .pHive/epics/deep-dive-audit-and-testing-framework/docs/design-discussion.md

  This epic is the FIRST of a 5-epic program the owner confirmed:
  1. THIS epic — fix what's small/severe/well-understood now, lay the
     testing-framework foundation everything else builds on.
  2. platform-aware-application-drafting (follow-on, not yet planned)
  3. embedded-browser-and-guided-session (follow-on, not yet planned)
  4. deep-memory-and-context (follow-on, not yet planned)
  5. ui-overhaul-via-ui-squads (follow-on, not yet planned)

  Scale: Medium (multi-file, cross-stack, but bounded and well-understood
  — H/V planning folded into the design-discussion doc rather than run as
  separate ceremony documents; owner confirmed this scale assessment).

