    agent: researcher
  - id: implement
    description: Scaffold src-tauri/, the sidecar-prep script, next.config.js's standalone output, and main.rs's spawn+poll+load-url logic.
    agent: developer
    depends_on: [research]
  - id: test
    description: Manual verification per acceptance criteria (this story has no automated-test surface -- it's packaging, not application logic, per design-discussion.md's own Verification Strategy).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review main.rs for the minimal-Rust-surface discipline (spawn + poll + load URL only, no gigradar logic reimplemented in Rust).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the epic branch.
    agent: developer
    depends_on: [review]

