risks:
  - severity: medium
    description: A bug in the backoff filtering could accidentally persist a source-disable state to the real config.json.
    mitigation: Dedicated acceptance criterion and a grep-verifiable regression test asserting saveConfig() is never called anywhere in the scheduler module.
  - severity: low
    description: croner's exact API shape wasn't verified during planning (no live test at design time).
    mitigation: The pin-croner-api step runs first, before the rest of the story is built against assumed shapes.

