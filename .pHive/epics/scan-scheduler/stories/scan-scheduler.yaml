design_decisions:
  - decision: Idle-and-recheck-hourly instead of exit-0 when Config.schedule is unset
    rationale: Grill H2 -- an immediate clean exit risks being misread as a crash by an always-restart process supervisor, producing restart-loop noise.
  - decision: Backoff filtering is strictly in-memory, never written to config.json
    rationale: Grill H1 -- this project has held a strict discipline against silently mutating the user's real config; a persisted backoff-driven disable would be exactly the class of silent, destructive bug that discipline exists to prevent.
  - decision: Ship a real macOS launchd template, not just the scheduler mechanism
    rationale: Grill U1 -- the epic's own "set up the loops" framing implied durable automation; mirrors agent-integration's own resolution to an analogous finding (ship the copy-pasteable artifact, not just the underlying capability).

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md with the scheduler's behavior and the launchd template."

