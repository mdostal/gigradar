    description: "This exact bug already survived one full investigation this session without a root cause. Real risk of spending equivalent time again for the same inconclusive result."
    mitigation: "Test angle 1 (any-route vs /config-specific) FIRST -- cheapest possible test, and its result redirects or narrows everything downstream. Don't re-run the earlier investigation's already-ruled-out checks (portunus timing, PATH ENOENT)."

