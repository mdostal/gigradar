id: config-cold-start-hang-investigation
epic: config-detail-and-scan-hardening
title: "Focused root-cause investigation: /config hangs on the first request after a fresh packaged-app launch"
status: complete
complexity: medium
methodology: classic
depends_on: []

progress_note: |
  Angle 1 tested first (cheapest, most informative, per this story's own
  priority order): a fully fresh app launch's FIRST-EVER request to "/"
  (not /config) responded in 0.06s -- not a hang. This already argued
  against a generic process-cold-start cost.

  Testing /config itself hit a real, separate confound: an UNRELATED
  Next.js dev server on this machine (a different project, "apps/web",
  Turbopack, v16.3.2) was squatting on port 3000, so gigradar's own
  sidecar was silently falling back to a random port every launch this
  session -- confirmed via lsof (port 3000 owned by a process with no
  relation to gigradar.app) and via the response body itself (turbopack
  chunk paths from a different app entirely). Every curl test this
  session that assumed "port 3000 = gigradar" without checking first was
  at real risk of silently hitting the wrong server.

  Once corrected to gigradar's REAL sidecar port (looked up per-launch
  via lsof against the actual child pid, never assumed as 3000): ran 4
  full clean quit -> relaunch -> first-ever-request-to-/config cycles.
  ALL FOUR were fast (0.15s-0.20s) -- zero hangs reproduced.

  CONCLUSION: this is not a persistent, reliably-reproducible defect in
  gigradar's own code -- 0 of 4 clean repro attempts hung. The earlier
  same-session "confirmed" hang (0% CPU, blocked in kevent, zero children
  spawned) most likely was real at the time but caused by test-
  environment contamination during an unusually heavy concurrent-
  debugging window (a day-old orphaned sidecar process was discovered and
  killed minutes earlier in that same investigation, and multiple
  process-launch/kill cycles were happening in rapid succession) rather
  than a deterministic bug that reproduces on an ordinary clean launch.
  A secondary, unproven but consistent-with-all-symptoms theory: a
  one-time macOS Gatekeeper/code-signing verification cost specific to
  the very FIRST execution of a just-`xattr -cr`'d, freshly-extracted app
  bundle (would explain cold-start-only, zero-CPU/kernel-level-blocked,
  and zero-child-process-spawned-by-JS -- but this mechanism was not
  independently isolated or proven, and is flagged as a theory, not a
  certainty).

  No code change made -- there is no reproducible defect to fix. The
  practically important finding is the negative result itself: this is
  not something the owner will keep hitting on ordinary use, and the
  actual footgun found instead (the port-3000 collision with an unrelated
  project) is a real, separate, machine-local issue outside gigradar's
  own code, not something for gigradar itself to guard against.

description: |
  Confirmed today, reproduced across a full clean reinstall + relaunch
  cycle: the FIRST request to /config after a fresh packaged-app (Tauri
  sidecar) launch hangs indefinitely (20s+, never returns). Every request
  after that first one is fast (sub-20ms). During the hang, `sample`d the
  sidecar's Node process: 0% CPU, main thread blocked in kevent (genuinely
  idle waiting on I/O, not spinning), and ZERO child processes spawned --
  so it is not a hung `portunus --version` child, it is blocked BEFORE or
  without ever spawning one.

  This is the same class of issue flagged once already this session
  (src/app/config/config-data.ts's loadConfigPageData() carries its own
  code comment documenting a reverted Promise.all() parallelization
  attempt that caused a hang specific to the packaged Tauri sidecar, root
  cause never understood, sequential loop restored as a mitigation) -- but
  today's new evidence (cold-start-ONLY, not persistent; 0% CPU; zero
  children) was not available during that earlier pass and meaningfully
  narrows the hypothesis space. Zero children spawned during the hang is
  the most useful new fact: it rules out isPortunusAvailable()'s
  `portunus --version` spawn itself being slow (already separately ruled
  out earlier this session via isolated timing: 86-139ms) and points
  further upstream.

  Real, focused investigation required -- NOT another guess-and-abandon
  pass. Candidate angles to check, cheapest/most-informative first:
  1. Does the FIRST request to ANY route (not specifically /config) hang
     the same way after a fresh launch, or is it specific to /config?
     Cheap to test (curl "/" first instead of "/config" on a fresh
     launch) and highly informative -- if true, this redirects the whole
     investigation to a Tauri-sidecar-cold-start issue, not a
     /config-code issue, and this story's fix target changes accordingly.
  2. If /config-specific: a one-time lazy-init cost the FIRST time
     isPortunusAvailable() or checkSessionReadiness() runs in a fresh
     process (Gatekeeper/quarantine check on first `exec` of a bundled
     binary path; a portunus daemon/socket handshake that's one-time-
     per-process rather than one-time-per-call).
  3. If neither: a Next.js/Tauri-sidecar-specific cold-start cost
     unrelated to this route's own code (build-manifest lazy compilation
     of the /config route specifically, since it's a large page).

  Acceptance is a conclusively identified root cause OR a real fix -- not
  another inconclusive pass. If genuinely inconclusive after a real
  attempt at the angles above, document precisely and specifically what
  was ruled out and why (matching the rigor of this session's own prior
  passes), rather than a vague "still unknown."

acceptance_criteria:
  - "Angle 1 (any-route-vs-/config-specific) is tested and its result reported, since it determines the rest of the investigation's direction."
  - "Either: a conclusively identified root cause with supporting evidence, and a real fix verified to make the FIRST /config request after a fresh launch fast; OR a precise, specific account of what was tested and ruled out, distinct from the prior inconclusive pass's own findings (not a repeat of it)."
  - "Verification is against a REAL packaged app launch (this bug does not reproduce in `npm run dev` mode, confirmed this session) -- curl-only against the packaged app's own port, no browser, no Playwright."

