      export type SessionReadiness = "no-login-needed" | "connected" | "needs-login";

  - title: "EngagementProfile shape the Groups card's rate-range formatting reads"
    file: src/lib/types.ts
    snippet: |
      export interface EngagementProfile {
        id: string;
        label: string;
        types: EngagementType[];
        minRate: number;
        highRate: number;
        maxHours?: number;
        maxHoursAtHighRate?: number;
        rateUnit: "hour" | "year";
      }

