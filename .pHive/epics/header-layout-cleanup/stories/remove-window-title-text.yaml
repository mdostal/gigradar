progress_note: |
  SHIPPED, PR #191 (https://github.com/mdostal/gigradar/pull/191),
  branch feat/remove-window-title-text -> dev.

  Read the real, installed crate source rather than guessing: Cargo.lock
  pins tauri 2.11.5 / tao 0.35.3. `WebviewWindowBuilder::title("")` alone
  only clears the string; the real, purpose-built API for a genuinely
  clean traffic-lights-only title bar is `hidden_title(bool)`
  (macOS-only on tauri's own builder) -- traced it through
  tauri-runtime-wry 2.11.4's `hidden_title` -> tao's
  `WindowBuilderExtMacOS::with_title_hidden` -> the real AppKit call,
  `ns_window.setTitleVisibility(NSWindowTitleVisibility::Hidden)`
  (tao-0.35.3/src/platform_impl/macos/window.rs:269). Changed
  src-tauri/src/lib.rs's WebviewWindowBuilder (~line 351) from
  `.title("gigradar")` to `.title("")` plus
  `#[cfg(target_os = "macos")] .hidden_title(true)` -- gated because
  `hidden_title` isn't offered on non-macOS builders (matches this
  file's existing cfg(target_os = "macos") conventions elsewhere).
  inner_size and the webview URL/server-ready wait logic were untouched,
  per the story's own scope.

  Verification, all clean, all in an isolated worktree
  (/Users/mdostal/gigradar-worktrees/remove-window-title-text, branch
  feat/remove-window-title-text off origin/dev):
    - npm test: 1782 passed, 3 skipped, 0 failed.
    - npm run typecheck: clean.
    - cargo check (src-tauri): clean.
    - cargo test (src-tauri): 8 passed, 0 failed.

  REAL post-fix verification against the actual packaged app (per this
  epic's standing procedure):
    1. Backed up ~/.local/share/gigradar to
       ~/gigradar-backups/gigradar-data-20260907-193922.tar.gz BEFORE
       touching the real app; confirmed both config.json and gigs.db
       are present inside the archive.
    2. Baseline real gig count from the live gigs.db: 2042 rows.
    3. Quit the running packaged app cleanly via
       `osascript -e 'tell application "gigradar" to quit'`.
    4. Built the real .app: `npm run build` ->
       `scripts/prepare-tauri-sidecars.sh` -> `npx tauri build`
       (the release binary + .app bundle built successfully; the
       downstream .dmg-bundling step failed on this headless run --
       a known bundle_dmg.sh/Finder-automation flakiness unrelated to
