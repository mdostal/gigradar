description: |
  Owner's own explicit direction (2026-09-07): a settings gear icon should
  appear in the top-right of the app -- now that `SonarSweepHeader`
  (`sonar-sweep-header-global-masthead` story) is the literal top of every
  page, this is the real, current top-right of the app.

  Explicitly deferred by the owner, NOT part of this story (do not guess
  or pre-decide): whether the existing "Setup" and "Config" nav tabs
  should consolidate into this gear icon, replace it, or coexist
  alongside it. This story is PURELY ADDITIVE -- add a real, working gear
  icon button; do NOT remove, hide, merge, or rename the existing "Setup"
  or "Config" nav tabs in `nav-header.tsx`. That consolidation decision is
  tracked separately (see the sibling triage entry / backlog item) for a
  later pass once the owner has decided.

  **The fix**: add a real gear/settings icon button to the right-hand
  group of `SonarSweepHeader`'s top row (`src/app/sonar-sweep-header.tsx`,
  the flex row containing the Sources/Profile/Last-sweep Instruments and
  the "Sweep now" button -- see that file's own real JSX structure), or as
  its own element pinned to the far-right edge of that same row if that
  reads better visually once you see it rendered. It should link to
  `/config` (the more comprehensive of the two existing settings-shaped
  pages) for now -- a plain, real, working navigation link, not a
  non-functional placeholder. Use a real SVG gear icon consistent with
  this app's existing icon style (check `ScopeIcon`'s own inline-SVG-with-
  theme-CSS-variables convention in this same file, or any other icon
  component already in the app, for the pattern to match -- do not import
  an icon library dependency for one icon).

  Do NOT touch: the existing "Setup"/"Config" nav tabs in `nav-header.tsx`
  (untouched, per the explicit deferral above), `SonarSweepHeader`'s other
  existing elements (Instruments, Sweep now button, ScopeIcon).

acceptance_criteria:
  - "A real, visible gear/settings icon button appears in the top-right area of the masthead, on every page (since the masthead is now global)."
  - "Clicking it navigates to /config -- a real, working link, not a placeholder."
  - "The existing 'Setup' and 'Config' nav tabs in nav-header.tsx are completely unchanged -- this is additive only."
  - "Real post-fix verification against the ACTUAL running app: rebuild, relaunch (backup first), and confirm via curl/DOM evidence that the gear icon renders and links correctly on multiple real routes."
  - "npm test and npm run typecheck both pass."

