    description: Confirm Full Roster's real current markup/behavior (distinct from Picks) before wiring both
    agent: developer
  - id: implement
    description: Mount GigDetailPanel in today-client.tsx for both Picks and Full Roster, reusing today's own draft/prep logic in the render-prop slots
    agent: developer
    depends_on: [research]
  - id: test
    description: Add/extend tests covering the panel's presence and correct wiring on both sections; run full suite
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify against the real rebuilt app that both sections open the modal correctly with a working external link
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, branch off dev, PR into dev
    agent: developer
    depends_on: [review]
