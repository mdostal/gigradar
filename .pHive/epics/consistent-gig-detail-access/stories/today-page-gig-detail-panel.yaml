design_decisions:
  - decision: Reuse the existing GigDetailPanel component rather than building a new detail surface for Today's page.
    rationale: "Real research (design-discussion.md §2) confirmed the panel is already generic, reusable, and has everything needed (including the external-link mechanism) built in -- inventing a second detail surface would duplicate real, already-working code and risk drifting from it, the same failure class this session has repeatedly had to fix elsewhere."
  - decision: Reuse today-client.tsx's own draft/prep action logic in the panel's render-prop slots, not dashboard-client.tsx's separate helpers.
    rationale: "Today's page has its own real, recently-fixed (today-picks-analyze-feedback story) draft/analyze wiring -- duplicating dashboard's separate implementation would reintroduce the exact 'two divergent copies of the same logic' pattern already fixed multiple times today."

