design_decisions:
  - decision: "One combined LLM call (fit-analysis + interview-prep together), not two separate calls like personal-site's match-score/interview-prep chat mode."
    rationale: "Cheaper (one call), and predicted questions naturally cohere with the same gaps the fit analysis surfaces when generated together. See design-discussion.md §5."
  - decision: "keyGaps/predictedQuestions are LLM SYNTHESIS (analysis), not verbatim extraction -- the no-fabricated-data rule applies to FACTS about the gig/profile (never invent a rate, a skill the profile doesn't list, a requirement the posting doesn't state), not to the LLM's own reasoning about those facts."
    rationale: "Distinguishes this call site from every other LLM-extraction path in this repo (which extracts facts verbatim) -- this one is asked to reason, and reasoning is the entire point of a 'judgment' tool. Stated explicitly so a future reviewer doesn't misapply the wrong rule."

