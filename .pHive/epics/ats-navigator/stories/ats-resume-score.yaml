id: ats-resume-score
epic: ats-navigator
title: "Deterministic parseability check + keyword-overlap score in prep packets"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Vertical Plan Slice 4 (independent of Slices 1-3). Extends
  generatePrepPacket()/PrepPacketContent (src/lib/apply/prep.ts,
  career-crm epic) with an ATS-compatibility pass, framed explicitly as
  candidate-side resume coaching (design-discussion.md section 0's
  framing), NOT reverse-engineering any vendor's proprietary scoring:

  1. DETERMINISTIC parseability checks (no LLM call) run against whatever
     structure profile-ingestion/extract.ts's existing resume-ingestion
     path already extracted: multi-column layout, tables, text embedded
     in images, contact info in a header/footer, non-standard section
     headings, unusual fonts. Each flag names the SPECIFIC problem in
     plain language a candidate can act on (e.g. "your contact info is in
     a header -- many ATS parsers skip headers entirely") -- explainable,
     never a black box, matching this repo's existing gate() philosophy.
  2. Keyword-overlap score: the user's resume text vs. THIS gig's own
     scraped description (already in hand, no new data source) -- an
     LLM call reusing generatePrepPacket()'s existing single-shot shape
     and the SAME BEGIN/END untrusted-DATA framing every other LLM call
     site in this repo applies to scraped gig text (buildGigDataBlock()
     precedent).

  Both surface as a new atsScore section on PrepPacketContent, rendered
  in the EXISTING prep-packet UI -- no new page, no new drafting flow, no
  new LLM-call-site shape.

acceptance_criteria:
  - "PrepPacketContent gains an atsScore field: {parseabilityIssues: string[], keywordOverlapScore: number, matchedKeywords: string[], missingKeywords: string[]} (or equivalent -- exact shape decided during implementation, but every field must be individually explainable, no bare aggregate score without the reasons behind it)."
  - "parseabilityIssues are computed by a PURE function with zero LLM calls, unit-testable with synthetic malformed-resume-structure fixtures (multi-column, table, image-text, header-contact-info cases each get their own test)."
  - "A resume with none of the known problem patterns produces an empty parseabilityIssues array, not a false positive."
  - "keywordOverlapScore's LLM call wraps the gig's scraped description in the SAME BEGIN/END untrusted-DATA delimiting buildGigDataBlock()/buildGigResultBlock() already use elsewhere in this repo -- verified by a test asserting the delimiter text is present in the constructed prompt."
  - "The existing prep-packet UI renders the new atsScore section without breaking any existing rendering of score/rationale/topStrengths/keyGaps/recommendation."
  - "apiKey is resolved by the CALLER (Server Action), never inside prep.ts's own function bodies -- same discipline every other LLM-calling function in this repo follows, verified by grep/review, not just a test."

steps:
  - id: research
    description: Confirm profile-ingestion/extract.ts's exact resume-ingestion output shape (what structural metadata, if any, survives extraction today) to know whether parseability checks run against raw file bytes, extracted text, or an intermediate structure -- a real finding, not an assumption.
    agent: researcher
  - id: implement
    description: Add the parseability pure-function pass and the keyword-overlap LLM extension to prep.ts, extend PrepPacketContent, wire into the existing prep-packet UI.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests per acceptance criteria, including synthetic malformed-resume fixtures for every parseability check.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm every flag is individually explainable (no unexplained aggregate score), confirm untrusted-DATA delimiting is present, confirm apiKey discipline.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

