risks:
  - severity: medium
    description: A zod schema that's too strict (e.g. accidentally required roleArea) would break the documented "omitted roleArea = valid yellow-default" contract silently until someone hits it.
    mitigation: Acceptance criteria explicitly test the omitted-fields case, not just the fully-populated happy path.

