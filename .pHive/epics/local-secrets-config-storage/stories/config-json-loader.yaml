design_decisions:
  - decision: config.json lives outside the repo tree (shared XDG directory with the DB), not inside .local/
    rationale: Grill adversarial review (round 1) found the original in-repo-tree draft contradicted the security precedent the merged find-pipeline-foundation epic already established for exactly this threat model (local secrets/state must not rely on gitignore alone). Confirmed by team review (architect, security-reviewer).
  - decision: loadConfig() is synchronous
    rationale: Team review (tpm) — this is a public API shape decision, not safe to defer. Matches the primary caller (runner.ts via tsx) and path.ts's existing sync style.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md's auth/login-handling section to describe the new src/lib/config/ loader and resolve the pre-existing ambiguity between types.ts's 'never in the repo' Config comment and ARCHITECTURE.md's own '.local/' example — state explicitly that config now lives in the XDG data directory, outside the repo entirely."

