id: env-secrets-and-templates
epic: local-secrets-config-storage
title: .env secrets loading, env: reference resolution, gitignore verification, and example templates
status: pending
complexity: low
methodology: classic
depends_on: [config-json-loader]

description: |
  Build the secrets half of the local config/secrets loading layer, on top
  of the `config-json-loader` story's `src/lib/config/` module.

  1. **`.env` loading**: add the `dotenv` package (user-confirmed choice —
     not hand-rolled) and load a `.env` file from the SAME resolved XDG
     directory as `config.json` (via `getDefaultDataDir()`, reused from
     the prior story — no new path resolution logic).

  2. **`env:` reference resolution**: extend `loadConfig()` (from the prior
     story) to walk each `SourceConfig.settings` object's TOP-LEVEL string
     values only (nested objects/arrays are explicitly out of scope for
     this story — document this limitation in the loader's JSDoc). Any
     value with the literal prefix `env:` (e.g. `"env:BRAINTRUST_API_KEY"`)
     is resolved to `process.env.BRAINTRUST_API_KEY` (after `.env` has been
     loaded into `process.env` via `dotenv`). If a referenced env var is
     declared but unset, throw a specific error NAMING THE VAR — never the
     value. Resolved secret values must never be logged, never included in
     any error message, and the loaded `Config` must never be
     serialized/dumped wholesale anywhere in this module.

  3. **File permissions**: if this module ever creates `.env` (e.g.
     first-run scaffolding from `.env.example`), create it with mode
     `0600`. If an existing `.env` is found group- or world-readable, warn
     loudly (console warning naming the file) — for `.env` this is a real
     secret-exposure risk, not just a hygiene nit, so treat the warning as
     load-bearing (still non-fatal, but prominent).

  4. **Gitignore verification**: add a real test using `git check-ignore`
     (not visual inspection) confirming that both the resolved XDG
     directory's contents AND any accidental repo-root `config.json`/`.env`
     would be excluded from git tracking. Belt-and-suspenders on top of the
     outside-repo-tree default from the prior story.

  5. **Example/template files** (committed, at the repo root — these are
     documentation, not the real files, and contain placeholder/dummy
     values only): `config.example.json` (mirrors the full `Config` shape:
     profile, needs, sources with an `env:`-reference example, roleArea,
     schedule) and `.env.example` (one placeholder line per example env
     var referenced in `config.example.json`). `config.example.json` MUST
     validate against the SAME zod schema `loadConfig()` uses (from the
     prior story's `schema.ts`) — enforced by a test, so schema drift is
     caught automatically, not left to manual upkeep.

acceptance_criteria:
  - "Given a .env file at the resolved XDG path with BRAINTRUST_API_KEY=abc123, when loadConfig() runs and a SourceConfig.settings value is \"env:BRAINTRUST_API_KEY\", then the resolved Config's settings value is \"abc123\"."
  - "Given a SourceConfig.settings value references an env var that is declared (env:SOME_VAR) but that var is unset, when loadConfig() runs, then it throws an error naming SOME_VAR — the error message never contains any resolved secret value."
  - "Given a nested settings value (e.g. settings.auth.apiKey = \"env:X\"), when loadConfig() runs, then the nested value is NOT resolved (left as the literal string) — documented as an explicit v1 limitation, not silently broken."
  - "Given an existing .env file is world-readable, when loadConfig() runs, then it emits a prominent console warning naming the file, before or alongside successful resolution (non-fatal)."
  - "Given the resolved XDG directory (or a stray repo-root config.json/.env), when checked with `git check-ignore`, then all are confirmed ignored — a real subprocess-based test, not a static read of .gitignore's contents."
  - "Given config.example.json committed at the repo root, when validated against the same zod schema loadConfig() uses, then it passes — proven by a test that imports the schema and parses the example file."
  - "Given .env.example committed at the repo root, when inspected, then it contains one placeholder line per env var referenced in config.example.json's env: values, with no real secret value anywhere."
  - "No resolved secret value appears in any log output, error message, or test snapshot committed to the repo."

steps:
  - id: research
    description: Read the config-json-loader story's implementation (src/lib/config/load.ts, schema.ts) once merged/available. Confirm dotenv's API for loading a .env file from an arbitrary (non-default) path.
    agent: researcher
  - id: implement
    description: Add the dotenv dependency, extend src/lib/config/load.ts with .env loading and env: resolution, add config.example.json and .env.example at the repo root, implement the permission-check warnings.
    agent: developer
    depends_on: [research]
  - id: test
    description: Write unit tests covering every acceptance criterion above, including the real git check-ignore subprocess test and the config.example.json schema-validation test. Use temp directories for file-permission tests, never touching a real user's actual XDG data dir or committing test secrets.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness, and specifically audit that no code path logs or serializes a resolved secret value anywhere (this is the story's highest-stakes review item).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/local-secrets-config-storage.
    agent: developer
    depends_on: [review]

