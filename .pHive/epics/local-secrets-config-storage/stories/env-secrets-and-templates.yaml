risks:
  - severity: high
    description: "A resolved secret value leaking into a log line, error message, or test snapshot would defeat the entire point of this epic — this is the single highest-stakes failure mode."
    mitigation: Explicit acceptance criterion ("no resolved secret value appears in any log output, error message, or test snapshot") plus a dedicated review-step audit item, not left to incidental code review.
  - severity: medium
    description: An unscoped env: convention could resolve an unrelated sensitive env var (e.g. AWS_SECRET_ACCESS_KEY) if a config.json is malformed or copy-pasted carelessly (security-reviewer team-review finding).
    mitigation: Out of this story's committed scope to add a full allowlist (single-user local tool, proportionate risk), but the "never log/serialize resolved values" requirement (acceptance criteria) is the concrete mitigation that ships — a resolved-but-wrong secret still can't leak through this module even if referenced by mistake.

