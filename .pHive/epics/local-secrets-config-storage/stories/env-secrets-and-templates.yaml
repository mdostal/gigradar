  key_files:
    - path: src/lib/config/load.ts
      purpose: "Built by the prior story (config-json-loader) — this story extends it, does not replace it."
    - path: src/lib/types.ts
      purpose: "SourceConfig.settings — already documented as never holding raw secrets, only references. This story is what makes that comment actually enforced."

design_decisions:
  - decision: env: resolution is top-level-only for v1, nested values explicitly unsupported
    rationale: Team review (architect) — SourceConfig.settings is typed Record<string, unknown> and can hold nested objects; recursively walking those is real added design surface (depth limits, array handling) that no current use case demands. Documented as a limitation, not silently broken.
  - decision: dotenv package over a hand-rolled parser
    rationale: User's explicit choice during the design-discussion review gate — handles quoting/multiline edge cases dotenv already solved.

cross_cutting:
  - concern: documentation
    action: "Add a README section (or extend docs/ARCHITECTURE.md) documenting: where config.json/.env live (XDG data dir), how to bootstrap from the example templates, and the env: reference convention for SourceConfig.settings — this is the first user-facing setup documentation for the local-storage layer."

