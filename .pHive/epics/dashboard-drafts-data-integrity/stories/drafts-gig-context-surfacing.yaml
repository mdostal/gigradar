    - path: src/app/drafts/drafts-filter.ts
      purpose: "DraftListItem interface — add rate/tier/sourceId fields here."
    - path: src/app/drafts/drafts-client.tsx
      purpose: "DraftCard component — render the new fields in the card header."
    - path: src/lib/types.ts
      purpose: "Gig.rate / Gig.tier shape (source of truth for the fields being threaded through) — line ~427 `rate?: { min?: number; max?: number; unit: \"hour\" | \"month\" | \"year\" }`."
    - path: src/lib/sources/origins.ts
      purpose: "KNOWN_SOURCES — check for an existing source display-label convention before inventing new copy for the source badge."

