id: tauri-sidecar-exit-cleanup
epic: runner-registry-and-sidecar-lifecycle
title: Kill the spawned Node sidecar on every graceful Tauri exit
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  lib.rs's own comment claims "Tauri kills child processes on app.exit()
  by default" -- checked against the vendored tauri/tauri-plugin-shell
  crate sources directly: CommandChild has no Drop impl that kills the OS
  process, and .run(tauri::generate_context!()) (no event callback) never
  intercepts any exit event. Confirmed live: killing the app's Tauri
  process left its spawned Node sidecar running, still holding port 3000.
  Fix: capture the CommandChild in managed state and kill it explicitly
  when RunEvent::Exit fires (covers window close, Cmd+Q, tray Quit, and
  the updater's own app.restart()).

acceptance_criteria:
  - "Given the app is running with a live sidecar, when the user quits via Cmd+Q, the tray's Quit item, or closing the window, then the sidecar process is confirmed dead (not just the Tauri process) -- verified with a real launch+quit+ps check, not just code review."
  - "Given the updater's install_update/grace-period-timeout path calls app.restart(), when that fires, then the OLD sidecar is killed as part of the same exit sequence (a fresh one spawns on the new process's own startup) -- no doubled sidecar, no orphan from the old process."
  - "cargo check && cargo test pass."

steps:
  - id: implement
    description: |
      In lib.rs: add `struct SidecarHandle(Mutex<Option<CommandChild>>)`, `app.manage(SidecarHandle::default())` in .setup(). Where `let (mut rx, _child) = sidecar.spawn()...` currently discards the child, store it instead: `*app.state::<SidecarHandle>().0.lock().unwrap() = Some(_child);`. Change `.run(tauri::generate_context!())` to `.build(tauri::generate_context!())?.run(|app, event| { if let tauri::RunEvent::Exit = event { if let Some(child) = app.state::<SidecarHandle>().0.lock().unwrap().take() { let _ = child.kill(); } } });` -- match tauri's actual RunEvent enum shape (verify exact variant/import path against the vendored tauri crate before writing, don't guess the API).
    agent: developer
  - id: test
    description: cargo test (existing suite + no regressions). Manually launch the built .app, confirm its sidecar's PID via ps, quit via each of the three paths (Cmd+Q, tray Quit, window close), and confirm via ps that the sidecar PID is gone within a couple seconds each time.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the exit handler can't itself deadlock (Mutex lock scope minimal, no lock held across any blocking call) and that switching from .run() to .build().run(|..|) doesn't change any other startup behavior (window creation, tray menu, sidecar spawn timing all still happen inside the existing .setup() closure, unchanged).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the epic's feature branch.
    agent: developer
    depends_on: [review]

files_to_modify:
  - file: src-tauri/src/lib.rs
    change: "Store the spawned CommandChild in managed state; switch .run() to .build().run(|app,event| ...) and kill the child on RunEvent::Exit."

risks:
  - severity: low
    description: "RunEvent::Exit cannot fire for an external SIGKILL/force-quit sent directly to the OS process -- this story only fixes graceful exits."
    mitigation: "Deliberately split into a separate story (sidecar-orphan-self-detection) rather than treated as a gap in THIS story -- the two are complementary, not redundant."
