design_decisions:
  - decision: Direct child_process.spawn(), never playwright.chromium.launch(), for the login/capture browser acquisition step.
    rationale: "The automation fingerprints (navigator.webdriver, --enable-automation) are added by Playwright's OWN launch() call, independent of which Chrome binary it launches -- confirmed live via Playwright's connectOverCDP() docs. Only bypassing launch() entirely removes them."
  - decision: macOS-only, standard Chrome install path, for this epic's first pass.
    rationale: "Matches this project's own established scope-narrowing precedent (scripts/prepare-tauri-sidecars.sh). A specific actionable error beats a silent fallback that reintroduces the fixed bug."

risks:
  - severity: high
    description: A leaked Chrome process or temp user-data-dir on an unexpected exit path (crash, unhandled exception between spawn and close).
    mitigation: "Same finally-block discipline withBrowserSession()/session-capture.ts already prove out for their own resources, applied to the new spawn/attach/close triad. Real end-to-end verification explicitly checks ps aux + filesystem after a real run, not just unit-level cleanup assertions."
  - severity: medium
    description: A real Chrome instance with an open --remote-debugging-port is a local attack surface (any local process could attach while it's open).
    mitigation: "127.0.0.1-only bind (never 0.0.0.0), a fresh port per session (never fixed/guessable), and the window only stays open for one capture's duration -- closed immediately on finish/cancel/idle-timeout."

