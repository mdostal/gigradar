  - id: research
    description: Confirm the exact current child_process spawn arguments needed for a real Chrome with --remote-debugging-port + --user-data-dir on macOS, and re-confirm chromium.connectOverCDP()'s exact API shape (browser.contexts()[0], context.pages()) against the installed Playwright version.
    agent: researcher
  - id: implement
    description: Write real-chrome.ts and rewire session-capture.ts + assist-session.ts to use it.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests for real-chrome.ts's spawn/attach/close lifecycle with a mocked child_process + mocked connectOverCDP. Real end-to-end verification against a real Google OAuth sign-in, live, with the owner watching -- the actual bar this epic exists to clear.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for the 127.0.0.1-only bind, fresh-port-per-session, no leaked process/temp-dir on any exit path, and that no automation-flag equivalent was accidentally reintroduced.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the epic branch.
    agent: developer
    depends_on: [review]

