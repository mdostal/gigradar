id: real-chrome-spawn-attach
epic: oauth-session-capture-v2
title: "Spawn-then-attach real Chrome (the actual OAuth fix) for session-capture.ts and assist-session.ts"
status: implemented-pending-live-verification
complexity: high
methodology: classic
depends_on: []

description: |
  Vertical Plan Slice 1 -- the actual fix for the real, live failure that
  prompted this epic (Google's "Couldn't sign you in -- this browser or
  app may not be secure" rejection, confirmed via a fresh screenshot
  during a real GoFractional Google sign-in attempt). Task #47's earlier
  fix (preferring channel:"chrome" in launchHeadedBrowser()) was
  necessary but not sufficient: `chromium.launch()` itself -- regardless
  of which Chrome binary it launches -- adds automation markers
  (navigator.webdriver=true, --enable-automation) Google's sign-in
  specifically detects, independent of the binary choice. Confirmed live
  via Playwright's own docs that chromium.connectOverCDP() against an
  INDEPENDENTLY-launched browser (started directly by the OS, never
  through Playwright's launch()) does not carry those fingerprints.

  1. `src/lib/auth/real-chrome.ts` -- new module:
     - `spawnRealChrome()`: resolves the real Chrome binary at the
       standard macOS install path
       (`/Applications/Google Chrome.app/Contents/MacOS/Google Chrome`
       -- macOS-only for this epic's first pass, matching
       scripts/prepare-tauri-sidecars.sh's own established "macOS only,
       first pass" scope precedent; a specific, actionable error if not
       found there, NEVER a silent fallback to Playwright's bundled
       Chromium). Picks a free local port, creates a FRESH isolated
       temp `--user-data-dir` (never the user's real personal Chrome
       profile), spawns via `child_process.spawn()` DIRECTLY -- not
       `playwright.chromium.launch()` -- with exactly
       `--remote-debugging-port=<port> --user-data-dir=<tmp>
       --no-first-run --no-default-browser-check`. Polls
       `http://127.0.0.1:<port>/json/version` until it responds before
       returning (mirrors src-tauri/src/lib.rs's own TCP-connect
       readiness-poll pattern from the tauri-installer epic).
     - `attachToRealChrome(cdpPort)`: thin wrapper around
       `playwright.chromium.connectOverCDP()`.
     - `closeRealChrome({process, userDataDir})`: terminates the
       spawned process AND removes the temp user-data-dir -- never
       leave a stray profile directory on disk.
  2. Rewire `session-capture.ts`'s `startCapture()`/`finishCapture()`/
     `cancelCapture()` to use spawnRealChrome()/attachToRealChrome()/
     closeRealChrome() instead of launchHeadedBrowser()+
     browser.newContext(). The globalThis-pinned in-flight map, idle
     timeout, origin-scoped filtering, and atomic encrypted write are
     ALL UNCHANGED -- only the browser-acquisition step changes.
  3. Rewire `assist-session.ts`'s `startAssistSession()`/
     `endAssistSession()` the same way, for the same reason
     (profile-assist's own login step is exactly as bot-detection-
     exposed as Capture Login's).
  4. `withBrowserSession()` (browser-session.ts) and
     `launchHeadedBrowser()` itself are explicitly UNCHANGED -- this
     story ADDS the spawn-then-attach path for login/capture-shaped
     flows specifically, it does not remove or alter the existing
     fetch-and-close mechanism real adapters use.

acceptance_criteria:
  - "Given Capture Login is clicked for a Google-OAuth-gated source, the opened Chrome window successfully completes a real Google sign-in (no 'Couldn't sign you in' rejection) -- live-verified against a real account, the exact failure this epic exists to fix."
  - "Given a real capture session, the spawned Chrome process is bound to 127.0.0.1 only (never 0.0.0.0) on a fresh, non-fixed port per session."
  - "Given a capture is finished, cancelled, or times out, both the spawned Chrome process AND its temp --user-data-dir are cleaned up -- verified via `ps aux` (no leftover process) and a filesystem check (no leftover temp dir) after a real end-to-end run."
  - "Given the real Chrome binary is not found at the expected macOS path, startCapture()/startAssistSession() throw a specific, actionable error naming the exact path checked -- never a silent fallback to Playwright's bundled Chromium (which would reintroduce the exact fingerprint problem this story fixes)."
  - "Given profile-assist's Manual/Guided/Full-auto modes, starting a session still works identically from the caller's perspective (same Page API surface via connectOverCDP()) -- no behavior change in any downstream code that consumes the Page beyond the browser-acquisition step."

