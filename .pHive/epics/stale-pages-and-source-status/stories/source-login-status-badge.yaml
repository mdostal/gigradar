    - path: src/lib/auth/session-capture.ts
      purpose: "finishCapture() at line 356 inlines the <sourceId>-session.json path convention -- extract into a shared helper here"
    - path: src/app/config/page.tsx
      purpose: "Server Component parent -- already computes portunusAvailable server-side (line 57) and threads it into ConfigClient as a prop (line 73); follow the same pattern for the new readiness map"
    - path: src/app/config/config-client.tsx
      purpose: "showsCaptureLogin(source) at lines 222-225 is the correct existing predicate for badge gating; Sources section starts at line 1882, per-source row top line at 1888-1967 is the insertion point; ConfigClient's prop signature is at line 1223"
    - path: src/lib/auth/capture-guidance.ts
      purpose: "checkCaptureReadiness() -- confirmed the WRONG tool to reuse (live-browser LLM check, mid-capture only); do not call this from the idle Sources list"

code_examples:
  - title: Existing server-side-computed-prop precedent to follow
    file: src/app/config/page.tsx
    snippet: |
      const portunusAvailable = await isPortunusAvailable();
      // ...
      return <ConfigClient initial={initial} portunusAvailable={portunusAvailable} />;

design_decisions:
  - decision: file-exists + parses + right-shape only, no cookie-expiry check
    rationale: |
      Ships the simple version now; a wrong "Connected" for an expired
      session self-heals the same way a failed scan already fails gracefully
      (clear error, not a crash) -- consistent with this session's
      custom-source-recipe.ts validation fix. Expiry-awareness is a real,
      explicitly-flagged fast-follow, not silently dropped. See
      design-discussion.md §7 open question 1.

references:
  - path: .pHive/epics/stale-pages-and-source-status/docs/design-discussion.md
    relevant_excerpt: |
      §4-5 cover the full research (why checkCaptureReadiness() is the wrong
      tool, the showsCaptureLogin()/portunusAvailable precedents) and the
      approach with reasoning.
