open_question: |
  The owner's own "dogfood the assisted fill out of the application"
  request is genuinely ambiguous between two different real targets this
  research surfaced, with different technical fit:
  1. The PUBLIC "Join as Talent" registration form (Salesforce-hosted,
     no login needed) -- but profile-assist's own existing mechanism
     (resolveAssistSessionContext()) REQUIRES an already-captured
     browser session to seed from; it has no path for a brand-new,
     anonymous, pre-account application form today.
  2. The AUTHENTICATED talent-portal profile (once the owner already has
     a real BTG account/login) -- fits profile-assist's existing
     mechanism exactly, the same way it already works for Catalant/
     Gun.io/Shiny.
  Not guessed at -- left for the owner's own next message to resolve,
  since it changes what gets built next.
