research: |
  Real, live research (not assumed): businesstalentgroup.com is a
  WordPress marketing site for Business Talent Group, an independent-
  consultant/interim-executive marketplace (a Heidrick & Struggles
  company). Its real "Talent Login" link points at
  talent.businesstalentgroup.com -- a distinct, client-rendered SPA
  (title "BTG Talent", no plain-HTML sign-in form), same shape as
  Catalant/Gun.io/Shiny already in this codebase: entirely login-gated,
  no public jobs/opportunities board to scrape anonymously.

  Also found: the marketing site's own "Apply Today" CTA (from "Become an
  Independent Consultant") points at a real, live, PUBLIC, no-login-
  needed application form hosted on a SEPARATE domain --
  businesstalentgroup.my.salesforce-sites.com/consultant/ts2__Register --
  a genuine multi-step Visualforce form (name/email/phone/address fields
  confirmed live). This is the real "Join as Talent" onboarding
  application, distinct from the authenticated talent portal itself.

