design_decisions:
  - decision: apiKey is a required parameter to generateDraft(), resolved by the caller, never internally
    rationale: Collaborative review corrected an overstated design claim -- extract.ts's REAL pattern is caller-resolves-and-passes-in, not internal resolution; this keeps draft.ts agnostic to whether it's called from CLI/MCP (process.env populated) or a future Server Action (readEnvVar()).
  - decision: markDraftSubmitted() wraps both status updates in one withTransaction() call
    rationale: Collaborative review -- two separate, non-atomic calls could desync on a crash between them, exactly the inconsistency grill finding H1 was raised to prevent.
  - decision: Minimal red-tier guardrail, not the full 4-check gate
    rationale: Grill U1 -- a common-sense guardrail (don't draft for a gig already flagged off-target) belongs in this epic; the full gate's other checks (economics/live-new/fillable) stay scoped to the later, separate auto-fire epic.

