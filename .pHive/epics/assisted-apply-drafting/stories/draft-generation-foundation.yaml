risks:
  - severity: medium
    description: LLM-drafted content could fabricate or distort real experience if the prompt grounding isn't strict enough.
    mitigation: Explicit prompt instruction against fabrication, dedicated test asserting only real provided data appears in the request; the review/approve UI (sibling story) is the final human backstop regardless.
  - severity: medium
    description: Untrusted gig content (scraped, third-party) could attempt prompt injection against the drafting LLM call.
    mitigation: Clear delimiting/labeling of gig content as data, never instructions, in the prompt -- dedicated test.

