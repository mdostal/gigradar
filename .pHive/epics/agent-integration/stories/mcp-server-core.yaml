risks:
  - severity: high
    description: get_status_summary accidentally using loadConfig() instead of readRawConfig() would leak a resolved secret to whatever MCP client is connected.
    mitigation: Dedicated acceptance criterion and regression test; security-reviewer step specifically checks this.
  - severity: medium
    description: The exact @modelcontextprotocol/sdk API could differ from what's assumed in this story, since it wasn't verifiable during planning.
    mitigation: The pin-sdk-api step runs first, before the other 4 tools are built against assumed shapes.

