design_decisions:
  - decision: DNS-resolution-based validation, not literal URL-string matching
    rationale: A hostname could resolve to a blocked range (e.g. via a custom DNS entry) even if its literal text doesn't look internal -- resolution-based checking is the only way to actually close this.
  - decision: Full DNS-rebinding (TOCTOU) protection explicitly out of scope
    rationale: Grill U1 -- exploiting the gap requires attacker-controlled DNS infrastructure and precise timing, a materially harder attack than today's zero-validation state; closing the easy case is what "blocking for launch" means here.

