design_decisions:
  - decision: globalThis-pinned Map, not a plain module-level variable
    rationale: Team review (architect) — Next.js dev's HMR re-evaluates a module on any edit to it or its import chain, silently resetting a plain module-level Map and orphaning in-flight captures. This is the standard, documented workaround for exactly this class of bug in Next.js dev (the same pattern used for DB client singletons).
  - decision: Sanity-check for zero cookies before writing, never write-then-hope
    rationale: Team review (architect) — filterStorageStateToAllowlist() was only ever proven against already-known-good manually-captured files; a fresh OAuth/SSO login could store a needed token on an origin outside the allowlist, and silently writing a broken-but-non-empty file as "success" would be worse than an explicit, actionable failure.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md to describe the capture mechanism, its globalThis-pinning requirement, and the atomic-write/permissions/no-debug-capture guarantees."

