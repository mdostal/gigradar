risks:
  - severity: high
    description: If the globalThis-pinning is implemented incorrectly (or omitted), every capture attempted during active development (where file edits are constantly triggering HMR) would silently fail in a confusing way — the single most likely real-world failure mode for this story.
    mitigation: A dedicated acceptance criterion and test specifically simulates module re-evaluation, not just a happy-path capture — this is the review's highest-priority check.
  - severity: medium
    description: An abandoned capture leaks an OS-level Chromium process for up to 10 minutes; a user starting many captures in quick succession (e.g. testing) could accumulate several simultaneously.
    mitigation: Accepted as a v1 limitation — the idle timeout bounds the leak's duration, and a full process-tracking/sweep system is real additional scope not required for this epic's done-bar.

