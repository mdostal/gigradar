id: session-capture-mechanism
epic: session-capture-ui
title: Stateful browser-session capture mechanism (start/finish/cancel)
status: pending
complexity: high
methodology: classic
depends_on: [origin-registry-extraction]

description: |
  The epic's single highest-novelty piece — a genuinely new pattern for
  this codebase: holding a live Playwright Browser/BrowserContext handle
  in server memory across separate Next.js Server Action invocations,
  bridging an indeterminate human-paced login interval. This story is
  fully isolated from the UI (next story) and gets undivided review
  attention given its risk.

  Build src/lib/auth/session-capture.ts:
  - **`globalThis`-pinned state map, not a plain module-level variable**:
    `const captures = (globalThis as any).__gigradarCaptures ??= new
    Map<string, CaptureEntry>()`. This is non-negotiable — a plain
    module-level Map is silently reset by Next.js dev's Hot Module
    Reloading on any edit to this file or its import chain (a far more
    common event during development than a full server restart), which
    would orphan any in-flight capture without any error surfacing.
  - `startCapture(sourceId: string, loginUrl: string): Promise<{captureId: string}>`:
    checks `checkChromiumAvailable()` (reused from browser-session.ts),
    launches a FRESH headed Chromium context (`headless: false`, no
    storageState — this creates a session, doesn't consume one),
    navigates to `loginUrl`, registers a `browser.on("disconnected", ...)`
    listener that immediately marks/removes the capture entry if the user
    closes the actual browser window directly, schedules a 10-minute idle
    `setTimeout` that closes the browser and removes the entry if neither
    `finishCapture()` nor `cancelCapture()` arrive first, stores the
    handle+metadata keyed by `crypto.randomUUID()`, returns the id.
  - `finishCapture(captureId: string): Promise<{path: string}>`: looks up
    the entry (throws a specific error if not found — e.g. already
    timed out, disconnected, or invalid id), calls
    `context.storageState()` (no path arg, get the object back), applies
    `filterStorageStateToAllowlist()` (reused from browser-session.ts)
    using `SOURCE_ORIGINS[sourceId]` (from the prior story's registry).
    **Sanity check**: if the filtered result has zero cookies for the
    source's own origin, throw a specific "capture produced no usable
    session — login may not have completed" error and do NOT write
    anything. Otherwise, write the filtered result ATOMICALLY (temp file
    in the same directory + rename, never a direct write) to
    `<getDefaultDataDir()>/<sourceId>-session.json`, mode `0600`,
    overwriting any prior capture for that source. Close the browser,
    clear the timeout, remove the disconnect listener, remove the map
    entry, return the written path.
  - `cancelCapture(captureId: string): Promise<void>`: looks up the
    entry, closes the browser, clears the timeout, removes the listener
    and map entry — writes nothing.
  - **No debug capture, ever**: the launched context has tracing, HAR
    recording, video, and console/network event logging all explicitly
    OFF — a hard constraint on this code path, not a default to
    reconsider later, since any future debug aid here could persist
    credential-bearing form data to disk.

acceptance_criteria:
  - "Given the Map is stored via the globalThis-pinning pattern, when a test simulates a module re-evaluation (re-importing the module fresh, as HMR would), then a capture started before the re-evaluation is still findable/completable after it — not lost."
  - "Given startCapture() succeeds, when 10 minutes pass with neither finishCapture() nor cancelCapture() called, then the browser is closed and the map entry is removed — proven by asserting the mock browser's close() was called and a subsequent finishCapture() call for that id throws 'not found', not just that a timer was scheduled."
  - "Given the mocked browser emits a 'disconnected' event, when this happens, then the capture entry is cleaned up promptly, not left until the 10-minute timeout."
  - "Given finishCapture() is called and filterStorageStateToAllowlist() returns zero cookies for the source's own origin, when this happens, then it throws a specific error and NO file is written to the destination path."
  - "Given finishCapture() encounters any error partway through (e.g. the mocked storageState() call throws), when this happens, then no partial or empty file exists at the destination path afterward — verified by checking the temp-file+rename pattern leaves no stray temp file either."
  - "Given finishCapture() succeeds, when the written file's mode is checked, then it is 0600."
  - "Given the launched browser context, when inspected, then no tracing/HAR/video/console-logging options are enabled anywhere in the launch/context-creation call."

