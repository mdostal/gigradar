    agent: researcher
  - id: implement
    description: Implement src/lib/auth/session-capture.ts per the description above, including the globalThis-pinning, disconnect listener, idle timeout, sanity check, and atomic write.
    agent: developer
    depends_on: [research]
  - id: test
    description: Write unit tests covering every acceptance criterion, mocking Playwright's chromium.launch/newContext/storageState. Use fake timers (vi.useFakeTimers or equivalent) to test the 10-minute idle timeout without a real 10-minute wait.
    agent: tester
    depends_on: [implement]
  - id: review
    description: This is the epic's highest-stakes review. Confirm the globalThis-pinning pattern is correctly implemented (not just present but actually surviving a simulated re-evaluation in the test), confirm the atomic-write pattern genuinely prevents partial files, and confirm no debug-capture options are enabled anywhere.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/session-capture-ui.
    agent: developer
    depends_on: [review]

