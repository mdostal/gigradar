design_decisions:
  - decision: No polling — purely user-driven "I'm done" click
    rationale: Design discussion §3 step 3 — there's no reliable generic way to detect "login complete" across different sites' auth flows (some redirect, some don't; MFA timing varies); an explicit user action is simpler and more honest than a polling heuristic that could be wrong.
  - decision: Verify against a low-stakes test login first, real GoFractional account only as final confirmation
    rationale: Team review (tpm) — making the owner's real, currently-working account the primary proof of brand-new stateful code risks breaking a session this project actually depends on.

cross_cutting:
  - concern: documentation
    action: "Update docs/ARCHITECTURE.md's roadmap to mark guided session capture as shipped, replacing the manual playwright-cli bootstrap note with a pointer to the new UI flow (keeping the manual path documented as a fallback, not deleting it)."

