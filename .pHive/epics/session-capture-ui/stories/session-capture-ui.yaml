risks:
  - severity: medium
    description: Auto-writing to config.json on capture success could interact unexpectedly with a user who has an in-progress, unsaved edit elsewhere in the same config form.
    mitigation: Full-document replace-on-save (config-write-path's established mechanism) always re-reads the current raw file at write time, so this auto-write is no different in kind from any other save — accepted as consistent with existing behavior, not a new risk class.

