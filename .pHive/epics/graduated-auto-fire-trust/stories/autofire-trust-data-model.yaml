code_examples:
  - title: Existing ensureColumn() migration pattern for a schema addition on pre-existing DBs
    file: src/lib/store/db.ts
    snippet: |
      function ensureColumn(db, table, column, type) {
        const cols = db.prepare(`PRAGMA table_info(${table})`).all();
        if (!cols.some((c) => c.name === column)) {
          db.exec(`ALTER TABLE ${table} ADD COLUMN ${column} ${type}`);
        }
      }

design_decisions:
  - decision: Trust graduation is a pure computation over application_drafts/gigs, never a separate stored counter.
    rationale: Self-healing and audit-proof — always derived from real approval history, can never drift from the data it represents. See design-discussion.md §3.1.

risks:
  - severity: medium
    description: SQLite CHECK constraints cannot be altered in place — adding 'submitting' to the status enum on an existing DB needs a rebuild-via-temp-table migration, which is more invasive than the existing additive-column ensureColumn() pattern.
    mitigation: Research step confirms the safest path before implementing; if no existing precedent exists in this codebase, document the chosen approach clearly in the migration code's own comment.

references:
