code_examples:
  - title: Existing source registry pattern this story's SubmitAdapter registry mirrors
    file: src/lib/sources/source.ts
    snippet: |
      const registry = new Map<string, Source>();
      export function registerSource(source: Source): void {
        if (registry.has(source.id)) throw new Error(`duplicate source id: ${source.id}`);
        registry.set(source.id, source);
      }
      export function getSource(id: string): Source | undefined {
        return registry.get(id);
      }

design_decisions:
  - decision: Ship the decision engine and registry with zero real adapters, and treat "no adapter registered" as a correct terminal state, not a TODO.
    rationale: Vertical-plan sequencing — proves the risky, generic decision logic works and is fully tested before any live-site automation exists, isolating that risk to a later, smaller story.

risks:
  - severity: low
    description: A future SubmitAdapter author could bypass evaluateAutoFire() and call submit() directly, skipping the trust gate entirely.
    mitigation: Document on SubmitAdapter's own interface comment that submit() must only ever be invoked via the orchestration layer (a later story) after a passing evaluateAutoFire() decision — same "never called directly" discipline this codebase already documents for other internal-only functions.

