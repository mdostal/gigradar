id: embedded-capture-login-flow
epic: true-embedded-browser
title: "Capture Login runs through the embedded webview instead of a separate OS-level real-Chrome window"
status: in_progress
progress_note: |
  BUILT 2026-09-06. Real, working code, cargo/tsc-clean and unit-tested,
  live GUI+login verification still pending (see below).

  Architecture note NOT anticipated by this story's original scope: Story
  1/2's Tauri commands (`embedded_webview_show/hide/navigate/close`,
  `embedded_webview_read_session`) are only invokable CLIENT-side
  (`invoke()` requires the Tauri webview's own JS context) -- there is no
  server-held browser/context for this path at all, unlike
  session-capture.ts's real-chrome flow where Playwright itself runs
  server-side. This means the raw session (including real HttpOnly
  cookie values) is read back in the BROWSER and must cross a Server
  Action boundary once to reach the existing encrypted-persistence/
  Portunus code (which is server-only: fs, vault.ts, Portunus MCP). This
  is a real, new data-flow this epic's design-discussion.md didn't
  explicitly call out -- documented here rather than silently accepted.
  It's the same-origin, same-machine, 127.0.0.1-only Server Action
  mechanism every other mutation in this app already uses (never
  persisted en route, never logged), so treated as an accepted, no-op
  extension of the existing trust boundary rather than a new risk class.

  Real bug caught while building this: `EmbeddedStorageState`'s
  `sameSite` field (embedded-webview.ts) is typed as a bare `string`
  (WKHTTPCookieStore's native sameSitePolicy has no TS literal-union
  equivalent at the Rust/IPC boundary), NOT byte-compatible with
  `StorageStateCookie.sameSite: "Strict"|"Lax"|"None"` as
  embedded-webview-cookie-extraction-macos's own acceptance criteria
  claimed ("no adapter/conversion layer needed downstream"). That claim
  was wrong -- corrected via a real, tested `normalizeEmbeddedStorageState()`
  adapter (`src/lib/auth/embedded-capture.ts`) that throws a specific,
  actionable error naming the exact offending cookie/value rather than
  guessing a default.

  Implementation: `persistCapturedSession()` extracted out of
  session-capture.ts's `finishCapture()` (zero behavior change, existing
  tests still pass unmodified) so the embedded path reuses the EXACT same
  allowlist-filtering/zero-cookie-sanity-check/backend-dispatch/encrypted-
  persistence logic, never a second copy. New
  `resolveEmbeddedCaptureLoginUrlAction()`/`finishEmbeddedCaptureAction()`
  Server Actions (config/actions.ts) mirror `startCaptureAction()`/
  `finishCaptureAction()`'s exact config-writing tail. New
  `EmbeddedCaptureControl` component (config-client.tsx) -- NOT a
  modification of the existing `CaptureLoginControl` (kept byte-identical
  for electron/browser mode, per this story's own design decision) --
  renders the embedded pane inline, coordinated via one shared
  `activeEmbeddedCaptureKey` so only ONE row can own the single, app-wide
  embedded webview at a time (a real constraint from Story 1's own
  design). Wired into BOTH call sites (per-source rows + the shared
  Google connection row), gated on `isTauri()`.

  STILL GENUINELY UNVERIFIED, same reason as Stories 1/2's own live-
  verification gaps: whether this actually renders/works end-to-end
  against a real login (GoFractional or Google SSO) in the packaged app.
  Deliberately not attempted via automated screenshotting this session --
  see [[feedback_never_screenshot_the_real_desktop]] memory: an attempt
  to visually verify Story 1/2 via `screencapture` twice captured
  unrelated windows on the owner's real, busy desktop instead of just the
  test window. This needs the owner's own screen time (running the
  packaged/dev app themselves and doing a real login), not something safe
  for me to attempt unattended.
complexity: medium
methodology: classic
depends_on: [embedded-webview-cookie-extraction-macos]

description: |
  Replaces session-capture.ts's real-chrome-spawned OS window (for every
  source with `auth: "browser-session"`, plus the new Google-SSO capture
  flow from google-sso-session-persistence) with the embedded webview from
  Stories 1-2, for the packaged Tauri app specifically (electron/browser
  runtime modes keep today's real-chrome-window behavior unchanged -- see
  design-discussion.md's own mode-guard requirement in Story 1).

  1. New capture entry point mirroring startCapture()/finishCapture()/
     cancelCapture()'s exact lifecycle shape (session-capture.ts), but
     backed by the embedded webview: `embedded_webview_show(loginUrl, ...)`
     to open it (INSIDE the app, no OS window), then on the human's
     explicit "I'm done" click, `embedded_webview_read_session()` (Story
     2) -> `filterStorageStateToAllowlist()` (unchanged) -> the SAME
     local-vault/Portunus persistence finishCapture() already uses.
  2. UI: config-client.tsx's CaptureLoginControl component (reused, not
     reinvented -- same component google-sso-session-persistence's own
     "Google connection" section already reuses) now renders the embedded
     pane inline where the OS-window flow used to just show a "browser
     window opened" waiting message.
  3. NO POLLING, NO RETRY against the embedded webview while a human might
     be using it -- mirrors session-capture.ts's own existing, correct
     discipline (see project memory
     feedback_fire_and_forget_scripts_against_live_chrome.md for exactly
     the failure mode this must never repeat). The embedded view "just
     sits there" until the explicit done/cancel signal.
  4. Runtime-mode fallback: in electron/browser mode (no Tauri context),
     this new entry point is simply UNAVAILABLE -- the existing
     startCaptureAction()/real-chrome-window flow remains the only path
     there, unchanged. Never a broken half-implementation in modes that
     can't support it.

acceptance_criteria:
  - "In the packaged Tauri app, clicking 'Capture login' for a browser-session source opens the login page INSIDE the embedded pane -- no separate OS-level Chrome window ever appears."
  - "A real, live-verified capture (a real login, e.g. GoFractional or the Google-SSO flow) completes: the resulting session persists via the EXISTING local-vault/Portunus backend, identically to today's real-chrome-window flow's own output."
  - "While the embedded pane is open and a human may be interacting with it, this module makes ZERO automated calls into it (no polling, no re-navigation, no retry) until the human's own explicit done/cancel action."
  - "In electron/browser runtime mode, the UI falls back to today's existing real-chrome-window Capture Login flow, unchanged -- never a broken or half-available embedded option."

