id: embedded-guided-apply-assist
epic: true-embedded-browser
title: "Guided profile-assist/apply sessions use the embedded webview instead of a positioned OS-level window"
status: pending

progress_note: |
  REAL, DISQUALIFYING FINDING (2026-09-03) -- this story's own scope as
  originally written is NOT achievable. `clickSessionAtAction()`/
  `typeIntoSessionAction()` (src/app/profile-assist/actions.ts) --
  the mechanism "guided"/"full-auto" mode's own LLM-driven clicking uses
  -- work by taking a RATIO-scaled coordinate against a Playwright
  SCREENSHOT and returning a fresh screenshot back. That is Playwright/CDP
  automation, full stop. This epic's own design-discussion.md §2 already
  established, as a hard finding, that CDP does not exist for Tauri's
  embedded webview on macOS (WKWebView has no CDP support at all --
  only Windows' WebView2 does). This means clickSessionAtAction()/
  typeIntoSessionAction() CANNOT be retargeted at the embedded webview,
  under any circumstances, on this platform -- not a workaround-able gap,
  a hard architectural wall this epic's own earlier research already
  identified but this story's own original scope failed to apply to
  itself.

  CORRECTED SCOPE: only "manual" mode (pure human mouse/keyboard, no LLM
  clicking involved at all) could genuinely move to the embedded webview.
  "guided" and "full-auto" modes MUST keep using a real,
  Playwright-controlled OS window (today's positionChromeWindowSideBySide()
  approach), unchanged, because the LLM's own ability to click/type
  through them fundamentally requires CDP.

  This INVERTS this story's own original open question (which asked
  "should manual mode ALSO move to embedded, given guided/full-auto
  already would") -- the real answer is the reverse: manual is the ONLY
  candidate, and guided/full-auto structurally cannot follow. Given this
  also means the epic's own "no separate OS window, ever" framing does
  NOT fully hold for guided/full-auto assist sessions specifically (a
  real, permanent exception, not a temporary gap), this needs the
  owner's own explicit direction before any implementation -- deliberately
  NOT built this session. See the overnight-status artifact from this
  session for the live version of this decision.
complexity: medium
methodology: classic
depends_on: [embedded-webview-child-mechanism]

description: |
  Replaces assist-session.ts's `positionChromeWindowSideBySide()` real
  OS-window flow (guided/full-auto profile-assist) with the embedded
  webview from Story 1. Unlike Story 3 (Capture Login), this does NOT
  depend on Story 2's cookie extraction -- profile-assist already reads a
  storageState from disk/Portunus BEFORE opening the browser (see
  assist-session.ts's existing `readSessionViaPortunus()`/
  `readStorageStateFile()` calls); this story only needs to SHOW that
  already-authenticated session inside the embedded pane, not extract a
  NEW session back out of it afterward.

  1. `startAssistSession()` (assist-session.ts): for the packaged Tauri
     app, seed the embedded webview with the already-loaded
     `scopedStorageState` (via Tauri's own cookie-SETTING path, if one
     exists at this Tauri version -- research as part of this story,
     since design-discussion.md §2's research only confirmed reading is
     unsolved, not setting; a setter may already exist even though a
     getter (Story 2) doesn't) and navigate to `profileUrl`, instead of
     spawning real-chrome + positioning it.
  2. The embedded live-view pane (`embedded-view-interactive` story,
     already shipped) and the guided/full-auto assist flow (clickSessionAtAction/
     typeIntoSessionAction) now operate against the SAME embedded webview
     directly, rather than screenshotting/relaying a separate OS window's
     content -- a real simplification, not just a relocation, once this
     lands (verify whether the screenshot-relay mechanism can be retired
     entirely or still serves a distinct purpose -- don't assume, check).
  3. "manual" mode: per assist-session.ts's own existing comment ("a real
     browser window is open on your desktop, use it directly"), this
     mode's whole point is a real, directly-usable window -- CONFIRM with
     the owner whether manual mode should ALSO move to the embedded pane
     (consistent with "no separate OS window, ever") or deliberately stay
     as a real OS window (since manual mode users may want a normal,
     full-featured Chrome window, not a constrained embedded view) --
     flagged as a real open question for the owner in this epic's own
     status artifact, not assumed either way.

acceptance_criteria:
  - "In the packaged Tauri app, starting a guided or full-auto profile-assist session shows the already-authenticated profile page INSIDE the embedded pane -- no separate OS-level positioned window ever appears for these two modes."
  - "The existing clickSessionAtAction/typeIntoSessionAction guided-interaction mechanism (or its embedded-webview equivalent) still works end-to-end against the embedded surface -- live-verified, not just unit-tested."
  - "Manual mode's real behavior (embedded vs. real OS window) is resolved via the owner's own explicit answer to this story's own open question, not silently assumed."
  - "electron/browser runtime mode keeps today's existing positioned-OS-window flow unchanged."

