id: embedded-guided-apply-assist
epic: true-embedded-browser
title: "Manual-mode profile-assist sessions use the embedded webview instead of a positioned OS-level window"
status: in_progress

progress_note: |
  UPDATE 2026-09-06, part 3: guided/full-auto are now wired to the true
  embedded pane too, not just manual mode. Key discovery that unlocked
  this cheaply: gigradar's own `profile-assist-loop.ts` guided/full-auto
  mechanism was ALREADY ARIA-ref-based
  (`page.locator("body").ariaSnapshot({mode:"ai"})` +
  `page.locator("aria-ref=eN")`), not screenshot-coordinate-based as
  this epic's own docs had assumed -- so it needed no vision model and
  no OS-level cursor input to reach the embedded pane, just a DOM-based
  ref mechanism reusing embedded-automation-bridge's already-proven
  `embedded_webview_eval()`.

  Refactored `profile-assist-loop.ts` around a new `AssistPageDriver`
  interface (`{snapshot, click, fill}`) so the same LLM-call/history/
  tool-parsing logic drives both the real-chrome path
  (`playwrightAssistPageDriver(page)`, byte-identical behavior, proven
  by the full pre-existing test suite passing unchanged) and the
  embedded-pane path (`driver: null`). Since a Server Action can't call
  client-side Tauri IPC directly, the embedded path uses a split
  decide/provide protocol: `advanceLoopTurn()`/`resolveApproval()`
  return `need_snapshot`/`need_execution` events instead of fulfilling
  them inline; new `provideSnapshot()`/`provideActionOutcome()` complete
  the turn once the CLIENT has done the real DOM work via three new
  `embedded-webview.ts` functions (`snapshotEmbeddedWebview()` --
  ARIA-ish ref-tagged text snapshot via a hand-rolled DOM walk, not
  Playwright's real ariaSnapshot; `clickEmbeddedElementByRef()`;
  `fillEmbeddedElementByRef()`, React-controlled-input-safe via the
  native value-setter-descriptor trick embedded-automation-bridge
  already established). Five new Server Actions
  (`decideEmbeddedLoopTurnAction`, `provideEmbeddedSnapshotAction`,
  `provideEmbeddedActionOutcomeAction`, `resolveEmbeddedApprovalAction`,
  `endEmbeddedLoopSessionAction`) and a client-side
  `runUntilBlockedEmbedded()` drive the loop; `handleStart()` now
  branches on `isTauri() && mode !== "manual"` to open the true embedded
  pane for guided/full-auto too (reusing the same `resolveEmbeddedAssistSessionAction()`
  manual mode already established, and the same cookie-seeding flow);
  the guided/full-auto render branch shows the true embedded pane (no
  screenshot relay, no native-window toggle) when `session.isEmbedded`.

  A real bug caught by new tests before shipping: `resolveApproval()`'s
  embedded branch initially dropped the `reason` field when building
  `pendingClientFulfillment`, so `provideActionOutcome()` would return
  an empty reason string. Fixed; covered by
  `resolveApproval(driver: null): embedded-pane approved execution
  defers to the client`.

  `npm test` (1596 passed, 3 skipped, including ~90 new lines across 4
  new describe blocks in profile-assist-loop.test.ts) and `npm run
  typecheck` both clean.

  STILL NOT DONE, unchanged from before (real, remaining scope):
  (1) the settings toggle for choosing DOM/eval-bridge vs. vision/
  OS-input as the automation backend -- now buildable in principle
  (guided/full-auto ARE wired to a real embedded backend), but
  `embedded-vision-automation-mode` itself is still not started, so a
  toggle today would have exactly one real option. Deferred until that
  story lands or the owner asks for the toggle regardless.
  (2) "Refresh suggestions" has no embedded-pane equivalent yet -- same
  gap as before, separate scope.
  (3) live, real-account end-to-end testing of the embedded guided/
  full-auto flow (a real source, a real saved session, watching the
  LLM actually click/fill through the embedded pane) needs the owner's
  own screen time -- same category of gap as every other Story in this
  epic's live-verification notes.
  (4) whether the screenshot-relay mechanism (`embedded-view-interactive`
  story) can be retired now that guided/full-auto have a true embedded
  path -- NOT verified, still serves the real-chrome (non-Tauri-embedded)
  path unchanged, so nothing to retire yet; worth revisiting once the
  vision backend exists and if real-chrome mode itself is ever
  deprecated.

  UPDATE 2026-09-06, continued: manual mode itself is BUILT and
  live-verified. New `EmbeddedManualAssist` component
  (profile-assist-client.tsx) -- self-contained, gated on `isTauri()`,
  never touches the existing real-chrome manual-mode UI (electron/
  browser mode unchanged). New `resolveEmbeddedAssistSessionAction()`
  (profile-assist/actions.ts) resolves the real profileUrl + origin-
  scoped storageState via assist-session.ts's newly-extracted
  `resolveAssistSessionContext()` (zero behavior change to the existing
  real-chrome path, which now calls the same function) WITHOUT ever
  spawning a browser.

  REAL, LIVE-VERIFIED CORRECTION to this story's own original plan:
  Tauri's `Webview::set_cookie()` (a real, documented, cross-platform
  API this story's own risk section hoped might exist) compiles clean
  and returns `Ok(())` with no error, but a live test against a real
  embedded pane + a real self-controlled test server proved it does NOT
  actually work on this app's macOS/WKWebView setup -- the cookie never
  reaches the webview's subsequent requests. The story's own accepted
  fallback (`document.cookie` injection via embedded-automation-bridge's
  already-proven `embedded_webview_eval()`) DOES work, live-verified
  end to end (a real HttpOnly-free cookie round-tripped to the test
  server, confirmed by the server echoing it back). Session-seeding is
  built on that mechanism now; the native `set_cookie()` attempt was
  fully reverted (no dead code, no unused Cargo dependency left behind).

  REAL, ACCEPTED LIMITATION (inherited, not new -- session-capture.ts
  documents the same one elsewhere): `document.cookie` cannot set
  HttpOnly cookies at all, a browser security restriction. A source
  whose real session cookie is HttpOnly-only will still show its real
  login page in the embedded pane even with a "captured" session on
  disk -- `setEmbeddedWebviewCookies()` warns (via `console.warn`,
  visible in the embedded webview's own dev tools) rather than failing
  silently.

  `npm test` (1586 passed, 12 for embedded-webview.ts + 3 new for
  assist-session.ts's extracted `resolveAssistSessionContext()`),
  `npm run typecheck`, `cargo check`/`cargo clippy` all clean.

  STILL NOT DONE (real, remaining scope, not silently dropped):
  (1) the settings TOGGLE for guided/full-auto's automation backend --
  deferred until at least one more backend is actually wireable (right
  now guided/full-auto still only have the original real-chrome path;
  a toggle with one real option isn't yet meaningful) -- will land
  alongside whichever of embedded-automation-bridge/
  embedded-vision-automation-mode gets wired into
  clickSessionAtAction()/typeIntoSessionAction() first.
  (2) "Refresh suggestions" (profile-assist's field-suggestion feature)
  has NO embedded-pane equivalent yet -- it reads the current page via a
  live Playwright `Page`, which the embedded pane doesn't have; omitted
  from `EmbeddedManualAssist` entirely rather than silently broken.
  Real, separate future scope (would need its own `embedded_webview_eval()`-based
  DOM-reading mechanism, mirroring embedded-automation-bridge's own find
  logic).
  (3) a live, real-account end-to-end test (a real source, a real saved
  session, confirming the profile page shows already-authenticated)
  needs the owner's own screen time -- same category of gap as Stories
  1-3's own live-verification notes, not something safe to automate
  with real credentials.

ORIGINAL 2026-09-06 progress_note (superseded above, kept for history):
  RESCOPED 2026-09-06 -- this story's original "REAL, DISQUALIFYING
  FINDING" (2026-09-03) that guided/full-auto could never follow manual
  mode into the embedded pane is RETRACTED. See design-discussion.md §6
  for the full research redo (owner's own pushback, 4 parallel research
  threads: CEF-in-Tauri, Electron's CDP story, WKWebView's native
  automation options, the vision-agent landscape). Short version: this
  story's own original scope was right that guided/full-auto's
  screenshot-coordinate mechanism needs an automation backend that
  doesn't exist yet for the embedded pane -- but wrong to conclude none
  could ever exist. Two real, buildable, non-Chromium paths exist (a
  DOM/eval-bridge mode and a vision/OS-synthetic-input mode -- see
  embedded-automation-bridge and embedded-vision-automation-mode, split
  out as their OWN stories since they're real, independent pieces of
  work, not a detail of this one).

  This story itself is NARROWED back to its original core: manual mode
  (pure human interaction, no LLM clicking at all) moving into the
  embedded pane -- which needs nothing from the two automation stories
  above, only Story 1's mechanism (show/hide/navigate) plus seeding the
  pane with the already-loaded storageState, exactly as originally
  scoped below. It also wires in the settings TOGGLE (owner's own
  explicit ask: "we have BOTH and TOGGLES in settings") that
  embedded-automation-bridge/embedded-vision-automation-mode's backends
  plug into, once guided/full-auto are ready to use it -- this story
  does not itself have to wait for those two to land first.

  UNBLOCKED: owner's own explicit decision, 2026-09-06 -- "yes everything
  moves embedded." No longer pending owner direction.

complexity: medium
methodology: classic
depends_on: [embedded-webview-child-mechanism]

description: |
  Replaces assist-session.ts's `positionChromeWindowSideBySide()` real
  OS-window flow for MANUAL-mode profile-assist sessions with the
  embedded webview from Story 1. Unlike Story 3 (Capture Login), this
  does NOT depend on Story 2's cookie extraction -- profile-assist
  already reads a storageState from disk/Portunus BEFORE opening the
  browser (see assist-session.ts's existing `readSessionViaPortunus()`/
  `readStorageStateFile()` calls); this story only needs to SHOW that
  already-authenticated session inside the embedded pane, not extract a
  NEW session back out of it afterward.

  1. `startAssistSession()` (assist-session.ts): for the packaged Tauri
     app AND manual mode specifically, seed the embedded webview with the
     already-loaded `scopedStorageState` and navigate to `profileUrl`,
     instead of spawning real-chrome + positioning it. Cookie-SETTING
     into a Tauri embedded webview is genuinely unresearched by this
     story's own prior version -- research it as a real first step here
     (Story 1/2's own research only covered READING cookies out, not
     setting them in). If no clean setter API exists at this Tauri
     version, evaluate `embedded_webview_eval()` (built by
     embedded-automation-bridge, or build a minimal version of it here if
     that story hasn't landed yet) injecting `document.cookie` writes for
     the non-HttpOnly subset, same limitation this app's session-capture
     already documents elsewhere for cookie injection via JS.
  2. Guided/full-auto mode: once `embedded-automation-bridge` and/or
     `embedded-vision-automation-mode` land, wire profile-assist's
     existing `clickSessionAtAction()`/`typeIntoSessionAction()` call
     sites to route through whichever backend the owner's settings
     toggle (built by this story) currently selects, instead of always
     targeting a spawned real Chrome window. This story adds the TOGGLE
     UI/setting itself (a real, owner-visible control, not a hidden env
     var) even if only one backend exists yet -- the other slots in
     without a second settings-UI change later.
  3. The embedded live-view pane (`embedded-view-interactive` story,
     already shipped) and the guided/full-auto assist flow now operate
     against the SAME embedded webview directly, rather than
     screenshotting/relaying a separate OS window's content, once wired
     -- verify whether the screenshot-relay mechanism can be retired
     entirely or still serves a distinct purpose (e.g. a lower-fidelity
     preview) -- don't assume, check.

acceptance_criteria:
  - "In the packaged Tauri app, starting a MANUAL profile-assist session shows the already-authenticated profile page INSIDE the embedded pane -- no separate OS-level positioned window ever appears for this mode."
  - "A real, owner-visible settings control exists to choose the guided/full-auto automation backend (DOM/eval-bridge vs. vision/OS-synthetic-input) for when embedded-automation-bridge/embedded-vision-automation-mode land -- built here even if only one backend is available yet."
  - "electron/browser runtime mode keeps today's existing positioned-OS-window flow unchanged, for every profile-assist mode."

