design_decisions:
  - decision: This story does not depend on Story 2 (cookie extraction) -- only on Story 1 (the child-webview mechanism itself).
    rationale: "Profile-assist already has a valid storageState BEFORE opening the browser (loaded from disk/Portunus) -- it only needs to SHOW that session, never extract a new one afterward. Sequencing it independent of Story 2 lets it ship without waiting on that story's real, unresolved risk."
  - decision: Guided/full-auto's actual automation-backend wiring is split into its own stories (embedded-automation-bridge, embedded-vision-automation-mode), not built inline here.
    rationale: "Each backend is a real, independent, non-trivial piece of engineering (a new JS-bridge/eval() mechanism; a new OS-level CGEvent/screenshot mechanism) -- bundling either into this story would blow its scope past 'manual mode moves to embedded,' the part that's genuinely ready to build today with zero new research."

risks:
  - severity: medium
    description: "Whether Tauri (at this repo's pinned version) exposes any cookie-SETTING API for a webview is genuinely unconfirmed -- Story 1/2's research only checked cookie READING."
    mitigation: "This story's own step 1 explicitly scopes real research into cookie-setting as its own first step, not an assumption carried over from Story 2's (different) finding. A JS-injection fallback (non-HttpOnly cookies only) is an accepted, documented limitation if no native setter exists."

