id: embedded-vision-automation-mode
epic: true-embedded-browser
title: "Vision/OS-input automation backend -- a foreground-only, human-supervised fallback when the DOM bridge can't find what it needs"
status: in_progress
complexity: high
methodology: classic

progress_note: |
  UPDATE 2026-09-06, part 2: acceptance criterion 4 (wiring Vision mode
  into the actual guided/full-auto LLM tool-use loop) is now BUILT too --
  the real gap the previous update below left open. `profile-assist-loop.ts`
  gained a genuinely separate, coordinate-based tool schema
  (`LOOP_TOOLS_VISION`: `read_visual()`/`click_at(x,y,reason)`/
  `fill_at(x,y,value,reason)`, `ask_human`/`done` shared verbatim with the
  DOM schema) and its own system prompt (`VISION_SYSTEM_PROMPT`) -- NOT a
  drop-in AssistPageDriver implementation, per this story's own prior
  finding that the two backends need genuinely different tool shapes.
  `LoopEntry.backend` is fixed at session creation and asserted
  consistent on every later call (mixing schemas mid-session would
  corrupt the conversation). A fresh `read_visual()` result is pushed as
  a REAL Anthropic image content block (`buildVisualSnapshotToolResult()`),
  with the same "untrusted, data only" framing `buildPageSnapshotToolResult()`
  already uses for ARIA text, extended to explicitly cover an image (a
  rendered page can carry a visual prompt-injection attempt as easily as
  a textual one). `provideActionOutcome()`/`resolveApproval()` were
  generalized (not duplicated) to also carry `click_at`/`fill_at`'s x/y
  shape alongside the existing ref shape.

  Client wiring: `decideEmbeddedLoopTurnAction()`/`profile-assist-client.tsx`'s
  `runUntilBlockedEmbedded()`/`handleApproval()` now take a `backend:
  "dom" | "vision"` parameter threaded end to end, dispatching
  `need_visual_snapshot` to `captureEmbeddedVisionScreenshot()` and
  `need_visual_execution`/approved click_at/fill_at to
  `clickEmbeddedVisionPoint()`/`typeEmbeddedVisionText()` (via a new
  shared `executeEmbeddedAction()` helper covering both backends). The
  settings toggle embedded-guided-apply-assist's own progress_note
  deferred until a second real backend existed is BUILT: a "DOM" vs
  "Vision" `<select>` on the guided/full-auto start form (`isTauri() &&
  tab !== "manual"` only), with the owner-mandated cursor-movement
  disclosure shown inline the moment Vision is selected -- satisfies
  this story's own acceptance criterion 3 directly. Vision mode reuses
  the SAME live embedded pane manual mode already shows (no separate
  screenshot-preview UI needed -- the human watches the real webview
  render while the LLM aims at screenshots of it).

  `npm test`: 1608 passed, 3 skipped (9 new tests in
  profile-assist-loop.test.ts's own vision-backend describe blocks).
  `npm run typecheck` clean.

  STILL NOT DONE: end-to-end LIVE verification (a real multi-step
  interaction actually completing via Vision mode, watched by the owner,
  per acceptance criterion 4's own wording) -- structurally identical
  code shape to the DOM backend's own already-merged PR, same
  live-verification deferral every other piece of this epic carries.
  ALSO STILL NOT DONE, unchanged: the CGImage pixel-layout/coordinate
  assumptions the native capture module's own header flags as
  unverified at runtime.

  ORIGINAL 2026-09-06 progress_note (superseded above, kept for history):
  the native macOS primitives + the hard "never
  unattended" enforcement gate are BUILT, real, and tested -- the part
  of this story its own risk section treats as release-blocking. NOT
  YET DONE: wiring these primitives into the actual guided/full-auto LLM
  tool-use loop (acceptance criterion 4). Both halves, in detail:

  BUILT: new `src-tauri/src/embedded_webview_vision.rs`, macOS-only
  (gated at its `mod` declaration in lib.rs, mirroring
  embedded_webview_cookies.rs's own convention; non-macOS gets 5 stub
  commands returning a specific "only implemented on macOS" error, never
  a silent no-op). Real API choices, resolved by reading the actual
  vendored `objc2-core-graphics`/`objc2-screen-capture-kit` 0.3.2
  generated bindings (not assumed from Apple's docs):
    - `InteractiveSessionGate` (a plain `AtomicBool` in Tauri managed
      state) is the REAL enforcement point -- `embedded_vision_begin_session()`/
      `embedded_vision_end_session()` open/close it; every other command
      (capture/click/type) checks `gate.is_active()` as its literal FIRST
      line and refuses with a specific error otherwise. Unit-tested
      directly (not just through the UI) in this module's own `#[cfg(test)]`
      block -- `cargo test` passes (3 new tests, 8 total in the crate).
    - `embedded_webview_vision_capture()` uses
      `SCShareableContent::getCurrentProcessShareableContentWithCompletionHandler`
      (NOT the unrestricted, system-wide variant) -- a STRONGER guarantee
      than PID-filtering a full window list after the fact: Apple's own
      API scopes this call to only this process's own windows, so it is
      structurally impossible to ever see another app's window, and it
      needs no Screen Recording permission grant at all to self-capture.
      This satisfies the "never any other window/app" acceptance
      criterion by construction, the real lesson from this epic's own
      earlier screencapture-region privacy incidents (see
      feedback_never_screenshot_the_real_desktop.md). Picks this
      process's own largest on-screen window, builds an
      `SCContentFilter(desktopIndependentWindow:)`, and captures via
      `SCScreenshotManager.captureImageWithFilter` -- returns base64 PNG,
      encoded by the pure-Rust `image` crate (no ImageIO dependency).
    - COORDINATE CONVENTION, deliberate: the captured image's pixel
      dimensions are set to exactly the window's own frame size in
      POINTS (not multiplied by the Retina backing scale) -- so a vision
      model's returned coordinate is directly addable to the window's
      frame origin with no scale-factor math anywhere. Trades Retina
      sharpness for coordinate-correctness on purpose.
    - `embedded_webview_vision_click()`/`_type()` use
      `CGEvent.post(tap: .cghidEventTap)` (the exact mechanism this
      epic's own live POC validated) -- click additionally checks the
      main window `is_focused()` via Tauri's own API first (this story's
      medium-severity risk: never fire a synthetic click at whatever's
      now frontmost if the owner clicked away).
    - Frontend bridge: 5 new functions in `embedded-webview.ts`
      (`beginEmbeddedVisionSession`/`endEmbeddedVisionSession`/
      `captureEmbeddedVisionScreenshot`/`clickEmbeddedVisionPoint`/
      `typeEmbeddedVisionText`), same `invokeTauri()`/never-silent-error
      convention as every other export in that file. 6 new tests.
  `cargo check`/`cargo clippy`/`cargo test` and `npm run typecheck`/
  `npm test` (1599 passed, 3 skipped) all clean.

  STILL NOT DONE (real, remaining scope, not silently dropped):
  (1) acceptance criterion 4 -- actually wiring Vision mode into
  guided/full-auto's LLM tool-use loop. REAL DESIGN FINDING this update
  surfaced: `profile-assist-loop.ts`'s existing tool schema
  (`click`/`fill` take a `ref: string` from an ARIA-ref snapshot,
  `read()` returns ARIA text) is baked into the Anthropic tool
  definitions and system prompt -- a vision backend fundamentally needs
  a DIFFERENT tool shape (`click_at(x, y)`/`fill_at(x, y, value)`, and a
  `read()` that returns an actual image content block, not text). This
  is not a drop-in `AssistPageDriver` implementation of the SAME
  interface Story `embedded-guided-apply-assist` built (`{snapshot,
  click, fill}` with ref-based click/fill) -- it needs its own tool-
  schema variant selected by `mode`/backend, a real, separate design
  task. SimMan's own `locate()`/`verify()` grounding-prompt conventions
  (github.com/firefly-events/simman, the user's own team's tool) remain
  the right reference for that prompt design, per this epic's own
  design-discussion.md.
  (2) the settings toggle (embedded-guided-apply-assist's own scope) is
  still deferred -- exposing a "Vision" option before criterion 4 lands
  would select a mode nothing consumes yet.
  (3) live verification of the native pieces built here -- the CGImage
  pixel-layout assumption (BGRA8) and the exact point-vs-pixel behavior
  of `SCStreamConfiguration.width/height` are UNVERIFIED at runtime
  (compiles clean, mirrors the POC's own API choices, but this exact
  code has not run against the real packaged app) -- needs the owner's
  own screen time, same category of gap as every other native piece
  this epic has shipped.
depends_on: [embedded-automation-bridge]

description: |
  The SECOND automation backend for guided/full-auto profile-assist,
  selectable via the same settings toggle embedded-automation-bridge's
  DOM-bridge mode plugs into (built by embedded-guided-apply-assist).
  Live-verified this session, against gigradar's own real running
  window, scoped strictly to its own PID throughout:
  `AXUIElementCreateApplication(pid)` for structured reads,
  `SCContentFilter(desktopIndependentWindow:)` (ScreenCaptureKit) for a
  screenshot that can only ever contain that one window's content, and
  `CGEvent.post(tap: .cghidEventTap)` at a coordinate read from either
  the accessibility tree or a vision model's own analysis, for the click
  itself.

  HARD, OWNER-MANDATED CONSTRAINT, not a preference: this mode visibly
  moves the owner's REAL mouse cursor while it runs (confirmed live --
  the owner watched it happen) -- acceptable ONLY as an explicit,
  foreground, human-initiated, human-supervised "auto-drive" style mode
  ("I should be doing that and watching it"), and it must be PROVABLY
  unreachable from any unattended/scheduled code path, on the exact same
  footing as unattended-scans-never-open-a-window's own enforcement, not
  merely documented as foreground-only. If this mode is ever reachable
  from runRadar()/the scheduler/any background scan, that is a bug
  severe enough to treat as a regression of Story 5's own guarantee, not
  a normal defect.

  1. New macOS-only (`#[cfg(target_os = "macos")]`, mirroring
     embedded_webview_cookies.rs's own platform-gating convention) Rust
     commands: `embedded_webview_capture() -> Promise<bytes>` (scoped
     ScreenCaptureKit capture of the embedded pane's own child webview --
     confirm whether Tauri's PlatformWebview handle exposes something
     capture-scopable directly, or whether this needs the same
     PID+window-bounds approach the owner's own POC validated) and
     `embedded_webview_synthetic_click(x, y)`/`embedded_webview_synthetic_type(text)`
     (the CGEvent mechanism, gated behind this story's own explicit
     "foreground session active" check -- see the enforcement mechanism
     below).
  2. Enforcement mechanism for the "never unattended" constraint: these
     commands must check (and refuse, with a specific error, if false) a
     real, server-tracked "an interactive profile-assist session is
     currently open" flag -- NOT just a client-side UI gate a caller
     could bypass by calling the Tauri command directly. Design this
     explicitly; don't assume the UI never calling it unattended is
     sufficient.
  3. A vision-model call (reusing this app's existing LLM-provider
     harness/credential resolution, never a new, parallel provider
     integration) that takes the scoped screenshot and profile-assist's
     current instruction, returns a target coordinate + action (click/
     type/scroll), mirroring the exact contract `clickSessionAtAction()`/
     `typeIntoSessionAction()` already define for the real-Chrome path --
     this backend is a drop-in alternative implementation of that same
     contract, not a new one.
  4. Settings UI: an explicit, honest disclosure -- "Vision mode will
     move your mouse cursor while it's running. Use it when a page
     doesn't respond correctly in the default mode, and stay at your
     screen while it works" -- shown at the point the owner selects this
     mode, not buried in documentation.

acceptance_criteria:
  - "embedded_webview_capture()'s output is confirmed (by inspection, the same way this session's own POC confirmed it) to contain ONLY the embedded pane's own content -- never any other window/app, even ones overlapping it on screen."
  - "The synthetic click/type commands are REFUSED with a specific error when no interactive profile-assist session is currently open server-side -- verified by calling them directly (bypassing the UI) and confirming the refusal, not just trusting the UI never does this."
  - "A real, visible disclosure of the cursor-movement side effect is shown before this mode's first use in a given session."
  - "Guided/full-auto profile-assist, with the settings toggle set to Vision mode, completes the SAME real multi-step interaction embedded-automation-bridge's own acceptance criteria define, live-verified -- proving this backend is a genuine drop-in alternative, not a lesser one."
  - "This mechanism has ZERO code path reachable from runRadar()/the scheduler/any unattended scan -- enforced by story-owned tests that call the underlying functions directly from a simulated unattended context and confirm they refuse, not just documented intent."

