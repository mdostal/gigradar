  - id: t-003
    state: closed
    kind: bug
    title: "applyAiVerification() has the identical unbounded per-gig claude-CLI shape as t-002 -- CONFIRMED live/active: both of the owner's real groups have aiVerify:true"
    description: |
      Flagged by the developer fixing t-002 (2026-09-07), out of that
      story's own scope: `src/lib/matching/ai-verify.ts`'s
      `applyAiVerification()` -- called from the same per-gig loop in
      `src/lib/apply/runner.ts` as the now-fixed `applyRankBucketAiOverlay()`
      -- has the identical shape that caused t-002: a real claude-CLI/LLM
      call made per-gig (for groups with `aiVerify` opted in), with no
      per-call timeout and no per-cycle cap. This was NOT fixed as part of
      PR #182 (deliberately out of scope, to keep that PR focused), but is
      a real, live risk of reproducing the exact same "cycle takes tens of
      minutes" symptom independently, just for AI-VERIFICATION-opted-in
      groups instead of rankBucket-AI-overlay-opted-in ones.

      Needs the same class of fix PR #182 just shipped: a real per-call
      timeout on applyAiVerification()'s own LLM call (fall back to the
      heuristic match result on timeout -- ai-verify.ts's own header
      comment already states it's "never a replacement for the heuristic"),
      and a real per-cycle cap mirroring RANK_BUCKET_AI_OVERLAY_CAP's/
      AUTO_DRAFT_CAP's existing precedent in runner.ts.
    reporter: "developer (rank-bucket-ai-overlay-timeout-and-cap story), relayed via session diagnosis"
    reported_at: "2026-09-07T18:55:00Z"
    priority: p1
    severity: major
    linked_epic: usability-and-completeness-audit
    linked_story: ai-verify-timeout-and-cap
    closed_reason: "shipped in PR #183 -- same 20s per-call timeout + 10-call per-cycle cap pattern as t-002, reusing a shared raceWithTimeout() helper; regression tests prove the fallback and cap enforcement"
    closed_at: "2026-09-07T19:10:00Z"
