project_name: "gigradar"
type: brownfield
discovered: "2026-08-10"
source: "README.md + docs/ARCHITECTURE.md + codebase scan + legacy-tool inspection (the legacy tool's private codebase)"

project_type: consumer-app
has_ui: true

ship_target:
  kind: github-release

# No CLAUDE.md exists yet in this repo. Conventions below are drawn from
# README.md / docs/ARCHITECTURE.md, which currently serve that role.
claude_md_summary: |
  No CLAUDE.md present. Governing rules currently live in docs/ARCHITECTURE.md:
  - Strict core/user-layer separation: src/lib + src/app (core) knows nothing about
    any specific user; profile/needs/sources/credentials live in the user's own
    storage (.local/, env, private repo), never in the OSS repo.
  - Adding a source, changing rate rules, or wiring a private scraper must require
    zero edits to core code — config + a plugin only.
  - Data-integrity rules (non-negotiable): real per-listing URLs only (never a
    search page); no silent-zero on auth/fetch failure (must throw/report, never
    return empty as if "no matches"); every gate rejection carries a reason;
    applications are staged for human approval, never auto-submitted (today) —
    see north_star.success for the planned gated-auto-apply evolution; no
    fabricated data — unknown fields stay unknown.
  - Sources declare auth: "none" | "api-key" | "browser-session"; secrets are
    referenced (env/keychain/session-profile), never stored raw in Config.

tech_stack:
  languages: [typescript]
  frameworks: [next.js, react, zod]
  build_tools: [tsc, vitest, tsx]
  package_managers: [npm]
  versions:
    next: "^15.0.0"
    react: "^19.0.0"
    typescript: "^5.6.0"
    zod: "^3.23.0"
    vitest: "^2.1.0"
  notes: >
    No lockfile is committed yet, so the package manager is assumed (npm) rather
    than confirmed. src/app/ (the Next.js UI) does not exist yet — only src/lib/
    (core contracts, gate, apply runner, source plugin scaffold) is scaffolded.

structure:
  modules:
    - name: core
      purpose: >
        Generic OSS core — plugin framework, explainable gate/match engine,
        find→interact pipeline. Single module today, no monorepo split.
      source: src/lib/
      tests: (none yet)
  entry_points:
    - src/lib/apply/runner.ts   # `npm run radar` — tsx-run CLI entry
  key_files:
    - path: src/lib/types.ts
      purpose: Source of truth for domain types — Profile, Needs, Source, Gig, MatchResult, Config
    - path: src/lib/matching/gate.ts
      purpose: Pure, deterministic, explainable GO/NO-GO gate (ported from legacy gate.mjs)
    - path: src/lib/sources/source.ts
      purpose: Source plugin contract + registerSource()
    - path: src/lib/sources/example-source.ts
      purpose: Reference/demo Source implementation
    - path: src/lib/apply/runner.ts
      purpose: CLI runner scaffold for the find pipeline (assisted-apply layer not yet built)

architecture:
  pattern: plugin-core (generic core + user-layer config/plugins, no MVC/MVVM framing)
  di_framework: manual (registerSource() registry, no DI container)
  state_management: not yet applicable (no UI implemented)
  navigation: not yet applicable (Next.js app dir not scaffolded)
  data_layer: >
    Not yet implemented in the new core. Legacy tool (see legacy_source below) used
    a flat JSON file (data/gigs.json) with manual timestamped .bak copies as its
    only persistence — a primary source of the "flaky/inconsistent" pain the
    rewrite is meant to fix. New core needs a real persistence decision (still open).

conventions:
  naming: >
    camelCase for functions/vars, PascalCase for types/interfaces (types.ts is
    the single source of truth all other files import from).
  file_organization: src/lib/<domain>/<file>.ts (matching, sources, apply); one
    concern per file; JSDoc-style comments on exported types explain the "why"
    of each field (see types.ts).
  branching: not yet established (single commit on main so far)
  commit_messages: not yet established (one commit: "Scaffold gigradar: generic
    OSS core for finding + interacting with engagements")

