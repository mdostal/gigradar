north_star:
  goal: >
    Track fractional/contract engagement listings across enabled sources end to
    end — through applied → interview → outcome state, not just discovery —
    gather throughput/pipeline metrics, and surface a weekly overview + deep
    dive + suggestions to help the user improve their search. Ships first as its
    own standalone app + local dashboard (download-and-run, not hosted); a
    Pantheon-plugin-framework version is an explicit later port, not v1 scope.
    Each install is single-user: the owner configures their own profile,
    criteria, and sources (not hardcoded to any one person's fractional search).
    Built-in suggested templates for common role types (fractional COO/CFO/etc.,
    full-time by title) plus free-form custom source/criteria configuration
    (Monster, Dice, or anything else the user wants to point it at).
  audience: >
    Primary near-term user is the owner (fractional tech-leadership job search),
    but designed generically for OSS distribution — any single user downloads
    and runs their own local instance, configuring their own profile/needs/
    sources. Not fractional-specific by design.
  expected_scale: >
    Single-user, single-machine local install (download-and-run on your own
    computer). No concurrent/shared/multi-tenant usage in v1. A hosted
    wrapper-with-accounts is a possible future path if there's a clear case for
    it, explicitly not current scope.
  pain_points: >
    The owner's current private tool (legacy_source below) is flaky and
    inconsistent — a flat JSON file store patched by dozens of manually-named
    .bak snapshots, no automated tests, per-site browser-automation scripts that
    silently rot, and unreliable cron firing. The rewrite's bar is: fully
    tested, working, and consistent, with dependable scheduled runs.
  success: >
    Fully capture the available jobs; sort and track full application state
    (applied/interviewing/outcome); keep state accurate and up to date; ideally
    reach gated automatic submission with human-approved drafts ready to fire;
    plus a weekly metrics overview and deep-dive with suggestions, so any user
    can see their throughput and improve toward finding their next role.
  avoid: >
    Don't hardcode the owner's personal fractional criteria/keywords into the
    OSS core — it must stay generic and user-configured. Never commit or share
    credentials/session state. User settings/config/criteria must never be
    committed to the OSS repo — they belong to the local install, with an
    optional user-chosen backup path for that local state (e.g. Google Drive),
    not baked into core.

# ---------------------------------------------------------------------------
# Supplementary section (not part of the canonical kickoff-protocol schema,
# kept here because it materially informs planning): the private predecessor
# this core is replacing/porting logic from. Read this before scoping the
# first planning epic.
# ---------------------------------------------------------------------------
legacy_source:
  location: "a separate private machine the owner controls (details intentionally omitted from this OSS repo)"
  repo: "private, not published"
  runtime: >
    Plain Node ESM scripts (.mjs), no framework, no Docker. Browser automation
    via `playwright-cli` driving named persistent sessions (e.g. "mat" for
    A.Team/LinkedIn, "gf" for GoFractional — GoFractional specifically requires
    a headed, console-owned session or Cloudflare blocks it). Scheduled via a
    launchd plist (com.mdostal.gigradar.plist, RunAtLoad+KeepAlive) wrapping
    run-radar.sh/start-radar.sh; a local server.mjs serves a static
    dashboard.html.
  what_to_port:
    - platforms.mjs: a ~15-entry platform registry (key, url, session, login
      type, scrape boolean, tier) — the shape a new Source-plugin registry
      should generalize.
    - sources.mjs: per-platform discovery logic driving playwright sessions —
      reference for how real (non-demo) Source.fetch() implementations behave,
      including the "throw on auth failure, never silent-zero" rule already
      captured in this repo's ARCHITECTURE.md.
    - gate.mjs + config.mjs: the deterministic gate already ported to
      src/lib/matching/gate.ts, plus a green/yellow/red role-area TIERING layer
      (word-boundary keyword matching, title-first precedence) that has NOT
      been ported yet.
    - GATE.md's 4-check auto-apply gate (FIT, ECONOMICS, LIVE & NEW, FILLABLE)
      plus per-channel "auto-fire capability" — the design for the north_star
      success criterion of gated automatic submission. Today only GoFractional
      has a working logged-in submit automation; everything else is
      draft/surface for human review.
    - store.mjs (data/gigs.json + status transitions) — the fragile part to
      replace with a real persistence layer, not copy as-is.
    - drafts/ + interviews/ + application-answer-keys.md — the per-gig
      application-draft and interview-tracking pattern; feeds the "track state
      end to end" and "approved drafts ready to submit" success criteria.
    - dashboard.html / server.mjs — UI reference only (screenshot on file);
      the new core should build its own Next.js dashboard, not reuse this.
  explicitly_not_porting:
    - Any hardcoded personal criteria, keywords, credentials, session files, or
      the .bak-file backup habit — see north_star.avoid.

decisions_open:
  - "Persistence layer for the new core (legacy used a flat JSON file with manual .bak backups — explicitly called out as a reliability problem to fix, not replicate)."
  - "Package manager confirmation (no lockfile committed yet; npm assumed)."
  - "Local-install config/secrets storage + optional user-chosen backup mechanism (e.g. Google Drive) — referenced in north_star.avoid but not yet designed."
  - "Shape of the future Pantheon-plugin port — explicitly deferred past v1, but core boundaries should not preclude it."
