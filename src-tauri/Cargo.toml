[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon: tauri-real-auto-update story's channel-toggle UI is a native
# tray menu item, not a Next.js page (see structured-outline.md) -- needs
# this feature on to use tauri::tray/tauri::menu at all.
# unstable: true-embedded-browser epic, embedded-webview-child-mechanism
# story -- Window::add_child()/WebviewBuilder (a real child webview
# embedded in the main window) is gated behind this feature flag in the
# vendored tauri crate itself (confirmed by reading
# ~/.cargo/registry/.../tauri-2.11.5/src/window/mod.rs directly, not
# assumed from docs) -- see that story's own design-discussion.md for why
# this is an accepted, deliberate risk (the API itself may still evolve
# before Tauri stabilizes it).
tauri = { version = "2.11.3", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# true-embedded-browser epic, embedded-webview-cookie-extraction-macos
# story: real HttpOnly session-cookie reads via WKHTTPCookieStore --
# objc2/objc2-foundation/objc2-web-kit are already present TRANSITIVELY
# (pulled in by tauri-runtime-wry's own macOS webview backend, confirmed
# via `cargo tree`) but not otherwise usable as direct dependencies
# without declaring them explicitly; block2 backs WKHTTPCookieStore's own
# async completion-handler API. macOS-only (see this module's own
# #[cfg(target_os = "macos")] gate) -- `target_os`-scoped in
# [target.'cfg(...)'.dependencies] below so these never even attempt to
# build on Windows/Linux.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSHTTPCookie", "NSArray", "NSString", "NSDate"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
block2 = "0.6"
tokio = { version = "1", features = ["sync"] }
# embedded-vision-automation-mode story: CGEvent.post(tap: .cghidEventTap)
# for the synthetic click/type this story's own owner-mandated
# foreground-only mode requires (see that story's design-discussion.md
# §7 for the live POC this mirrors), and SCContentFilter(
# desktopIndependentWindow:) + SCScreenshotManager.captureImage() for a
# capture that can PROVABLY contain only the embedded pane's own window
# content, never any other app/window on screen (the real screenshot-
# privacy lesson from this epic's own POC phase -- see
# feedback_never_screenshot_the_real_desktop.md).
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["SCScreenshotManager", "SCShareableContent", "SCStream", "SCError", "std", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEventTypes", "CGEvent", "CGEventSource", "CGDirectDisplay", "CGWindow", "CGImage", "CGRemoteOperation", "CGDataProvider"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
base64 = "0.23.1"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes", "CFData", "std"] }
libc = "0.2.189"
